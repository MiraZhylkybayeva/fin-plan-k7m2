// ---- копирование плана между месяцами (буфер живёт в localStorage, переживает перезагрузку)
const MP_CLIP_KEY="finflow-mp-clipboard";
function mpClipboard(){ try{ const raw=localStorage.getItem(MP_CLIP_KEY); return raw?JSON.parse(raw):null; }catch{ return null; } }
function mpClone(src,year,month){ const copy=JSON.parse(JSON.stringify(src)); copy.id=uid(); copy.year=year; copy.month=month; copy.payday=mpLastDay(year,month); copy.groups.forEach(g=>g.items.forEach(i=>{ delete i.done; })); copy.incomes.forEach(i=>i.id=uid()); copy.groups.forEach(g=>{ g.id=uid(); g.items.forEach(i=>i.id=uid()); }); return copy; }
function mpAsText(p){ const t=mpTotals(p); const cur=DB.settings.baseCurrency; const lines=[`План на ${MONTHS_RU[p.month-1]} ${p.year}`,...p.incomes.map(i=>`${i.name}	${Math.round(i.amount/100)}	${mpPct(i.amount,t.income)}`),`Итого доход	${Math.round(t.income/100)}`,""]; for(const {g,total} of t.groups){ lines.push(`${g.name}	${Math.round(total/100)}	${mpPct(total,t.income)}`); for(const i of g.items) lines.push(`	${Math.round(i.amount/100)}	${mpPct(i.amount,t.income)}	${i.name}	${i.remaining?Math.round(i.remaining/100):""}`); lines.push(""); } lines.push(`TOTAL	${Math.round(t.spent/100)}	${mpPct(t.spent,t.income)}`,`Депозит (остаток)	${Math.round(t.left/100)}	${mpPct(t.left,t.income)}`); return lines.join("\n"); }
function mpPasteInto(year,month,src){ const existing=mpFind(year,month); if(existing){ if(!confirm(`За ${MONTHS_RU[month-1]} ${year} план уже есть. Заменить его скопированным?`)) return false; DB.monthPlans=DB.monthPlans.filter(p=>p.id!==existing.id); } DB.monthPlans.push(mpClone(src,year,month)); saveDb(); return true; }
ACTIONS.mpCopyClip=()=>{ const p=mpCurrent(); if(!p) return; try{ localStorage.setItem(MP_CLIP_KEY,JSON.stringify(p)); }catch{} UI.mpClip=p; if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(mpAsText(p)).catch(()=>{}); UI.mpFlash=`План за ${MONTHS_RU[p.month-1]} ${p.year} скопирован — откройте другой месяц и нажмите «Вставить». Текстовая копия также в буфере обмена (для Excel).`; rerender(); setTimeout(()=>{ UI.mpFlash=null; },4000); };
ACTIONS.mpPaste=el=>{ const clip=mpClipboard()||UI.mpClip; if(!clip) return; if(mpPasteInto(Number(el.dataset.y),Number(el.dataset.m),clip)) rerender(); };
ACTIONS.mpToNext=el=>{ const p=mpCurrent(); if(!p) return; const y=Number(el.dataset.y), m=Number(el.dataset.m); if(mpPasteInto(y,m,p)){ UI.mpYear=y; UI.mpMonth=m; navigate(`/month?year=${y}&month=${m}`); } };

// ---- связь строки плана с кредитом: остаток берётся из раздела «Кредиты», галочка «оплачено» списывает платёж
function mpPayments(){ if(!Array.isArray(DB.loanPayments)) DB.loanPayments=[]; return DB.loanPayments; }
/** Кредиты, к которым привязана строка: список выбранных, один кредит или банк целиком. */
function mpItemLoans(item){ const loans=DB.debts.filter(d=>!d.archived); if(Array.isArray(item.loanIds)&&item.loanIds.length) return loans.filter(l=>item.loanIds.includes(l.id)); if(item.loanId){ const l=loans.find(x=>x.id===item.loanId); return l?[l]:[]; } if(item.bankName!==undefined) return loans.filter(l=>loanBankName(l)===item.bankName); return []; }
function mpItemLinked(item){ return !!(item.loanId||item.bankName!==undefined||(Array.isArray(item.loanIds)&&item.loanIds.length)); }
function mpItemLinkLabel(item){ if(item.bankName!==undefined) return `банк «${item.bankName}» целиком`; const ls=mpItemLoans(item); return ls.length?ls.map(loanTitle).join(", "):"кредит не найден"; }
function mpRemainingCell(item,plan){
  if(!mpItemLinked(item)) return mpAmountInput(item.id,"remaining",item.remaining,'placeholder="остаток" aria-label="Остаток долга" style="opacity:.85"');
  const ls=mpItemLoans(item); if(!ls.length) return `<span class="mp-loan tabular" style="opacity:.6" title="Связанные кредиты удалены — нажмите 🔗 и выберите заново">нет кредита</span>`;
  const bal=ls.reduce((a,l)=>a+l.balance,0); const href=item.bankName!==undefined?`#/loans?bank=${encodeURIComponent(item.bankName)}`:`#/loans?ids=${ls.map(l=>l.id).join(",")}`;
  return `<a class="mp-loan tabular" href="${href}" title="${esc(mpItemLinkLabel(item))} · остаток подтягивается из раздела «Кредиты»">${esc(fmt(bal,ls[0].currency))} ↗</a>`;
}
/** Панель выбора связи: категория для бюджета, банк целиком или галочки по отдельным кредитам. */
function mpLinkPanel(item){
  const loans=DB.debts.filter(d=>!d.archived&&loanBankName(d)); const banks=loanBanks(loans); const cur=DB.settings.baseCurrency; const id=item.id;
  const mode=item.categoryId?"cat":item.bankName!==undefined?"bank":(item.loanIds&&item.loanIds.length)||item.loanId?"loans":"none"; const chosen=new Set(item.loanIds||(item.loanId?[item.loanId]:[]));
  const cats=activeCategories().filter(c=>c.kind==="EXPENSE");
  const loanList=[...banks.entries()].map(([bank,ls])=>`<div class="mp-lk-bank"><div class="xs semi" style="margin:6px 0 2px;color:${bankColor(bank)};filter:brightness(1.3)">${esc(bank||"Без банка")} <span class="muted" style="font-weight:400">· ${ls.length}</span> <button type="button" class="link-btn xxs" data-act="mpLinkPickBank" data-id="${id}" data-bank="${esc(bank)}">все</button></div>${ls.map(l=>`<label class="mp-lk-row"><input type="checkbox" name="loan-${id}" value="${l.id}" ${chosen.has(l.id)?"checked":""} data-change="mpLinkPick" data-id="${id}"><span class="trunc">${esc(loanTitle(l))}</span><span class="tabular muted">остаток ${esc(fmt(l.balance,cur))} · ${esc(fmt(l.monthlyPayment,cur))}/мес</span></label>`).join("")}</div>`).join("");
  return `<div class="mp-linkpanel" data-panel="${id}">
    <div class="xs semi mb2" style="margin-bottom:6px">С чем связать строку «${esc(item.name||"без названия")}»</div>
    <label class="mp-lk-opt"><input type="radio" name="lk-${id}" value="none" ${mode==="none"?"checked":""}> не связывать (остаток вводится вручную)</label>
    <label class="mp-lk-opt"><input type="radio" name="lk-${id}" value="cat" ${mode==="cat"?"checked":""}> категория расходов — лимит в «Лимитах»: <select name="cat-${id}" class="mp-in mp-linksel" data-change="mpLinkPickCat" data-id="${id}">${options(cats.map(c=>({value:c.id,label:c.icon+" "+c.name})),item.categoryId||"","— выберите —")}</select></label>
    ${banks.size?`<label class="mp-lk-opt"><input type="radio" name="lk-${id}" value="bank" ${mode==="bank"?"checked":""}> банк целиком (все кредиты банка, платёж = сумма): <select name="bank-${id}" class="mp-in mp-linksel" data-change="mpLinkPickBankSel" data-id="${id}">${options([...banks.keys()].filter(Boolean).map(b=>({value:b,label:b})),item.bankName||"","— выберите —")}</select></label>`:""}
    ${loans.length?`<label class="mp-lk-opt"><input type="radio" name="lk-${id}" value="loans" ${mode==="loans"?"checked":""}> выбранные кредиты (остаток = сумма остатков, обновляется сам):</label><div class="mp-lk-list">${loanList}</div>`:`<p class="xs muted">Кредитов пока нет — добавьте их в разделе «Кредиты».</p>`}
    <div class="row mt2" style="gap:8px"><button type="button" class="btn primary sm" data-act="mpLinkApply" data-id="${id}">Готово</button><button type="button" class="btn secondary sm" data-act="mpLink" data-id="${id}">Отмена</button></div></div>`;
}
function mpFindItem(id){ const p=mpCurrent(); if(!p) return null; for(const g of p.groups){ const it=g.items.find(x=>x.id===id); if(it) return it; } return null; }
ACTIONS.mpLink=el=>{ UI.mpLinking=UI.mpLinking===el.dataset.id?null:el.dataset.id; rerender(); };
ACTIONS.mpLinkPick=el=>{ const r=document.querySelector(`input[name="lk-${el.dataset.id}"][value="loans"]`); if(r) r.checked=true; };
ACTIONS.mpLinkPickCat=el=>{ const r=document.querySelector(`input[name="lk-${el.dataset.id}"][value="cat"]`); if(r) r.checked=true; };
ACTIONS.mpLinkPickBankSel=el=>{ const r=document.querySelector(`input[name="lk-${el.dataset.id}"][value="bank"]`); if(r) r.checked=true; };
ACTIONS.mpLinkPickBank=el=>{ const ids=DB.debts.filter(d=>!d.archived&&loanBankName(d)===el.dataset.bank).map(d=>d.id); const boxes=[...document.querySelectorAll(`input[name="loan-${el.dataset.id}"]`)].filter(b=>ids.includes(b.value)); const all=boxes.every(b=>b.checked); boxes.forEach(b=>{ b.checked=!all; }); const r=document.querySelector(`input[name="lk-${el.dataset.id}"][value="loans"]`); if(r) r.checked=true; };
ACTIONS.mpLinkApply=el=>{ const id=el.dataset.id; const item=mpFindItem(id); if(!item) return; const panel=document.querySelector(`[data-panel="${id}"]`); if(!panel) return;
  const mode=(panel.querySelector(`input[name="lk-${id}"]:checked`)||{}).value||"none"; const loans=DB.debts.filter(d=>!d.archived);
  delete item.loanId; delete item.loanIds; delete item.bankName; delete item.categoryId;
  if(mode==="cat"){ const c=panel.querySelector(`select[name="cat-${id}"]`).value; if(c) item.categoryId=c; }
  else if(mode==="bank"){ const bank=panel.querySelector(`select[name="bank-${id}"]`).value; if(bank){ item.bankName=bank; const ls=loans.filter(l=>loanBankName(l)===bank); if(!item.name) item.name=bank; const pm=ls.reduce((a,l)=>a+l.monthlyPayment,0); if(pm) item.amount=pm; item.remaining=0; } }
  else if(mode==="loans"){ const ids=[...panel.querySelectorAll(`input[name="loan-${id}"]:checked`)].map(b=>b.value); if(ids.length){ item.loanIds=ids; const ls=loans.filter(l=>ids.includes(l.id)); if(!item.name) item.name=ls.length===1?loanTitle(ls[0]):`${ls[0].bank||"Кредиты"} (${ls.length})`; const pm=ls.reduce((a,l)=>a+l.monthlyPayment,0); if(pm) item.amount=pm; item.remaining=0; } }
  UI.mpLinking=null; commit(); };
ACTIONS.mpLinkSet=el=>{ /* совместимость со старым выпадающим списком */ const item=mpFindItem(el.dataset.id); if(!item) return; delete item.loanId; delete item.loanIds; delete item.bankName; delete item.categoryId;
  if(el.value.startsWith("cat:")) item.categoryId=el.value.slice(4); else if(el.value.startsWith("bank:")){ item.bankName=el.value.slice(5); const ls=mpItemLoans(item); if(!item.name) item.name=item.bankName; const pm=ls.reduce((a,l)=>a+l.monthlyPayment,0); if(pm) item.amount=pm; item.remaining=0; } else if(el.value){ item.loanIds=[el.value]; const ls=mpItemLoans(item); if(ls[0]){ if(!item.name) item.name=ls[0].name; if(!item.amount&&ls[0].monthlyPayment) item.amount=ls[0].monthlyPayment; } }
  UI.mpLinking=null; commit(); };
ACTIONS.mpPaid=el=>{ const p=mpCurrent(); if(!p) return; const item=mpFindItem(el.dataset.id); if(!item) return;
  if(!mpItemLinked(item)){ item.done=el.checked; commit(); return; }
  const ls=mpItemLoans(item); const pays=mpPayments(); const mine=pays.filter(x=>x.planItemId===item.id);
  if(el.checked&&mine.length===0){ if(ls.length===0){ item.done=true; commit(); return; }
    for(const l of ls){ const planned=ls.length===1&&item.amount>0?item.amount:l.monthlyPayment; const amount=Math.min(planned,l.balance); if(amount<=0) continue; l.balance-=amount; pays.push({id:uid(),debtId:l.id,planItemId:item.id,year:p.year,month:p.month,amount,at:new Date().toISOString()}); } }
  else if(!el.checked&&mine.length){ for(const x of mine){ const l=DB.debts.find(d=>d.id===x.debtId); if(l) l.balance+=x.amount; } DB.loanPayments=pays.filter(x=>x.planItemId!==item.id); }
  else item.done=el.checked;
  commit(); };
ACTIONS.mpMakeLoans=el=>{ const p=mpCurrent(); const g=p&&p.groups.find(x=>x.id===el.dataset.id); if(!g) return; const cur=DB.settings.baseCurrency; let n=0;
  for(const item of g.items){ if(mpItemLinked(item)||item.remaining<=0) continue; const d={id:uid(),name:item.name||"Кредит",kind:"BANK",principal:item.remaining,balance:item.remaining,monthlyPayment:item.amount,annualRateBp:0,termMonths:item.amount>0?Math.ceil(item.remaining/item.amount):0,overdueAmount:0,penalty:0,currency:cur,purpose:null,note:null,archived:false}; DB.debts.push(d); item.loanId=d.id; n++; }
  if(n) UI.mpFlash=`Создано кредитов: ${n}. Они появились в разделе «Кредиты» и связаны со строками плана.`; commit(); setTimeout(()=>{ UI.mpFlash=null; },5000); };

// ---- связь строки плана с категорией расходов: явная (🔗) или по совпадению названия
function mpItemCategory(item){ if(mpItemLinked(item)) return null; const cats=DB.categories.filter(c=>c.kind==="EXPENSE"&&!c.archived); if(item.categoryId) return cats.find(c=>c.id===item.categoryId)||null; const name=(item.name||"").toLowerCase().trim(); if(name.length<3) return null; return cats.find(c=>{ const cn=c.name.toLowerCase(); return cn===name||name.includes(cn)||(cn.includes(name)&&name.length>=4); })||null; }
/** Лимиты из плана на месяц: {item, category, group, amount} для всех строк, привязанных к категории. */
function mpBudgetItems(year,month){ const p=mpFind(year,month); if(!p) return []; const out=[]; for(const g of p.groups) for(const item of g.items){ const c=mpItemCategory(item); if(c&&item.amount>0) out.push({item,category:c,group:g,amount:item.amount}); } return out; }

// ---- подтянуть строки по банкам из раздела «Кредиты»
ACTIONS.mpSyncLoans=el=>{ const p=mpCurrent(); const g=p&&p.groups.find(x=>x.id===el.dataset.id); if(!g) return; const loans=DB.debts.filter(d=>!d.archived); const banks=loanBanks(loans); let created=0, updated=0;
  const hasLinks=g.items.some(mpItemLinked);
  for(const [bank,ls] of banks){ if(!bank||hasLinks) continue; const pay=ls.reduce((a,l)=>a+l.monthlyPayment,0); const row=g.items.find(i=>i.bankName===bank); if(row){ if(row.amount!==pay){ row.amount=pay; updated++; } } else if(pay>0||bank){ g.items.push({id:uid(),name:bank||"Без банка",amount:pay,remaining:0,bankName:bank}); created++; } }
  for(const i of g.items){ if(mpItemLinked(i)){ const pm=mpItemLoans(i).reduce((a,l)=>a+l.monthlyPayment,0); if(pm&&i.amount!==pm){ i.amount=pm; updated++; } } }
  const stale=g.items.filter(i=>!i.loanId&&i.bankName===undefined).length;
  UI.mpFlash=`Пересчитано из кредитов: платежей обновлено ${updated}${created?`, строк по банкам добавлено ${created}`:""}. Платёж связанной строки = сумма платежей её кредитов; остатки подтягиваются автоматически.${stale?` Строк без связи с кредитами: ${stale} — удалите их ✕, если они дублируют банки.`:""}`; commit(); setTimeout(()=>{ UI.mpFlash=null; },8000); };

// ================= план %: подсказки финансиста и отклонения =================
const MP_RULES=[[/кредит|ипотек|рассроч|долг/i,{lo:0,hi:30,hint:"≤30",text:"платежи по кредитам — не больше 30% дохода (вместе с обязательными — до 50%)"}],[/обяз|жиль|квартир|коммун|продукт|еда|транспорт|связь/i,{lo:30,hi:40,hint:"30–40",text:"обязательные расходы (жильё, еда, транспорт, связь) — 30–40% дохода"}],[/подушк|резерв|депозит|инвест|накоп|сбереж|акци/i,{lo:10,hi:20,hint:"≥10",text:"сбережения и подушка — минимум 10%, лучше 20% дохода; сначала подушка на 3–6 месяцев, потом инвестиции"}],[/развлеч|карман|отдых|кафе|хобби/i,{lo:5,hi:10,hint:"5–10",text:"развлечения и карманные — 5–10% дохода"}],[/саморазв|образован|обучен|спорт|курс|красот/i,{lo:3,hi:10,hint:"3–10",text:"саморазвитие, спорт, уход — 3–10% дохода"}],[/фонд|родствен|родител|сест|брат|мам|пап|помощ/i,{lo:0,hi:10,hint:"≤10",text:"помощь родственникам — до 10% дохода, лучше фиксированной суммой"}],[/путеш|отпуск|vietnam|вьетнам|поездк/i,{lo:5,hi:10,hint:"5–10",text:"путешествия — 5–10%, откладывайте равными частями заранее"}],[/подпис/i,{lo:0,hi:3,hint:"≤3",text:"подписки — до 3% дохода; раз в квартал отключайте неиспользуемые"}]];
function mpRecommend(name){ for(const [re,r] of MP_RULES) if(re.test(name||"")) return r; return null; }
function mpDevText(dev,amt){ if(dev===null||dev===undefined||!Number.isFinite(dev)) return "—"; const pp=(dev>0?"+":"")+dev.toFixed(1).replace(".",",")+" п.п."; if(amt===undefined) return pp; return `<span class="mp-dev-amt">${esc(fmtSigned(amt,DB.settings.baseCurrency))}</span><span class="mp-dev-pp">${pp}</span>`; }
function mpDevStyle(dev,rec){ if(dev===null||dev===undefined||!Number.isFinite(dev)) return "opacity:.6"; const bad=dev>1; return `font-weight:700;padding:1px 6px;border-radius:4px;background:${Math.abs(dev)<=1?"rgba(255,255,255,.18)":bad?"#d03b3b":"#0ca30c"};color:#fff`; }
function mpAdviceCard(t){ const tips=[]; const inc=t.income||0; const share=(re)=>t.groups.filter(({g})=>re.test(g.name)).reduce((a,{total})=>a+total,0)/(inc||1)*100;
  const credit=share(/кредит|ипотек|рассроч|долг/i), must=share(/обяз|жиль|квартир|коммун|продукт|еда|транспорт|связь/i), save=share(/подушк|резерв|депозит|инвест|накоп|сбереж|акци/i), fun=share(/развлеч|карман|отдых|кафе|хобби/i);
  if(inc>0){ if(credit>30) tips.push(`Кредиты забирают <b>${credit.toFixed(0)}%</b> дохода — выше нормы 30%. Приоритет: досрочно закрывать самые дорогие (см. «Кредиты → Досрочное погашение»).`); if(credit+must>50) tips.push(`Кредиты + обязательные = <b>${(credit+must).toFixed(0)}%</b>. Здоровая граница — 50%: пока она выше, новых обязательств лучше не брать.`); if(save<10) tips.push(`На сбережения и подушку идёт <b>${save.toFixed(0)}%</b> — цель минимум 10%. Даже 5% ежемесячно стабильно лучше, чем 20% «когда получится».`); if(fun>10) tips.push(`Развлечения и карманные — <b>${fun.toFixed(0)}%</b>, ориентир 5–10%.`); if(t.left<0) tips.push(`План расходов больше дохода на <b>${fmt(-t.left,DB.settings.baseCurrency)}</b> — урежьте конверты или перенесите часть на следующий месяц.`); if(t.left>0&&t.left/inc>0.2&&save<10) tips.push(`Остаток «депозит» ${(t.left/inc*100).toFixed(0)}% — хорошо, но он не закреплён: заведите строку в конверте сбережений, чтобы он не растворился.`); }
  const missing=t.groups.filter(({g})=>g.planPct===undefined||g.planPct===null||g.planPct==="").length;
  return `<div class="mp-block mp-hints" style="background:var(--surface);color:var(--text-primary);border:1px solid var(--border)"><div class="xs semi" style="margin-bottom:4px">Подсказки финансиста</div>${tips.length?`<ul class="xs sec" style="padding-left:16px;line-height:1.6">${tips.map(x=>`<li>${x}</li>`).join("")}</ul>`:`<p class="xs sec">Доли выглядят здорово: кредиты ${credit.toFixed(0)}%, обязательные ${must.toFixed(0)}%, сбережения ${save.toFixed(0)}%.</p>`}${missing?`<p class="xxs muted mt2">Впишите «план %» у конвертов — серые подсказки в полях показывают рекомендуемую долю (кредиты ≤30, обязательные 30–40, сбережения ≥10, развлечения 5–10, родственники ≤10, подписки ≤3). Отклонение считается в процентных пунктах: красное — выше плана, зелёное — ниже.</p>`:""}</div>`; }
ACTIONS.mpPlanPct=el=>{ const p=mpCurrent(); const g=p&&p.groups.find(x=>x.id===el.dataset.id); if(!g) return; const v=el.value.trim().replace(",",".").replace("%",""); if(v===""){ delete g.planPct; } else { const num=Number(v); if(!Number.isFinite(num)||num<0||num>100){ el.style.outline="2px solid var(--status-critical)"; return; } g.planPct=num; } el.style.outline=""; saveDb(); mpRecalc(p); const tot=document.querySelector('[data-mp="planpct"]'); const sum=p.groups.reduce((a,x)=>a+(Number(x.planPct)||0),0); if(tot) tot.textContent=sum?sum.toFixed(0)+"%":""; const rec=mpRecommend(g.name); if(rec&&(num=>num!==undefined&&(num<rec.lo||num>rec.hi))(g.planPct)){ UI.mpFlash=`«${g.name}»: вы поставили ${g.planPct}%. Финансист советует: ${rec.text}.`; rerender(); setTimeout(()=>{ UI.mpFlash=null; },7000); } };
ACTIONS.mpFromPrev=el=>{ const src=mpFind(Number(el.dataset.py),Number(el.dataset.pm)); if(!src) return; if(mpPasteInto(Number(el.dataset.y),Number(el.dataset.m),src)) rerender(); };
// ================= подписки =================
function mpSubs(){ if(!Array.isArray(DB.subscriptions)) DB.subscriptions=[]; return DB.subscriptions; }
function subMonthly(s){ return s.period==="YEARLY"?Math.round(s.amount/12):s.period==="HALFYEAR"?Math.round(s.amount/6):s.period==="QUARTER"?Math.round(s.amount/3):s.period==="WEEKLY"?Math.round(s.amount*52/12):s.amount; }
function mpSubscriptionsCard(plan){ const subs=mpSubs(); const cur=DB.settings.baseCurrency; const active=subs.filter(s=>s.active!==false); const total=active.reduce((a,s)=>a+subMonthly(s),0); const income=plan?mpTotals(plan).income:0;
  const rows=subs.map(s=>`<div class="mp-row mp-item ${s.active===false?"mp-done":""}"><input type="checkbox" class="mp-chk" ${s.active!==false?"checked":""} data-change="subEdit" data-id="${s.id}" data-field="active" title="Активна"><input class="mp-in mp-name" value="${esc(s.name)}" placeholder="Netflix, Spotify, зал…" data-change="subEdit" data-id="${s.id}" data-field="name"><input class="mp-in mp-amt tabular" inputmode="decimal" value="${s.amount?String(Math.round(s.amount/100)).replace(/\B(?=(\d{3})+(?!\d))/g," "):""}" data-change="subEdit" data-id="${s.id}" data-field="amount" aria-label="Сумма"><select class="mp-in" style="width:6rem" data-change="subEdit" data-id="${s.id}" data-field="period">${options([{value:"MONTHLY",label:"в месяц"},{value:"QUARTER",label:"за 3 месяца"},{value:"HALFYEAR",label:"за 6 месяцев"},{value:"YEARLY",label:"в год"},{value:"WEEKLY",label:"в неделю"}],s.period||"MONTHLY")}</select><input class="mp-in tabular" style="width:3.2rem;text-align:right" inputmode="numeric" value="${s.day||""}" placeholder="день" title="День списания" data-change="subEdit" data-id="${s.id}" data-field="day"><select class="mp-in" style="width:3.6rem" data-change="subEdit" data-id="${s.id}" data-field="owner" title="Чья">${options([{value:"",label:"—"},{value:"М",label:"М"},{value:"Л",label:"Л"}],s.owner||"")}</select><span class="mp-pct" title="в месяц">${esc(fmt(subMonthly(s),cur))}</span><button type="button" class="mp-x" data-act="subDel" data-id="${s.id}" aria-label="Удалить">✕</button></div>`).join("");
  return `<section class="mp-block" style="background:#3f3a2e;color:#fff"><div class="mp-row mp-head"><span>Подписки <span class="xs" style="opacity:.75;font-weight:400">· ${active.length} активн. · ${esc(fmt(total,cur))}/мес${income?` · ${mpPct(total,income)} дохода`:""}</span></span><span class="row" style="gap:6px"><span class="xs" style="opacity:.75">в плане — конверт «Подписки»</span><button type="button" class="mp-add" data-act="subAdd">+ подписка</button></span></div>${rows||`<div class="mp-row"><span class="muted-inherit xs">Добавьте подписки — Netflix, Spotify, спортзал, связь. Годовые пересчитаются в месячные.</span></div>`}</section>`; }
ACTIONS.subAdd=()=>{ mpSubs().push({id:uid(),name:"",amount:0,period:"MONTHLY",day:"",owner:"",active:true}); commit(); const last=mpSubs()[mpSubs().length-1]; const el=document.querySelector(`input[data-id="${last.id}"][data-field="name"]`); if(el) el.focus(); };
ACTIONS.subDel=el=>{ DB.subscriptions=mpSubs().filter(s=>s.id!==el.dataset.id); commit(); };
ACTIONS.subEdit=el=>{ const s=mpSubs().find(x=>x.id===el.dataset.id); if(!s) return; const f=el.dataset.field; if(f==="active") s.active=el.checked; else if(f==="amount"){ const v=mpParse(el.value); if(v===null){ el.style.outline="2px solid var(--status-critical)"; return; } el.style.outline=""; s.amount=v; } else if(f==="day"){ s.day=Number(String(el.value).replace(/\D/g,""))||""; } else s[f]=el.value.trim(); commit(); };
ACTIONS.subToPlan=()=>{ const p=mpCurrent(); if(!p) return; let g=p.groups.find(x=>/подпис/i.test(x.name)); if(!g){ g={id:uid(),name:"Подписки",color:"#78716c",items:[]}; p.groups.push(g); } const cat=DB.categories.find(c=>c.kind==="EXPENSE"&&/подпис/i.test(c.name)); let created=0, updated=0;
  for(const s of mpSubs().filter(x=>x.active!==false)){ const amt=subMonthly(s); let row=g.items.find(i=>i.subId===s.id); if(row){ if(row.amount!==amt||row.name!==s.name){ row.amount=amt; row.name=s.name; updated++; } } else { g.items.push({id:uid(),name:s.name,amount:amt,remaining:0,subId:s.id,categoryId:cat?cat.id:undefined}); created++; } }
  const gone=g.items.filter(i=>i.subId&&!mpSubs().some(s=>s.id===i.subId&&s.active!==false)); g.items=g.items.filter(i=>!gone.includes(i));
  UI.mpFlash=`Подписки в плане: добавлено ${created}, обновлено ${updated}${gone.length?`, убрано ${gone.length}`:""}.`; commit(); setTimeout(()=>{ UI.mpFlash=null; },6000); };

/** Платёж связанной строки всегда равен сумме платежей её кредитов — без кнопок и перерисовок. */
function mpSyncLinkedAmounts(plan){ let changed=false; for(const g of plan.groups){ if(mpGroupIsEarly(g)){ for(const i of g.items) if(!i.early){ i.early=true; changed=true; } continue; } for(const i of g.items){ if(!mpItemLinked(i)||i.early) continue; const ls=mpItemLoans(i); if(!ls.length) continue; const pm=ls.reduce((a,l)=>a+l.monthlyPayment,0); if(pm>0&&i.amount!==pm){ i.amount=pm; changed=true; } } } if(changed) saveDb(); }

ACTIONS.mpIncomeSource=el=>{ const p=mpCurrent(); const i=p&&p.incomes.find(x=>x.id===el.dataset.id); if(i){ i.source=el.value; saveDb(); } };

// ---- порядок конвертов: перетаскивание и стрелки
function mpMoveGroup(id,toIndex){ const p=mpCurrent(); if(!p) return; const from=p.groups.findIndex(g=>g.id===id); if(from<0) return; toIndex=Math.max(0,Math.min(p.groups.length-1,toIndex)); if(from===toIndex) return; const [g]=p.groups.splice(from,1); p.groups.splice(toIndex,0,g); commit(); }
ACTIONS.mpGroupMove=el=>{ const p=mpCurrent(); if(!p) return; const i=p.groups.findIndex(g=>g.id===el.dataset.id); mpMoveGroup(el.dataset.id,i+Number(el.dataset.dir)); };
// Перетаскивание конвертов указателем (мышь/палец): надёжнее HTML5 drag&drop, не выделяет текст.
(function(){ let drag=null;
  document.addEventListener("pointerdown",e=>{ if(e.button!==undefined&&e.button!==0) return; const h=e.target.closest&&e.target.closest(".mp-draghandle"); if(!h) return; if(e.target.closest("input,select,button,textarea,a")) return; const sec=h.closest(".mp-group"); if(!sec) return; e.preventDefault(); drag={id:sec.dataset.groupId,sec,startY:e.clientY,moved:false}; sec.classList.add("mp-dragging"); document.body.classList.add("mp-noselect"); });
  document.addEventListener("pointermove",e=>{ if(!drag) return; if(Math.abs(e.clientY-drag.startY)>4) drag.moved=true; if(!drag.moved) return; e.preventDefault(); document.querySelectorAll(".mp-group").forEach(x=>x.classList.remove("mp-drop-before","mp-drop-after")); const under=document.elementFromPoint(e.clientX,e.clientY); const sec=under&&under.closest?under.closest(".mp-group"):null; if(!sec||sec===drag.sec){ drag.target=null; return; } const r=sec.getBoundingClientRect(); const before=(e.clientY-r.top)<r.height/2; sec.classList.add(before?"mp-drop-before":"mp-drop-after"); drag.target={id:sec.dataset.groupId,before}; },{passive:false});
  const finish=e=>{ if(!drag) return; const d=drag; drag=null; document.body.classList.remove("mp-noselect"); document.querySelectorAll(".mp-group").forEach(x=>x.classList.remove("mp-drop-before","mp-drop-after","mp-dragging")); if(!d.moved||!d.target) return; const p=mpCurrent(); if(!p) return; const from=p.groups.findIndex(g=>g.id===d.id); let to=p.groups.findIndex(g=>g.id===d.target.id); if(from<0||to<0) return; if(!d.target.before) to+=1; if(from<to) to-=1; mpMoveGroup(d.id,to); };
  document.addEventListener("pointerup",finish); document.addEventListener("pointercancel",finish);
})();

/** Конверт «кредитный»: называется «Кредиты…» или уже содержит связанные с кредитами строки — только там нужны остаток и 🔗. */
function mpGroupIsLoans(g){ return /кредит|ипотек|рассроч|долг|досроч/i.test(g.name||"")||g.items.some(mpItemLinked); }
function mpGroupIsEarly(g){ return /досроч/i.test(g.name||""); }

/** Подписки всегда входят в план: конверт «Подписки» создаётся и обновляется автоматически при открытии плана. */
function mpSyncSubs(p){ const subs=mpSubs().filter(x=>x.active!==false&&(x.amount>0||x.name)); let g=p.groups.find(x=>/подпис/i.test(x.name)); let changed=false;
  if(!g){ if(!subs.length) return; g={id:uid(),name:"Подписки",color:"#78716c",items:[]}; p.groups.push(g); changed=true; }
  const cat=DB.categories.find(c=>c.kind==="EXPENSE"&&/подпис/i.test(c.name));
  for(const s of subs){ const amt=subMonthly(s); let row=g.items.find(i=>i.subId===s.id); if(row){ if(row.amount!==amt){ row.amount=amt; changed=true; } if(row.name!==s.name&&s.name){ row.name=s.name; changed=true; } } else { g.items.push({id:uid(),name:s.name,amount:amt,remaining:0,subId:s.id,categoryId:cat?cat.id:undefined}); changed=true; } }
  const keep=new Set(subs.map(s=>s.id)); const before=g.items.length; g.items=g.items.filter(i=>!i.subId||keep.has(i.subId)); if(g.items.length!==before) changed=true;
  if(changed) saveDb(); }

// ================= календарь планов: несколько месяцев в одной таблице =================
function mpCalendarView(params){ mpEnsure(); const cur=DB.settings.baseCurrency; const today=todayUtc(); const nowKey=today.getUTCFullYear()*12+today.getUTCMonth();
  const keys=DB.monthPlans.map(p=>p.year*12+p.month-1); let from=Math.min(nowKey,...keys), to=Math.max(nowKey+5,...keys)+1; if(params.from){ const [fy,fm]=params.from.split("-").map(Number); if(fy&&fm) from=fy*12+fm-1; } if(to-from>24) to=from+24;
  const months=[]; for(let k=from;k<=to;k++) months.push({y:Math.floor(k/12),m:k%12+1,key:k});
  const plans=months.map(mo=>({...mo,plan:mpFind(mo.y,mo.m)}));
  const names=[]; for(const {plan} of plans) if(plan) for(const g of plan.groups){ const key=g.name.trim().toLowerCase(); if(!names.some(x=>x.key===key)) names.push({key,name:g.name,color:g.color}); }
  const cell=(val,cls="")=>`<td class="r tabular ${cls}">${val===null||val===undefined?"":esc(val)}</td>`;
  const head=`<tr><th class="ln-sticky">Статья</th>${plans.map(p=>`<th class="r ${p.key===nowKey?"mpc-now":""}"><a href="#/month?year=${p.y}&month=${p.m}" title="Открыть план">${MONTHS_RU_SHORT[p.m-1]}.${String(p.y).slice(2)}</a>${p.plan?"":`<span class="xxs" style="display:block;font-weight:400;opacity:.7">нет плана</span>`}</th>`).join("")}</tr>`;
  const incomeRow=`<tr class="mpc-income"><th class="ln-sticky">💲 Доходы</th>${plans.map(p=>cell(p.plan?fmt(mpTotals(p.plan).income,cur):null)).join("")}</tr>`;
  const groupRows=names.map(nm=>`<tr><th class="ln-sticky"><span class="dot" style="background:${nm.color}"></span> ${esc(nm.name)}</th>${plans.map(p=>{ if(!p.plan) return cell(null,"mpc-empty"); const g=p.plan.groups.find(x=>x.name.trim().toLowerCase()===nm.key); const tot=g?g.items.reduce((a,i)=>a+i.amount,0):0; return cell(g?fmt(tot,cur):"—",g?"":"muted"); }).join("")}</tr>`).join("");
  const spentRow=`<tr class="total"><th class="ln-sticky">Всего расходов</th>${plans.map(p=>cell(p.plan?fmt(mpTotals(p.plan).spent,cur):null)).join("")}</tr>`;
  const leftRow=`<tr class="mpc-left"><th class="ln-sticky">Остаётся</th>${plans.map(p=>{ if(!p.plan) return cell(null); const t=mpTotals(p.plan); return `<td class="r tabular" style="color:${t.left<0?"#ff8080":"#7ee2a8"};font-weight:700">${esc(fmtSigned(t.left,cur))}</td>`; }).join("")}</tr>`;
  const paidRow=`<tr><th class="ln-sticky xs muted">потрачено по факту</th>${plans.map(p=>cell(p.plan?(mpTotals(p.plan).paid?fmt(mpTotals(p.plan).paid,cur):"—"):null,"muted")).join("")}</tr>`;
  const createRow=`<tr><th class="ln-sticky"></th>${plans.map((p,i)=>{ if(p.plan) return "<td></td>"; const prev=plans.slice(0,i).reverse().find(x=>x.plan); return `<td class="r">${prev?`<button type="button" class="link-btn xxs" data-act="mpCalCreate" data-y="${p.y}" data-m="${p.m}" data-src="${prev.plan.id}" title="Скопировать план из ${MONTHS_RU[prev.m-1]}">создать</button>`:""}</td>`; }).join("")}</tr>`;
  const pf=from-6; const prevFrom=`${Math.floor(pf/12)}-${pf%12+1}`;
  const header=pageHeader("Календарь планов","Несколько месяцев рядом: доходы, конверты, всего расходов и что остаётся",`<div class="row" style="gap:8px;flex-wrap:wrap"><a href="#/month?view=calendar&from=${prevFrom}" class="btn secondary sm">← раньше</a><a href="#/month" class="btn primary sm">К плану месяца</a></div>`);
  return header+card({title:`${MONTHS_RU[plans[0].m-1]} ${plans[0].y} — ${MONTHS_RU[plans[plans.length-1].m-1]} ${plans[plans.length-1].y}`,subtitle:"Клик по месяцу открывает его план. Суммы плановые; «потрачено по факту» — по галочкам в плане",body:`<div class="scroll-x ln-wrap"><table class="ln-months mpc"><thead>${head}</thead><tbody>${incomeRow}${groupRows}</tbody><tfoot>${spentRow}${leftRow}${paidRow}${createRow}</tfoot></table></div>`});

function mpEarlySelect(i){ const loans=DB.debts.filter(d=>!d.archived&&loanBankName(d)); const cur=(i.loanIds&&i.loanIds[0])||i.loanId||""; return `<select class="mp-in mp-name mp-earlysel" data-change="mpEarlyLoan" data-id="${i.id}" aria-label="Кредит для досрочного платежа">${options(loans.map(l=>({value:l.id,label:loanTitle(l)+" — остаток "+fmt(l.balance,l.currency)})),cur,"— выберите кредит —")}</select>`; }
function mpEarlyNote(i){ const l=mpItemLoans(i)[0]; if(!l) return `<div class="mp-early-note">Выберите кредит и впишите сумму досрочного платежа — здесь появится расчёт.</div>`; if(!i.amount) return ""; const base=loanSim(l), fast=loanSim(l,0,i.amount); const paid=mpItemPaid(i);
  if(paid) return `<div class="mp-early-note">✓ ${esc(fmt(i.amount,l.currency))} списано с «${esc(loanTitle(l))}»; остаток теперь ${esc(fmt(l.balance,l.currency))}.</div>`;
  if(i.amount>=l.balance) return `<div class="mp-early-note">Этой суммы хватит закрыть «${esc(loanTitle(l))}» полностью (остаток ${esc(fmt(l.balance,l.currency))}) — освободится ${esc(fmt(l.monthlyPayment,l.currency))}/мес${base.outcome==="paid"&&base.totalInterest?`, экономия на процентах ${esc(fmt(base.totalInterest,l.currency))}`:""}.</div>`;
  if(base.outcome!=="paid"||fast.outcome!=="paid") return `<div class="mp-early-note">После платежа остаток «${esc(loanTitle(l))}» станет ${esc(fmt(l.balance-i.amount,l.currency))}.</div>`;
  const ms=base.months-fast.months, is=base.totalInterest-fast.totalInterest; return `<div class="mp-early-note">Остаток «${esc(loanTitle(l))}» станет ${esc(fmt(l.balance-i.amount,l.currency))}${ms>0?`, закроется на <b>${termLabel(ms)}</b> раньше (${monthLabelFrom(fast.months)})`:""}${is>0?`, экономия на процентах <b>${esc(fmt(is,l.currency))}</b>`:""}.</div>`; }
ACTIONS.mpEarlyLoan=el=>{ const item=mpFindItem(el.dataset.id); if(!item) return; const l=DB.debts.find(d=>d.id===el.value); item.early=true; delete item.bankName; delete item.categoryId; if(l){ item.loanIds=[l.id]; item.name=loanTitle(l); } else { delete item.loanIds; } commit(); };

// ================= история изменений плана: автоматический дневник по разнице «до/после» =================
function mpHist(){ if(!Array.isArray(DB.planHistory)) DB.planHistory=[]; return DB.planHistory; }
function mpSnapshot(){ const m={}; for(const p of DB.monthPlans||[]) m[p.year+"-"+p.month]=JSON.parse(JSON.stringify(p)); const paid={}; for(const x of (DB.loanPayments||[])) paid[x.planItemId]=(paid[x.planItemId]||0)+x.amount; return {plans:m,paid}; }
function mpLabel(y,m){ return `${MONTHS_RU[m-1]} ${y}`; }
function mpDiff(before,after){ const out=[]; const cur=DB.settings.baseCurrency; const money=x=>fmt(x||0,cur);
  const keys=new Set([...Object.keys(before.plans),...Object.keys(after.plans)]);
  for(const key of keys){ const [y,m]=key.split("-").map(Number); const A=before.plans[key], B=after.plans[key]; const push=t=>out.push({year:y,month:m,text:t});
    if(!A&&B){ push(`План создан${B.groups.length?` (${B.groups.length} конверт., расходы ${money(B.groups.reduce((a,g)=>a+g.items.reduce((s,i)=>s+i.amount,0),0))})`:""}`); continue; }
    if(A&&!B){ push("План удалён"); continue; }
    if(A.payday!==B.payday) push(`Дата выплаты: ${A.payday||"—"} → ${B.payday||"—"}`);
    const ia=new Map(A.incomes.map(i=>[i.id,i])), ib=new Map(B.incomes.map(i=>[i.id,i]));
    for(const [id,i] of ib){ const o=ia.get(id); if(!o){ if(i.amount||i.name) push(`Доход «${i.name||"?"}» добавлен: ${money(i.amount)}`); continue; } if(o.amount!==i.amount) push(`Доход ${i.name||"?"}: ${money(o.amount)} → ${money(i.amount)}`); if(o.name!==i.name&&(o.name||i.name)) push(`Доход переименован: «${o.name}» → «${i.name}»`); if(o.source!==i.source&&i.source) push(`Доход ${i.name||"?"}: источник — ${i.source}`); }
    for(const [id,o] of ia) if(!ib.has(id)) push(`Доход «${o.name||"?"}» ${money(o.amount)} удалён`);
    const ga=new Map(A.groups.map(g=>[g.id,g])), gb=new Map(B.groups.map(g=>[g.id,g]));
    for(const [id,g] of gb){ const o=ga.get(id); const gt=g.items.reduce((s,i)=>s+i.amount,0); if(!o){ push(`Конверт «${g.name}» добавлен${g.items.length?` (${g.items.length} стр., ${money(gt)})`:""}`); continue; }
      if(o.name!==g.name) push(`Конверт «${o.name}» переименован в «${g.name}»`); if(o.color!==g.color) push(`Конверт «${g.name}»: цвет изменён`); if((o.planPct??"")!==(g.planPct??"")) push(`Конверт «${g.name}»: план % ${o.planPct??"—"} → ${g.planPct??"—"}`);
      const ta=new Map(o.items.map(i=>[i.id,i])), tb=new Map(g.items.map(i=>[i.id,i]));
      for(const [iid,i] of tb){ const p=ta.get(iid); const paidA=!!(before.paid[iid]||p&&p.done), paidB=!!(after.paid[iid]||i.done); const nm=i.name||"без названия";
        if(!p){ if(i.amount||i.name) push(`${g.name} › строка «${nm}» добавлена: ${money(i.amount)}`); continue; }
        if(p.amount!==i.amount) push(`${g.name} › ${nm}: сумма ${money(p.amount)} → ${money(i.amount)}`); if(p.name!==i.name&&(p.name||i.name)) push(`${g.name} › переименовано: «${p.name}» → «${i.name}»`); if((p.remaining||0)!==(i.remaining||0)) push(`${g.name} › ${nm}: остаток ${money(p.remaining)} → ${money(i.remaining)}`);
        const la=JSON.stringify([p.loanIds||p.loanId||null,p.bankName??null,p.categoryId??null]), lb=JSON.stringify([i.loanIds||i.loanId||null,i.bankName??null,i.categoryId??null]); if(la!==lb) push(`${g.name} › ${nm}: связь изменена (${i.bankName!==undefined?"банк "+i.bankName:i.loanIds&&i.loanIds.length?"кредитов: "+i.loanIds.length:i.categoryId?"категория":"снята"})`);
        if(paidA!==paidB) push(`${g.name} › ${nm}: ${paidB?"отмечено оплаченным ✓":"отметка «оплачено» снята"}${paidB&&after.paid[iid]?" — списано "+money(after.paid[iid]):""}`); }
      for(const [iid,p] of ta) if(!tb.has(iid)) push(`${g.name} › строка «${p.name||"без названия"}» ${money(p.amount)} удалена`); }
    for(const [id,o] of ga) if(!gb.has(id)) push(`Конверт «${o.name}» удалён${o.items.length?` (${o.items.length} стр.)`:""}`);
    const orderA=A.groups.map(g=>g.id).filter(id=>gb.has(id)).join(","), orderB=B.groups.map(g=>g.id).filter(id=>ga.has(id)).join(","); if(orderA!==orderB) push("Порядок конвертов изменён"); }
  return out; }
function mpRecord(entries){ if(!entries.length) return; const h=mpHist(); const at=new Date().toISOString(); for(const e of entries) h.push({id:uid(),at,year:e.year,month:e.month,text:e.text}); while(h.length>600) h.shift(); saveDb(); }
function mpTrack(fn){ return function(...args){ let before; try{ before=mpSnapshot(); }catch{ before=null; } const r=fn.apply(this,args); const done=()=>{ try{ if(before) mpRecord(mpDiff(before,mpSnapshot())); }catch(e){ console.warn("history",e); } }; if(r&&typeof r.then==="function") r.then(done,done); else done(); return r; }; }
(function(){ const skip=new Set(["mpLink","mpLinkPick","mpLinkPickCat","mpLinkPickBankSel","mpLinkPickBank","mpCopyClip","mpHistoryClear","mpHistoryAll"]); for(const k of Object.keys(ACTIONS)) if(/^(mp|sub)/.test(k)&&!skip.has(k)&&typeof ACTIONS[k]==="function") ACTIONS[k]=mpTrack(ACTIONS[k]); for(const k of Object.keys(FORMS)) if(/^(mp|sub)/.test(k)&&typeof FORMS[k]==="function") FORMS[k]=mpTrack(FORMS[k]); })();
function mpHistoryCard(plan){ const all=!!UI.mpHistoryAll; const h=mpHist().filter(e=>all||(plan&&e.year===plan.year&&e.month===plan.month)).slice().reverse();
  const fmtAt=iso=>{ const d=new Date(iso); return d.toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"}); };
  let lastDay=""; const rows=h.slice(0,300).map(e=>{ const day=e.at.slice(0,10); const head=day!==lastDay?`<li class="mp-hist-day">${new Date(e.at).toLocaleDateString("ru-RU",{weekday:"short",day:"numeric",month:"long"})}</li>`:""; lastDay=day; return head+`<li class="mp-hist-row"><span class="tabular muted">${fmtAt(e.at).slice(-5)}</span>${all?`<span class="xs muted">${mpLabel(e.year,e.month)}</span>`:""}<span>${esc(e.text)}</span></li>`; }).join("");
  return card({cls:"mb4",title:`История изменений${plan&&!all?` — ${mpLabel(plan.year,plan.month)}`:" — все месяцы"}`,subtitle:"Каждое изменение плана записывается автоматически: что, когда и с какого значения",action:`<div class="row" style="gap:6px"><button type="button" class="btn secondary sm" data-act="mpHistoryAll">${all?"Только этот месяц":"Все месяцы"}</button><button type="button" class="link-btn" data-act="mpHistoryClear" style="color:var(--status-critical)">очистить</button></div>`,body:h.length?`<ul class="mp-hist">${rows}</ul>${h.length>300?`<p class="xs muted mt2">Показаны последние 300 из ${h.length}.</p>`:""}`:`<p class="xs muted">Пока пусто — изменения появятся здесь, как только вы что-то поправите в плане.</p>`}); }
ACTIONS.mpHistoryAll=()=>{ UI.mpHistoryAll=!UI.mpHistoryAll; rerender(); };
ACTIONS.mpHistoryClear=()=>{ if(!confirm("Очистить историю изменений?")) return; DB.planHistory=[]; commit(); };

// ===================== loans: список, таблица по месяцам, рекомендации по досрочному =====================
/** График одного кредита. Со ставкой — аннуитетная симуляция; без ставки — остаток минус платёж (как в Excel-таблице). */
function loanSim(loan,extraMonthly=0,lumpSum=0){
  let payment=loan.monthlyPayment; if(payment<=0&&loan.termMonths>0) payment=Math.ceil(loan.balance/loan.termMonths);
  if(loan.annualRateBp>0) return buildSchedule({balance:loan.balance,annualRateBp:loan.annualRateBp,monthlyPayment:payment},{monthlyExtra:extraMonthly,lumpSum});
  let balance=Math.max(0,loan.balance-lumpSum); if(balance===0) return {points:[],months:0,totalInterest:0,totalPaid:0,outcome:"no-debt"};
  const pay=payment+extraMonthly; if(pay<=0) return {points:[],months:0,totalInterest:0,totalPaid:0,outcome:"never"};
  const points=[]; let totalPaid=0; for(let m=1;m<=600&&balance>0;m++){ const actual=Math.min(pay,balance); balance-=actual; totalPaid+=actual; points.push({month:m,balance,interest:0,principal:actual,payment:actual}); }
  return {points,months:points.length,totalInterest:0,totalPaid,outcome:"paid"};
}
function loanTotalWithInterest(loan){ if(loan.termMonths>0&&loan.monthlyPayment>0) return loan.monthlyPayment*loan.termMonths; if(loan.overpayment>0&&loan.principal<=loan.balance) return loan.balance+loan.overpayment; const s=loanSim(loan); return s.outcome==="paid"?s.totalPaid:loan.balance; }
/** Переплата: введённая вручную, иначе — из срока и платежа, иначе — из расчёта по ставке. */
function loanOverpayment(l){ if(l.overpayment>0) return l.overpayment; if(l.termMonths>0&&l.monthlyPayment>0) return Math.max(0,l.monthlyPayment*l.termMonths-l.balance); const s=loanSim(l); return s.outcome==="paid"?s.totalInterest:0; }
function loanRateLabel(l){ return l.annualRateBp>0?`≈ ${(l.annualRateBp/100).toFixed(1).replace(".",",")}% годовых`:"ставка не определена"; }
/** Подбирает годовую ставку (в сотых долях %), при которой переплата по аннуитету с таким платежом равна заданной. */
/** База для подбора ставки: сумма по договору (переплата вводится за весь срок), иначе остаток. */
function loanRateBase(d){ return d.principal>d.balance?d.principal:d.balance; }
function solveRateBp(balance,payment,overpayment){ if(balance<=0||payment<=0||overpayment<=0) return 0; let lo=0, hi=20000; for(let i=0;i<40;i++){ const mid=(lo+hi)/2; const sc=buildSchedule({balance,annualRateBp:mid,monthlyPayment:payment}); if(sc.outcome!=="paid"||sc.totalInterest>overpayment) hi=mid; else lo=mid; } return Math.round(lo); }
/** Приоритет досрочного погашения: сначала самая высокая ставка, при равных — меньший остаток (быстрее освобождает платёж). */
function loanPriority(loans){ return [...loans].sort((a,b)=>(b.annualRateBp-a.annualRateBp)||(a.balance-b.balance)); }
/**
 * Портфельная симуляция «снежный ком»: каждый месяц все кредиты получают свой платёж,
 * а свободные деньги (плюс платежи уже закрытых кредитов) идут на приоритетный открытый кредит.
 */
function portfolioSim(loans,extraMonthly=0,lumpSum=0,snowball=extraMonthly>0||lumpSum>0,orderLoans){
  const sched=typeof extraMonthly==="function"?extraMonthly:(()=>({extra:extraMonthly,targeted:[]}));
  const order=(orderLoans||loanPriority(loans)).map(l=>l.id); const state=new Map(loans.map(l=>[l.id,{balance:l.balance,payment:l.monthlyPayment>0?l.monthlyPayment:(l.termMonths>0?Math.ceil(l.balance/l.termMonths):0),rate:l.annualRateBp/10000/12,closedAt:0,interest:0,paid:0,rows:[]}]));
  let freed=0; let lump=lumpSum;
  for(let m=1;m<=600;m++){
    const open=order.filter(id=>state.get(id).balance>0); if(open.length===0) break;
    const sm=sched(m)||{extra:0,targeted:[]}; const tmap=new Map(); for(const t of sm.targeted||[]){ if(t.id&&t.amount>0) tmap.set(t.id,(tmap.get(t.id)||0)+t.amount); }
    let pool=(sm.extra||0)+freed+lump; lump=0;
    for(const id of order){ const s=state.get(id); if(s.balance<=0){ s.rows.push(0); pool+=tmap.get(id)||0; continue; } const interest=Math.round(s.balance*s.rate); s.interest+=interest; let due=s.balance+interest; let pay=Math.min(s.payment,due);
      // адресная досрочка из конверта «Досрочка» — именно на этот кредит; что не поместилось, уходит в общий пул
      const tg=tmap.get(id)||0; if(tg>0){ const add=Math.min(tg,due-pay); pay+=add; pool+=tg-add; } if(s.payment<=interest&&s.payment>0&&pool<=0){ /* платёж не покрывает проценты */ }
      // приоритетный кредит получает весь пул
      if(open[0]===id&&pool>0){ const add=Math.min(pool,due-pay); pay+=add; pool-=add; }
      s.paid+=pay; s.balance=Math.max(0,due-pay); s.rows.push(s.balance); if(s.balance===0){ s.closedAt=m; if(snowball) freed+=s.payment; } }
    // если пул остался (приоритетный закрылся раньше), отдаём следующему открытому в этом же месяце

/** Применяет одно поле строки кредита; при ошибке пишет сообщение в UI.loan_state и возвращает false. */
function applyLoanField(d,f,value){ const el={value:String(value??"")}; UI.loan_state={};
  if(f==="name") d.name=el.value.trim()||"Кредит";
  else if(f==="bank"){ if(el.value==="__other") return true; d.bank=el.value.trim(); UI.loanBankOther=null; }
  else if(f==="bankText"){ d.bank=el.value.trim(); UI.loanBankOther=null; }
  else if(f==="purpose") d.purpose=el.value.trim()||null;
  else if(f==="termMonths"){ const n=Number(String(el.value).replace(/\D/g,"")); d.termMonths=Number.isFinite(n)?Math.min(600,n):0; if(!d.overpayment&&d.termMonths>0&&d.monthlyPayment>0&&d.balance>0){ const over=d.monthlyPayment*d.termMonths-d.balance; d.annualRateBp=over>0?solveRateBp(d.balance,d.monthlyPayment,over):0; } }
  else if(f==="annualRate"){ const r=Number(String(el.value).replace(",",".").replace("%","").trim()||"0"); if(!Number.isFinite(r)||r<0||r>200){ UI.loan_state={message:"Ставка должна быть числом от 0 до 200"}; return false; } d.annualRateBp=Math.round(r*100); const sc=buildSchedule({balance:d.balance,annualRateBp:d.annualRateBp,monthlyPayment:d.monthlyPayment}); d.overpayment=sc.outcome==="paid"?sc.totalInterest:0; if(sc.outcome==="paid"&&!d.termMonths) d.termMonths=sc.months; }
  else if(f==="overpayment"){ const v=mpParse(el.value); if(v===null){ UI.loan_state={message:`Не удалось прочитать сумму «${el.value}»`}; return false; } d.overpayment=v; if(v>0&&d.monthlyPayment>0){ if(!d.termMonths&&d.principal<=d.balance) d.termMonths=Math.ceil((d.balance+v)/d.monthlyPayment); d.annualRateBp=solveRateBp(loanRateBase(d),d.monthlyPayment,v); } else if(v===0) d.annualRateBp=0; }
  else { const v=mpParse(el.value); if(v===null){ UI.loan_state={message:`Не удалось прочитать сумму «${el.value}»`}; return false; } d[f]=v; if(f==="balance"&&d.principal<v) d.principal=v; if(f==="principal"&&v<d.balance) d.balance=v; if(d.overpayment>0&&d.monthlyPayment>0) d.annualRateBp=solveRateBp(loanRateBase(d),d.monthlyPayment,d.overpayment); }
  if(d.overpayment>0&&d.monthlyPayment>0&&d.balance>0&&!d.annualRateBp) d.annualRateBp=solveRateBp(loanRateBase(d),d.monthlyPayment,d.overpayment);
  return true; }

// ---- календарь платежей: сколько платить в каждый месяц с учётом сроков
/** Сколько месяцев ещё платить: введённый срок важнее расчётного. */
function loanTermMonths(l){ if(l.termMonths>0) return l.termMonths; const s=loanSim(l); return s.outcome==="paid"?s.months:0; }
/** Платёж кредита в m-й месяц (1 = текущий). */
function loanPaymentAt(l,m){ const tm=loanTermMonths(l); if(tm<=0||m>tm) return 0; if(l.termMonths>0||l.annualRateBp===0) return l.monthlyPayment; const s=loanSim(l); return s.points[m-1]?s.points[m-1].payment:0; }
function loanCalendarCard(loans,base){
  const horizon=Math.min(120,Math.max(0,...loans.map(loanTermMonths))); if(horizon===0) return "";
  const byBank=UI.loanCalMode!=="loan"; const banks=loanBanks(loans); const months=Array.from({length:horizon},(_,i)=>i+1);
  const series=byBank?[...banks.entries()].map(([b,ls])=>({label:b||"Без банка",sub:`${ls.length} ${ls.length===1?"кредит":ls.length<5?"кредита":"кредитов"}`,pay:m=>ls.reduce((a,l)=>a+loanPaymentAt(l,m),0)})):[...loans].sort((a,b)=>b.monthlyPayment-a.monthlyPayment).map(l=>({label:loanTitle(l),sub:fmt(l.balance,base),pay:m=>loanPaymentAt(l,m)}));
  const totals=months.map(m=>loans.reduce((a,l)=>a+loanPaymentAt(l,m),0));
  const rows=series.map(sr=>{ const vals=months.map(sr.pay); const last=vals.reduce((acc,v,i)=>v>0?i:acc,-1); return `<tr><th class="ln-sticky">${esc(sr.label)}${sr.sub?`<span class="xs muted" style="display:block;font-weight:400">${esc(sr.sub)}</span>`:""}</th>${vals.map((v,i)=>{ if(v<=0) return `<td class="ln-done"></td>`; const drop=i>0&&vals[i-1]>v; return `<td class="r tabular ${i===last?"ln-last":""} ${drop?"ln-drop":""}" title="${drop?"платёж стал меньше — один из кредитов закрылся":""}">${esc(loanFmtIn(v))}</td>`; }).join("")}</tr>`; }).join("");
  const totalRow=`<tr class="total"><th class="ln-sticky">Итого в месяц</th>${totals.map((v,i)=>`<td class="r tabular ${i>0&&totals[i-1]>v?"ln-drop":""}">${v>0?esc(loanFmtIn(v)):""}</td>`).join("")}</tr>`;
  // Краткая сводка словами: когда и на сколько снижается нагрузка.
  const steps=[]; for(let i=1;i<totals.length;i++) if(totals[i]<totals[i-1]) steps.push(`с ${monthLabelFrom(i+1)} — ${fmt(totals[i],base)}`); const summary=`Сейчас ${fmt(totals[0]||0,base)} в месяц${steps.length?`; ${steps.slice(0,6).join(", ")}${steps.length>6?"…":""}`:""}. Последний платёж — ${monthLabelFrom(horizon)}.`;
  return card({title:"Календарь платежей",subtitle:summary,action:`<div class="seg" style="grid-template-columns:1fr 1fr"><button type="button" class="${byBank?"active":""}" data-act="loanCalMode" data-v="bank">По банкам</button><button type="button" class="${!byBank?"active":""}" data-act="loanCalMode" data-v="loan">По кредитам</button></div>`,body:`<div class="scroll-x ln-wrap"><table class="ln-months"><thead><tr><th class="ln-sticky">${byBank?"Банк":"Кредит"}</th>${months.map(m=>`<th class="r">${monthLabelFrom(m)}</th>`).join("")}</tr></thead><tbody>${rows}</tbody><tfoot>${totalRow}</tfoot></table></div><p class="xs muted mt2">Срок берётся из колонки «Ост. срок, мес»; если он не указан — из расчёта по остатку и платежу. Зелёная ячейка — платёж уменьшился, красная — последний платёж.</p>`});
}

// ---- навигация стрелками по таблице кредитов, как в Excel
document.addEventListener("keydown",e=>{
  if(!["ArrowRight","ArrowLeft","ArrowUp","ArrowDown"].includes(e.key)) return;
  const el=e.target; if(!el||!el.closest) return; const tr=el.closest("tr[data-loan-id]"); if(!tr) return;
  const isInput=el.tagName==="INPUT", isSelect=el.tagName==="SELECT";
  if(!isInput&&!isSelect) return;
  const cells=[...tr.querySelectorAll("input.mp-in,select.mp-in")]; const idx=cells.indexOf(el); if(idx<0) return;
  const go=target=>{ if(!target) return; e.preventDefault(); target.focus(); if(target.tagName==="INPUT"&&typeof target.select==="function") target.select(); };
  if(e.key==="ArrowRight"){ if(isInput&&el.selectionEnd<el.value.length&&el.selectionStart===el.selectionEnd) return; go(cells[idx+1]); }
  else if(e.key==="ArrowLeft"){ if(isInput&&el.selectionStart>0&&el.selectionStart===el.selectionEnd) return; go(cells[idx-1]); }
  else { if(isSelect) return; // у списка стрелки вверх/вниз меняют значение
    const rows=[...document.querySelectorAll("tr[data-loan-id]")]; const r=rows.indexOf(tr); const next=rows[r+(e.key==="ArrowDown"?1:-1)]; if(!next) return;
    const field=el.dataset.field; go(next.querySelector(`[data-field="${field}"]`)||[...next.querySelectorAll("input.mp-in,select.mp-in")][idx]); }
});

function loanTimelineCard({sim,loans,freeMonthly,freeAt,freeAny,schedText,lump,base}){
  if((!freeAny&&lump<=0)||sim.stuck||!sim.months) return "";
  const byMonth=new Map(); for(const [id,st] of sim.state) if(st.closedAt) { if(!byMonth.has(st.closedAt)) byMonth.set(st.closedAt,[]); byMonth.get(st.closedAt).push(loans.find(l=>l.id===id)); }
  let freed=0; const steps=[...byMonth.keys()].sort((a,b)=>a-b).map(m=>{ const ls=byMonth.get(m); const paid=ls.reduce((a,l)=>a+sim.state.get(l.id).paid,0); freed+=ls.reduce((a,l)=>a+l.monthlyPayment,0); const next=sim.order.map(id=>loans.find(l=>l.id===id)).find(l=>sim.state.get(l.id).closedAt>m);
    const banks=[...new Set(ls.map(l=>l.bank).filter(Boolean))]; const bal=ls.reduce((a,l)=>a+l.balance,0);
    const table=`<div class="scroll-x mt2"><table class="ln-table ln-mini"><thead><tr><th>№</th><th>Кредит</th><th>На что</th><th class="r">Остаток сейчас</th><th class="r">Платёж/мес</th><th class="r">Ставка</th><th class="r">Проценты до закрытия</th><th class="r">Всего заплатить</th></tr></thead><tbody>${ls.map((l,i)=>{ const s=sim.state.get(l.id); return `<tr><td class="xs muted">${i+1}</td><td><a href="#/loans?ids=${l.id}" style="color:${bankColor(l.bank)}"><b>${esc(loanTitle(l))}</b></a></td><td class="xs">${esc(l.purpose||"—")}</td><td class="r tabular">${esc(fmt(l.balance,base))}</td><td class="r tabular">${esc(fmt(l.monthlyPayment,base))}</td><td class="r tabular">${(l.annualRateBp/100).toFixed(1)}%</td><td class="r tabular">${esc(fmt(s.interest,base))}</td><td class="r tabular">${esc(fmt(s.paid,base))}</td></tr>`; }).join("")}<tr class="ln-total-row"><td></td><td colspan="2"><b>Итого ${ls.length}</b></td><td class="r tabular semi">${esc(fmt(bal,base))}</td><td class="r tabular semi">${esc(fmt(ls.reduce((a,l)=>a+l.monthlyPayment,0),base))}</td><td></td><td class="r tabular semi">${esc(fmt(ls.reduce((a,l)=>a+sim.state.get(l.id).interest,0),base))}</td><td class="r tabular semi">${esc(fmt(ls.reduce((a,l)=>a+sim.state.get(l.id).paid,0),base))}</td></tr></tbody></table></div>`;
    return `<li class="ln-step"><div class="ln-step-when tabular">${monthLabelFrom(m)}<span class="xs muted" style="display:block">мес. ${m}</span></div><details class="ln-step-det"><summary class="sm">Закрывается <b>${ls.length===1?`«${esc(loanTitle(ls[0]))}»`:`${ls.length} ${ls.length<5?"кредита":"кредитов"}`}</b>${banks.length?` (${esc(banks.join(", "))})`:""} на <b class="tabular">${esc(fmt(bal,base))}</b> <span class="xs muted">▾ подробнее</span></summary>${table}<p class="xs sec mt2">Освобождается ${esc(fmt(ls.reduce((a,l)=>a+l.monthlyPayment,0),base))}/мес; всего свободно на кредиты становится <b class="tabular ink">${esc(fmt(freeAt(m)+freed,base))}</b> в месяц${next?` — направляйте их на «${esc(loanTitle(next))}»`:" — все кредиты закрыты 🎉"}.</p></details></li>`; });
  return card({title:"План по месяцам",subtitle:`${schedText}${lump?`; разово ${fmt(lump,base)}`:""} — сверх обычных платежей`,body:`<ol class="ln-steps">${steps.slice(0,12).join("")}</ol>${steps.length>12?`<details class="mt2"><summary class="xs">Ещё ${steps.length-12} шагов</summary><ol class="ln-steps mt2">${steps.slice(12).join("")}</ol></details>`:""}`});
}
function loanLumpCard({loans,lump,prio,base}){
  if(lump<=0) return "";
  let rest=lump; const closeNow=[]; for(const l of prio){ if(l.balance>0&&l.balance<=rest){ closeNow.push(l); rest-=l.balance; } }
  const partial=prio.find(l=>l.balance>0&&!closeNow.includes(l));
  const interestSaved=closeNow.reduce((a,l)=>{ const s=loanSim(l); return a+(s.outcome==="paid"?s.totalInterest:0); },0);
  return card({title:`Разовая сумма ${fmt(lump,base)}`,subtitle:"Как распорядиться накоплениями или премией",body:`${closeNow.length?`<p class="sm">Закройте полностью: ${closeNow.map(l=>`<b>«${esc(loanTitle(l))}»</b> (${esc(fmt(l.balance,base))})`).join(", ")}.</p><p class="xs sec mt1">Освободится ${esc(fmt(closeNow.reduce((a,l)=>a+l.monthlyPayment,0),base))}/мес${interestSaved?`, экономия на процентах ≈ ${esc(fmt(interestSaved,base))}`:""}.</p>`:`<p class="sm">Суммы не хватает, чтобы закрыть какой-либо кредит целиком.</p>`}${rest>0&&partial?`<p class="xs sec mt2">Остаток ${esc(fmt(rest,base))} внесите досрочно в «${esc(loanTitle(partial))}» (остаток ${esc(fmt(partial.balance,base))}) и попросите банк <b>сократить срок</b>, а не уменьшить платёж.</p>`:""}`});
}
function loanTipsCard({loans,summary,income,base,transactions}){
  const tips=[];
  const zero=loans.filter(l=>l.annualRateBp===0&&loanOverpayment(l)===0); if(zero.length) tips.push(`<b>Беспроцентные рассрочки (${zero.length}) гасите последними.</b> Досрочное закрытие 0% не экономит ничего — деньги выгоднее направить на кредиты со ставкой.`);
  const hot=loans.filter(l=>l.annualRateBp>=3000); if(hot.length) tips.push(`<b>Ставки от 30% (${hot.length} кредит${hot.length===1?"":hot.length<5?"а":"ов"}) — приоритет №1.</b> Каждые 100 000 ₸ такого долга стоят ≈ ${fmt(Math.round(100000*100*hot[0].annualRateBp/10000/12),base)} в месяц процентов.`);
  if(summary.paymentToIncome>50) tips.push(`<b>Платежи съедают ${summary.paymentToIncome.toFixed(0)}% дохода</b> — это критично. Не берите новых кредитов и рассрочек, пока показатель не опустится ниже 30–40%.`); else if(summary.paymentToIncome>30) tips.push(`Долговая нагрузка ${summary.paymentToIncome.toFixed(0)}% дохода — заметная. Норма — до 30%.`);
  const bal=accountBalances(activeAccounts(),transactions); const res=reserve(transactions,activeCategories(),bal,{months:DB.settings.reserveMonths||6,comfortMinimum:DB.settings.comfortMinimum||0,baseCurrency:base}); if(res.basis>0&&res.saved<res.basis) tips.push(`<b>Сначала подушка на 1 месяц (${fmt(res.basis,base)}).</b> Сейчас на накопительных счетах ${fmt(res.saved,base)}. Без резерва любая неожиданность снова уведёт в кредит.`);
  tips.push(`При частичном досрочном погашении выбирайте <b>«сократить срок»</b>, а не «уменьшить платёж» — так экономия на процентах максимальна.`);
  tips.push(`Уточните в банке <b>комиссии и условия досрочного погашения</b>: у части кредитов оно бесплатно только через приложение или после N месяцев.`);
  tips.push(`Отмечайте платежи в «Плане на месяц» галочками — остатки здесь обновляются сами, и советы всегда считаются от актуальных цифр.`);
  return card({title:"Подсказки финансиста",subtitle:"Правила, по которым считаются рекомендации выше",body:`<ul class="ln-tips">${tips.map(t=>`<li>${t}</li>`).join("")}</ul>`});
}

// ===================== Telegram: забираем расходы из локального бота =====================
const TG_DEFAULT_URL="http://127.0.0.1:8787";
function tgSettings(){ if(!DB.telegram) DB.telegram={url:TG_DEFAULT_URL,accountId:"",auto:true}; return DB.telegram; }
function tgAccount(){ const s=tgSettings(); return DB.accounts.find(a=>a.id===s.accountId&&!a.archived)||activeAccounts()[0]||null; }
/** Забирает новые записи бота, создаёт операции, подтверждает боту. Возвращает {ok, added, message}. */
async function tgSync({silent=false}={}){
  const s=tgSettings(); const account=tgAccount();
  if(!account) return {ok:false,message:"Сначала создайте счёт в настройках"};
  let data;
  try{ const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),4000); const res=await fetch(s.url.replace(/\/$/,"")+"/entries",{signal:ctrl.signal}); clearTimeout(t); data=await res.json(); }
  catch{ return {ok:false,message:silent?"":"Бот не отвечает. Запустите start-bot.cmd в папке FinFlowBot и повторите."}; }
  if(!data||!data.ok) return {ok:false,message:"Бот вернул ошибку"};
  // Сброс в боте (/сброс): удаляем всё, что было подтянуто из Telegram раньше.
  let wiped=0; if(data.epoch&&s.epoch!==data.epoch){ if(s.epoch!==undefined){ const before=DB.transactions.length; DB.transactions=DB.transactions.filter(x=>!(x.dedupeHash&&x.dedupeHash.startsWith("tg:"))); wiped=before-DB.transactions.length; } s.epoch=data.epoch; saveDb(); }
  const existing=new Set(DB.transactions.map(t=>t.dedupeHash).filter(Boolean)); let added=0; const ids=[]; const skipped=[];
  const accs=DB.accounts.filter(a=>!a.archived); const findAcc=(name,owner)=>{ const q=(name||"").toLowerCase().trim(); if(!q) return null; const byName=accs.filter(a=>a.name.toLowerCase().includes(q)||q.includes(a.name.toLowerCase())||(a.bank&&(a.bank.toLowerCase().includes(q)||q.includes(a.bank.toLowerCase())))); if(byName.length>1&&owner){ const o=byName.find(a=>a.owner===owner); if(o) return o; } if(byName.length) return byName[0]; if(/налич|кэш|cash/.test(q)) return accs.find(a=>a.type==="CASH"&&(!owner||a.owner===owner||!a.owner))||accs.find(a=>a.type==="CASH")||null; if(/депозит|накоп/.test(q)) return accs.find(a=>a.type==="SAVINGS")||null; return null; };
  const ownerDefault=owner=>owner?(accs.find(a=>a.owner===owner&&a.type==="CARD")||accs.find(a=>a.owner===owner)||account):account;
  for(const e of data.entries){ const hash="tg:"+e.id; if(existing.has(hash)){ ids.push(e.id); continue; } const owner=(e.owner==="М"||e.owner==="Л")?e.owner:null;
    if(e.type==="TRANSFER"){ let fromA=findAcc(e.from,e.fromOwner||owner), toA=findAcc(e.to,e.toOwner||owner); if(!fromA&&e.fromOwner) fromA=ownerDefault(e.fromOwner); if(!toA&&e.toOwner) toA=ownerDefault(e.toOwner); if(!fromA&&toA) fromA=ownerDefault(owner); if(!toA&&fromA&&/налич/i.test(e.note||"")) toA=findAcc("наличные",owner); if(!fromA||!toA||fromA.id===toA.id){ skipped.push(`перевод ${fmt(Number(e.amount)||0,account.currency)} (${e.from||"?"} → ${e.to||"?"})`); continue; }
      DB.transactions.push({id:uid(),type:"TRANSFER",date:e.date,amount:Number(e.amount)||0,currency:fromA.currency,accountId:fromA.id,toAccountId:toA.id,toAmount:fromA.currency===toA.currency?null:Number(e.amount)||0,categoryId:null,merchant:null,note:`Telegram · ${e.user||""}`.trim(),owner,dedupeHash:hash,importBatchId:null,createdAt:Date.now()}); ids.push(e.id); added++; continue; }
    const acc=findAcc(e.account,owner)||ownerDefault(owner); const categoryId=e.type==="EXPENSE"?categorize({merchant:e.note,description:e.note},DB.rules):(DB.categories.find(c=>c.kind==="INCOME"&&/зарплат/i.test(e.note||"")&&/зарплат/i.test(c.name))||{}).id||null;
    DB.transactions.push({id:uid(),type:e.type==="INCOME"?"INCOME":"EXPENSE",date:e.date,amount:Number(e.amount)||0,currency:acc.currency,accountId:acc.id,toAccountId:null,toAmount:null,categoryId,merchant:e.note||null,note:e.user?`Telegram · ${e.user}`:"Telegram",owner,dedupeHash:hash,importBatchId:null,createdAt:Date.now()}); ids.push(e.id); added++; }
  if(ids.length){ try{ await fetch(s.url.replace(/\/$/,"")+"/ack",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({ids})}); }catch{} }
  if(added) saveDb();
  const skipMsg=skipped.length?` Не определён счёт для: ${skipped.join("; ")} — назовите счета в Telegram так же, как в «Капитал → Остатки» (или уточните «с каспи на наличные»).`:"";
  tgPushBudget(s).catch(()=>{});
  return {ok:true,added,message:(wiped?`Удалено старых записей из Telegram: ${wiped}. `:"")+(added?`Из Telegram добавлено операций: ${added}.`:"Новых записей в Telegram нет.")+skipMsg};
}

function budgetSnapshotForBot(){ const {py,pm}=budgetPlanMonth({}); const rows=mpLimitRows(py,pm); if(!rows.length) return null; const range=periodRange("MONTHLY",new Date(Date.UTC(py,pm-1,1))); return {month:`${py}-${String(pm).padStart(2,"0")}`,monthLabel:`${MONTHS_RU[pm-1]} ${py}`,daysLeft:daysRemaining(range),rows:rows.map(r=>({name:r.name,plan:r.limit,fact:r.spent})),planTotal:rows.reduce((a,r)=>a+r.limit,0),factTotal:rows.reduce((a,r)=>a+r.spent,0)}; }

// ===================== облако: общая база М и Л через приватный GitHub Gist =====================
// Данные целиком лежат в одном приватном gist. Кто сохранил позже — тот и прав (по DB.meta.updatedAt);
// проигравшая версия откладывается в резерв на этом устройстве. Настройки (токен + id) — на каждом устройстве свои,
// либо вшиты в файл (window.FF_SYNC_CODE) — так файл работает на телефоне, где хранилище браузера недоступно.
const APP_URL="https://mirazhylkybayeva.github.io/fin-plan-k7m2/";
const SYNC_KEY="finflow-sync", SYNC_BACKUP_KEY="finflow-sync-backup", GIST_FILE="finplan-data.json";
const SYNC={cfg:{token:"",gistId:""},status:"off",msg:"",lastAt:0,timer:null,pulling:false,pushing:false,dirty:false,applying:false,noStorage:false,device:""};
function syncLoadCfg(){ let c=null; try{ c=JSON.parse(localStorage.getItem(SYNC_KEY)||"null"); SYNC.device=localStorage.getItem("finflow-device")||""; if(!SYNC.device){ SYNC.device=Math.random().toString(36).slice(2,8); localStorage.setItem("finflow-device",SYNC.device); } }catch{ SYNC.noStorage=true; SYNC.device="tmp"+Math.random().toString(36).slice(2,6); } if(!c&&typeof window.FF_SYNC_CODE==="string") c=syncDecode(window.FF_SYNC_CODE); if(c&&c.token) SYNC.cfg=c; }
function syncSaveCfg(){ try{ localStorage.setItem(SYNC_KEY,JSON.stringify(SYNC.cfg)); }catch{} }
function syncOn(){ return !!(SYNC.cfg&&SYNC.cfg.token); }
function syncEncode(){ return btoa(unescape(encodeURIComponent(JSON.stringify({t:SYNC.cfg.token,g:SYNC.cfg.gistId})))); } // пароль шифрования в код/ссылку не попадает — его передают только лично
function syncDecode(s){ try{ const o=JSON.parse(decodeURIComponent(escape(atob((s||"").trim())))); if(o&&o.t) return {token:String(o.t),gistId:String(o.g||""),pass:SYNC.cfg&&SYNC.cfg.gistId===String(o.g||"")?(SYNC.cfg.pass||""):""}; }catch{} return null; }
// ---- шифрование общей базы: AES-256-GCM, ключ из пароля через PBKDF2 (150 000 итераций). В облаке — только шифртекст и отметка времени.
function b64u8(u){ let t=""; for(let i=0;i<u.length;i+=0x8000) t+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(t); }
function unb64u8(s){ return Uint8Array.from(atob(s),c=>c.charCodeAt(0)); }
async function syncKey(pass,salt){ const enc=new TextEncoder(); const base=await crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveKey"]); return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]); }
async function syncEncrypt(text,pass){ const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12)); const key=await syncKey(pass,salt); const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(text))); return {enc:1,alg:"AES-GCM/PBKDF2-SHA256",salt:b64u8(salt),iv:b64u8(iv),data:b64u8(ct)}; }
async function syncDecrypt(obj,pass){ const key=await syncKey(pass,unb64u8(obj.salt)); const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64u8(obj.iv)},key,unb64u8(obj.data)); return new TextDecoder().decode(pt); }
function syncCryptoOk(){ return !!(window.crypto&&crypto.subtle&&crypto.getRandomValues); }
function syncStamp(db){ const d=db||DB; return (d&&d.meta&&Number(d.meta.updatedAt))||0; }
/** Вызывается из saveDb при каждом сохранении: ставит отметку времени и планирует отправку. */
function syncTouch(){ if(SYNC.applying||!DB) return; DB.meta=DB.meta||{}; DB.meta.updatedAt=Date.now(); DB.meta.device=SYNC.device; if(!syncOn()) return; SYNC.dirty=true; syncSchedulePush(); }
function syncSchedulePush(ms=2500){ clearTimeout(SYNC.timer); SYNC.timer=setTimeout(()=>syncPush(),ms); }
async function gh(method,path,body,extra){ const r=await fetch("https://api.github.com"+path,{method,headers:{Authorization:"Bearer "+SYNC.cfg.token,Accept:"application/vnd.github+json","Content-Type":"application/json"},body:body?JSON.stringify(body):undefined,...(extra||{})}); if(!r.ok){ let t=""; try{ t=(await r.json()).message||""; }catch{} throw new Error(r.status===401?"токен не подходит (401)":r.status===404?"общая база не найдена (404)":`${r.status} ${t}`.trim()); } return r.json(); }
function syncSet(status,msg){ SYNC.status=status; SYNC.msg=msg||""; if(status==="ok") SYNC.lastAt=Date.now(); syncPaint(); }
function syncPaint(){ const els=document.querySelectorAll(".sync-status"); if(!els.length) return; let text="", cls=""; if(!syncOn()){ text=""; } else if(SYNC.status==="err"){ text="☁ ошибка"; cls="sync-err"; } else if(SYNC.pushing||SYNC.pulling){ text="☁ …"; cls="sync-busy"; } else if(SYNC.dirty){ text="☁ есть несохранённое"; cls="sync-busy"; } else { text="☁ "+(SYNC.lastAt?new Intl.DateTimeFormat("ru-RU",{hour:"2-digit",minute:"2-digit"}).format(new Date(SYNC.lastAt)):"общая база"); cls="sync-ok"; } els.forEach(e=>{ e.textContent=text; e.className="sync-status "+cls; e.title=SYNC.msg?`Общая база: ${SYNC.msg}. Нажмите, чтобы обновить сейчас`:"Общая база М и Л — нажмите, чтобы обновить сейчас"; }); }
async function syncPush(opts){ if(!syncOn()||SYNC.pushing) return false; if(SYNC.remoteEncrypted&&!SYNC.cfg.pass){ SYNC.needPass=true; syncSet("err","общая база зашифрована — введите пароль в Настройках, до этого изменения не отправляются"); return false; } SYNC.pushing=true; syncPaint(); try{ let content; if(SYNC.cfg.pass){ if(!syncCryptoOk()) throw new Error("браузер не поддерживает шифрование"); const e=await syncEncrypt(JSON.stringify(DB),SYNC.cfg.pass); content=JSON.stringify({...e,updatedAt:syncStamp(),device:SYNC.device}); SYNC.remoteEncrypted=true; } else content=JSON.stringify(DB); if(!SYNC.cfg.gistId){ const g=await gh("POST","/gists",{description:"Фин план — общая база М и Л (не удалять)",public:false,files:{[GIST_FILE]:{content}}}); SYNC.cfg.gistId=g.id; syncSaveCfg(); } else { await gh("PATCH","/gists/"+SYNC.cfg.gistId,{files:{[GIST_FILE]:{content}}},opts&&opts.keepalive?{keepalive:true}:null); } SYNC.dirty=false; syncSet("ok","сохранено в облако"); return true; }catch(e){ syncSet("err",e.message); return false; } finally{ SYNC.pushing=false; syncPaint(); } }
async function syncPull({force}={}){ if(!syncOn()||!SYNC.cfg.gistId) return null; if(SYNC.pulling){ if(!force) return null; for(let i=0;i<100&&SYNC.pulling;i++) await new Promise(r=>setTimeout(r,50)); if(SYNC.pulling) return null; } SYNC.pulling=true; syncPaint(); try{ const g=await gh("GET","/gists/"+SYNC.cfg.gistId); const f=g.files&&g.files[GIST_FILE]; if(!f) throw new Error("в общей базе нет файла данных"); let content=f.content; if(f.truncated){ const r=await fetch(f.raw_url,{headers:{Authorization:"Bearer "+SYNC.cfg.token}}); content=await r.text(); } let remote=JSON.parse(content); let rs; if(remote&&remote.enc){ SYNC.remoteEncrypted=true; if(!SYNC.cfg.pass){ SYNC.needPass=true; throw new Error("общая база зашифрована — введите пароль в Настройках"); } try{ remote=JSON.parse(await syncDecrypt(remote,SYNC.cfg.pass)); }catch{ SYNC.needPass=true; throw new Error("неверный пароль общей базы"); } SYNC.needPass=false; SYNC.remoteEncrypted=true; } else { SYNC.remoteEncrypted=false; } rs=syncStamp(remote); const ls=syncStamp();
    if(rs>ls||force){ if(SYNC.dirty||force){ try{ localStorage.setItem(SYNC_BACKUP_KEY,JSON.stringify({savedAt:Date.now(),db:DB})); }catch{} } syncApply(remote); SYNC.dirty=false; syncSet("ok","обновлено из облака"); try{ rerender(); }catch{} return "pulled"; }
    if(rs<ls){ SYNC.dirty=true; syncSchedulePush(300); syncSet("ok","отправляю свои изменения"); return "push"; }
    syncSet("ok","актуально"); return "same"; }catch(e){ syncSet("err",e.message); return null; } finally{ SYNC.pulling=false; syncPaint(); } }
function syncApply(remote){ SYNC.applying=true; try{ DB={...emptyDb(),...remote}; ensureCategories(); if(typeof migrateBalances==="function") migrateBalances(); saveDb(); } finally{ SYNC.applying=false; } }
async function syncFindGist(){ try{ const list=await gh("GET","/gists?per_page=100"); const mine=(list||[]).filter(g=>g.files&&g.files[GIST_FILE]).sort((a,b)=>String(b.updated_at).localeCompare(String(a.updated_at))); return mine.length?mine[0].id:null; }catch{ return null; } }
async function syncNow(){ if(!syncOn()) return; if(!SYNC.cfg.gistId){ const found=await syncFindGist(); if(found){ SYNC.cfg.gistId=found; syncSaveCfg(); await syncPull(); if(SYNC.dirty) await syncPush(); return; } await syncPush(); return; } const r=await syncPull(); if(r==="same"&&SYNC.dirty) await syncPush(); }
function syncJoinLink(){ return APP_URL+"#join="+encodeURIComponent(syncEncode()); }
/** Открыли ссылку вида …#join=КОД — подключаемся к общей базе сами. */
async function syncFromLink(){ const h=location.hash||""; if(!h.startsWith("#join=")) return false; const c=syncDecode(decodeURIComponent(h.slice(6))); try{ history.replaceState(null,"",location.pathname+location.search+"#/"); }catch{ location.hash="#/"; } if(!c||!c.gistId){ UI.sync_state={ok:false,message:"Ссылка подключения повреждена — попросите М отправить её заново"}; navigate("/settings"); return true; } const hasData=(DB.transactions&&DB.transactions.length)||(DB.debts&&DB.debts.length); if(hasData&&syncOn()&&SYNC.cfg.gistId===c.gistId){ syncNow(); return true; } if(hasData&&!confirm("Подключиться к общей базе М и Л? Данные на этом устройстве будут заменены общими.")) return true; SYNC.cfg=c; syncSaveCfg(); for(let i=0;i<60&&SYNC.pulling;i++) await new Promise(r=>setTimeout(r,50)); let r=await syncPull({force:true}); for(let tries=0;!r&&SYNC.needPass&&tries<3;tries++){ const p=prompt(tries?"Пароль не подошёл. Пароль общей базы (спросите у М лично):":"Общая база зашифрована. Введите пароль (спросите у М лично):"); if(p===null) break; SYNC.cfg.pass=p; syncSaveCfg(); r=await syncPull({force:true}); } UI.sync_state=r?{ok:true,message:"Подключено — данные общие с М. Добавьте страницу на экран «Домой»: Поделиться → На экран «Домой»."}:{ok:false,message:"Не удалось загрузить общую базу: "+SYNC.msg}; if(!r){ SYNC.cfg={token:"",gistId:""}; syncSaveCfg(); } syncInit(); navigate(r?"/":"/settings"); try{ rerender(); }catch{} return true; }
function syncInit(){ if(location.hash.startsWith("#join=")){ syncFromLink(); return; } syncLoadCfg(); if(!syncOn()) return; syncPaint(); syncNow(); if(SYNC.inited) return; SYNC.inited=true; let last=0; document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&Date.now()-last>8000){ last=Date.now(); syncNow(); } }); setInterval(()=>{ if(document.visibilityState==="visible"&&navigator.onLine!==false) syncNow(); },60000); window.addEventListener("pagehide",()=>{ if(SYNC.dirty){ clearTimeout(SYNC.timer); syncPush({keepalive:true}); } }); window.addEventListener("online",()=>syncNow()); }
/** Копия этого же файла с вшитым кодом общей базы — для отправки Л (работает на телефоне без настройки). */
function syncSelfCopyHtml(){ const doc=document.documentElement.cloneNode(true); ["#main","#sidebar","#topbar","#bottomnav"].forEach(sel=>{ const el=doc.querySelector(sel); if(el) el.innerHTML=""; }); doc.querySelectorAll("script[data-ff-code]").forEach(x=>x.remove()); doc.removeAttribute("data-theme"); const inj=document.createElement("script"); inj.setAttribute("data-ff-code","1"); inj.textContent="window.FF_SYNC_CODE="+JSON.stringify(syncEncode())+";"; const head=doc.querySelector("head"); head.insertBefore(inj,head.firstChild); return "<!doctype html>\n"+doc.outerHTML; }

FORMS.syncCreate=async input=>{ const token=(input.token||"").trim(); if(!token){ UI.sync_state={ok:false,message:"Вставьте токен GitHub"}; return rerender(); } const pass=(input.pass||"").trim(); if(pass.length<4){ UI.sync_state={ok:false,message:"Придумайте пароль шифрования (не короче 4 символов)"}; return rerender(); } if(!syncCryptoOk()){ UI.sync_state={ok:false,message:"Этот браузер не поддерживает шифрование — откройте файл в Chrome/Safari"}; return rerender(); } SYNC.cfg={token,gistId:"",pass}; syncSaveCfg(); UI.sync_state={ok:true,message:"Создаю общую базу…"}; rerender(); const found=await syncFindGist(); if(found){ SYNC.cfg.gistId=found; syncSaveCfg(); const r=await syncPull(); if(r===null&&SYNC.needPass){ UI.sync_state={ok:false,message:"Общая база уже есть и она зашифрована другим паролем — введите тот пароль в блоке «Защита»."}; syncInit(); return rerender(); } if(r==="pulled"||r==="same"){ SYNC.dirty=true; } } const ok=await syncPush(); UI.sync_state=ok?{ok:true,message:found?"Подключено к уже существующей общей базе, она зашифрована вашим паролем.":"Общая база создана и зашифрована. Теперь отправьте Л ссылку (кнопка «Скопировать ссылку для Л»), а пароль скажите лично."}:{ok:false,message:"Не получилось: "+SYNC.msg}; if(!ok){ SYNC.cfg={token:"",gistId:""}; syncSaveCfg(); } syncInit(); rerender(); };

  return card({title:"Общая база М и Л (облако)",subtitle:`Изменения уходят в облако через пару секунд после правки и подтягиваются при открытии и раз в минуту.${SYNC.noStorage?" На этом устройстве браузер не хранит данные между открытиями — всё берётся из облака при каждом запуске.":""}`,action:`<button type="button" class="btn secondary sm" data-act="syncNow">⟳ Обновить сейчас</button>`,body:`<p class="row mb3" style="gap:8px;flex-wrap:wrap">${statusLine}${SYNC.cfg.pass?badge("good","🔒 зашифровано"):""}<span class="xs muted">база: ${esc(SYNC.cfg.gistId||"создаётся…")}</span></p>${msg(st.ok,st.message)}${protect}
