// ===================== код-пароль при открытии (на этом устройстве) =====================
const LOCK_KEY="finflow-lock"; const LOCK={cfg:null,unlockedAt:0};
function lockLoad(){ try{ LOCK.cfg=JSON.parse(localStorage.getItem(LOCK_KEY)||"null"); }catch{ LOCK.cfg=null; } return LOCK.cfg; }
function lockSave(c){ LOCK.cfg=c; try{ if(c) localStorage.setItem(LOCK_KEY,JSON.stringify(c)); else localStorage.removeItem(LOCK_KEY); }catch{} }
async function lockHash(pin,salt){ const data=new TextEncoder().encode(salt+":"+pin); if(window.crypto&&crypto.subtle){ const h=new Uint8Array(await crypto.subtle.digest("SHA-256",data)); return "s:"+b64u8(h); } let x=5381; for(const b of data) x=((x*33)^b)>>>0; return "j:"+x.toString(16); }
function lockOn(){ return !!(LOCK.cfg&&LOCK.cfg.hash); }
function lockShow(){ if(document.getElementById("lock")) return; const d=document.createElement("div"); d.id="lock"; d.className="lock"; d.innerHTML=`<form class="lock-box" data-form="lockTry"><div class="lock-mark">₸</div><h2 class="sm semi">Финансы</h2><p class="xs muted">Введите код-пароль</p><input class="input lock-in" name="pin" type="password" inputmode="numeric" autocomplete="off" autofocus aria-label="Код"><p class="xs lock-err" role="alert"></p><button type="submit" class="btn primary">Открыть</button><button type="button" class="link-btn xs mt3" data-act="lockForgot">Забыли код?</button></form>`; document.body.appendChild(d); document.body.classList.add("locked"); setTimeout(()=>{ const i=d.querySelector("input"); if(i) i.focus(); },50); }
function lockHide(){ const d=document.getElementById("lock"); if(d) d.remove(); document.body.classList.remove("locked"); LOCK.unlockedAt=Date.now(); }
function lockInit(){ lockLoad(); if(!lockOn()) return; lockShow(); document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") LOCK.hiddenAt=Date.now(); else if(lockOn()&&LOCK.hiddenAt&&Date.now()-LOCK.hiddenAt>(LOCK.cfg.minutes||5)*60000) lockShow(); }); }
FORMS.lockTry=async input=>{ const pin=(input.pin||"").trim(); const h=await lockHash(pin,LOCK.cfg.salt); const box=document.querySelector("#lock .lock-err"); if(h===LOCK.cfg.hash){ lockHide(); } else { if(box) box.textContent="Неверный код"; const i=document.querySelector("#lock input"); if(i){ i.value=""; i.focus(); } } };
ACTIONS.lockForgot=()=>{ if(!confirm("Сбросить код-пароль? Данные на ЭТОМ устройстве будут стёрты. Если подключена общая база — после сброса откройте ссылку от М заново, и всё вернётся из облака.")) return; try{ localStorage.removeItem(STORAGE_KEY); localStorage.removeItem(LEGACY_KEY); localStorage.removeItem(LOCK_KEY); localStorage.removeItem(SYNC_KEY); localStorage.removeItem(SYNC_BACKUP_KEY); }catch{} location.reload(); };
FORMS.lockSet=async input=>{ const pin=(input.pin||"").trim(), pin2=(input.pin2||"").trim(); if(pin.length<4){ UI.lock_state={ok:false,message:"Код не короче 4 знаков"}; return rerender(); } if(pin!==pin2){ UI.lock_state={ok:false,message:"Коды не совпадают"}; return rerender(); } const salt=Math.random().toString(36).slice(2,12); const hash=await lockHash(pin,salt); lockSave({salt,hash,minutes:Math.max(1,Math.min(120,Number(input.minutes)||5))}); UI.lock_state={ok:true,message:"Код задан. Приложение будет просить его при открытии и после паузы."}; lockInit(); lockHide(); rerender(); };
ACTIONS.lockRemove=()=>{ if(!confirm("Убрать код-пароль на этом устройстве?")) return; lockSave(null); UI.lock_state={ok:true,message:"Код убран"}; rerender(); };
function lockSettingsCard(){ lockLoad(); const st=UI.lock_state||{}; let storageOk=true; try{ localStorage.getItem("x"); }catch{ storageOk=false; }
  return card({title:"Код-пароль при открытии",subtitle:"Чтобы посторонний, взяв телефон или ноутбук, не увидел ваши цифры. Свой код на каждом устройстве.",body:`${msg(st.ok,st.message)}${!storageOk?`<p class="note-box xs">На этом устройстве браузер не сохраняет настройки между открытиями — код здесь не задать.</p>`:lockOn()?`<p class="row" style="gap:8px;flex-wrap:wrap;align-items:center">${badge("good","код включён")}<span class="xs muted">запрашивается при открытии и после ${LOCK.cfg.minutes||5} мин в фоне</span><button type="button" class="btn secondary sm" data-act="lockRemove">Убрать код</button></p>`:`<form data-form="lockSet" class="form boxed"><div class="form-grid c3">${field({label:"Код (4–8 цифр или слово)",id:"lock-pin"},`<input id="lock-pin" name="pin" class="input" type="password" inputmode="numeric" autocomplete="new-password">`)}${field({label:"Повторите код",id:"lock-pin2"},`<input id="lock-pin2" name="pin2" class="input" type="password" inputmode="numeric" autocomplete="new-password">`)}${field({label:"Запирать после паузы, мин",id:"lock-min"},`<input id="lock-min" name="minutes" class="input" inputmode="numeric" value="5">`)}</div><div class="actions"><button type="submit" class="btn primary sm">Включить код</button></div></form>`}`});
}

ROUTES["/plan"]=function(params){
  const today=todayUtc(); const thisYear=today.getUTCFullYear(); const req=Number(params.year); const year=Number.isInteger(req)&&req>=2000&&req<=2100?req:thisYear; const cur=DB.settings.baseCurrency;
  const throughMonth=year===thisYear?today.getUTCMonth()+1:12; const merged=yearPlansMerged(year); const r=planVsFact(merged.plans,DB.transactions,year,throughMonth); const yg=yearGoalsData(year); const currentMonth=year===thisYear?today.getUTCMonth()+1:null;
  const header=pageHeader("Финансовый план","Сколько собираетесь заработать и потратить — и что вышло на самом деле",`<nav class="row" aria-label="Выбор года"><a href="#/plan?year=${year-1}" class="btn secondary sm">← ${year-1}</a><span class="tabular sm med">${year}</span><a href="#/plan?year=${year+1}" class="btn secondary sm">${year+1} →</a></nav>`);
  // summary

  const cell=(m,kind)=>{ const planned=kind==="INCOME"?m.plannedIncome:m.plannedExpense; const mp=merged.byMonth[m.month]; if(mp) return `<a href="#/month?year=${year}&month=${m.month}" class="plan-cell tabular plan-cell-mp" title="Подтянуто из плана на ${MONTHS_RU[m.month-1]} — менять в разделе «Месяц»">${planned>0?esc(fmt(planned,cur)):"—"}<span class="xxs muted" style="display:block;font-weight:400">из плана месяца ↗</span></a>`; const ed=UI.planEdit; if(ed&&ed.month===m.month&&ed.kind===kind) return `<form data-form="planSave" class="row" style="justify-content:flex-end;gap:4px"><input type="hidden" name="month" value="${m.month}"><input type="hidden" name="kind" value="${kind}"><input type="hidden" name="year" value="${year}"><input name="amount" autofocus value="${planned>0?esc(String(planned/100)):""}" inputmode="decimal" aria-label="План на ${m.label}, ${kind==="INCOME"?"доходы":"расходы"}" class="input plan-input" data-blur="planBlur"></form>`; return `<button type="button" class="plan-cell tabular" data-act="planEdit" data-month="${m.month}" data-kind="${kind}" aria-label="Изменить план на ${m.label}, ${kind==="INCOME"?"доходы":"расходы"}">${planned>0?esc(fmt(planned,cur)):`<span class="muted">—</span>`}</button>`; };

  const rows=r.quarters.map(q=>q.months.map(m=>`<tr class="${currentMonth===m.month?"cur":""}"><td class="ink">${m.label}${currentMonth===m.month?`<span class="muted" style="font-size:10px;margin-left:6px">сейчас</span>`:""}</td><td class="r" style="padding:4px 0">${cell(m,"INCOME")}</td><td class="r">${m.actualIncome>0?esc(fmt(m.actualIncome,cur)):"—"}</td><td class="r" style="padding:4px 0">${cell(m,"EXPENSE")}</td><td class="r">${m.actualExpense>0?esc(fmt(m.actualExpense,cur)):"—"}</td><td class="r med" style="color:${netColor(m.actualNet)}">${m.actualIncome||m.actualExpense?esc(fmtSigned(m.actualNet,cur)):"—"}</td></tr>`).join("")+`<tr class="total"><td>Итого ${q.label}</td><td class="r">${esc(fmt(q.plannedIncome,cur))}</td><td class="r">${q.actualIncome>0?esc(fmt(q.actualIncome,cur)):"—"}</td><td class="r">${esc(fmt(q.plannedExpense,cur))}</td><td class="r">${q.actualExpense>0?esc(fmt(q.actualExpense,cur)):"—"}</td><td class="r">${q.actualIncome||q.actualExpense?esc(fmtSigned(q.actualIncome-q.actualExpense,cur)):"—"}</td></tr>`).join("");

ACTIONS.planEdit=el=>{ UI.planEdit={month:Number(el.dataset.month),kind:el.dataset.kind}; rerender(); };
function savePlan(year,month,kind,value){
  const cur=DB.settings.baseCurrency; const amount=optionalAmount(value.trim()===""?"0":value,cur); if(amount===null){ UI.planMsg={ok:false,text:"Не удалось прочитать сумму"}; UI.planEdit=null; return rerender(); }
  const idx=DB.plans.findIndex(p=>p.year===year&&p.month===month&&p.kind===kind&&p.categoryId===null);
  if(amount===0){ if(idx>=0) DB.plans.splice(idx,1); UI.planMsg={ok:true,text:"План очищен"}; } else if(idx>=0){ DB.plans[idx].amount=amount; DB.plans[idx].currency=cur; UI.planMsg={ok:true,text:"План сохранён"}; } else { DB.plans.push({id:uid(),year,month,kind,categoryId:null,amount,currency:cur}); UI.planMsg={ok:true,text:"План сохранён"}; }
  UI.planEdit=null; commit();
}
FORMS.planSave=d=>{ UI._planSaving=true; savePlan(Number(d.year),Number(d.month),d.kind,d.amount||""); UI._planSaving=false; };
ACTIONS.planBlur=el=>{ if(UI._planSaving||!UI.planEdit) return; const f=el.closest("form"); const fd=new FormData(f); savePlan(Number(fd.get("year")),Number(fd.get("month")),fd.get("kind"),String(fd.get("amount")||"")); };

ROUTES["/import"]=function(){
  const accounts=activeAccounts(); const header=pageHeader("Импорт выписки","Загрузите выгрузку из интернет-банка в формате CSV — операции распознаются, разложатся по категориям и проверятся на дубли.");
  if(accounts.length===0) return header+empty("Сначала создайте счёт","Выписка загружается на конкретный счёт — создайте его в настройках.");
  const st=UI.import_state||{}; const preview=UI.importPreview; const skipDup=UI.importSkipDup!==false; const selected=preview?preview.rows.filter(r=>!(skipDup&&r.duplicate)):[];
  const step1=card({title:"Шаг 1. Файл выписки",subtitle:"CSV (из Excel: «Сохранить как → CSV»). Колонки распознаются автоматически; разделитель и кодировка windows-1251 определяются сами.",body:`<form data-form="importAnalyze" class="form"><div class="form-grid c2">${field({label:"Счёт",id:"i-acc"},`<select id="i-acc" name="accountId" required class="select">${options(accounts.map(a=>({value:a.id,label:`${a.name} (${a.currency})`})),UI.importAccount)}</select>`)}${field({label:"Файл",id:"i-file"},`<input id="i-file" name="file" type="file" accept=".csv,.txt,text/csv" required class="input">`)}</div>${st.ok===false?msg(false,st.message):""}<div class="actions"><button type="submit" class="btn primary">Разобрать файл</button></div></form>`});
  const cst=UI.importCommit_state||{};
  const step2=preview?card({title:"Шаг 2. Проверьте, что получилось",subtitle:`${preview.fileName} · распознано строк: ${preview.rows.length}${preview.errors.length>0?` · не удалось прочитать: ${preview.errors.length}`:""}`,body:`<div class="row mb3" style="flex-wrap:wrap">${preview.duplicateCount>0?`<label class="row xs sec" style="gap:8px"><input type="checkbox" ${skipDup?"checked":""} data-change="importSkipDup">Пропустить дубли (${preview.duplicateCount})</label>`:""}<p class="xs muted">Будет добавлено: ${selected.length}</p></div>
    <div class="scroll-y" style="border:1px solid var(--border);border-radius:8px"><table style="min-width:40rem"><thead><tr><th style="padding:8px 12px">Дата</th><th style="padding:8px 12px">Описание</th><th style="padding:8px 12px">Категория</th><th class="r" style="padding:8px 12px">Сумма</th><th style="padding:8px 12px">Статус</th></tr></thead><tbody class="tabular">${preview.rows.slice(0,200).map(r=>`<tr style="${skipDup&&r.duplicate?"opacity:.45":""}"><td style="padding:6px 12px;white-space:nowrap">${r.date}</td><td class="trunc ink" style="padding:6px 12px;max-width:16rem">${esc(r.merchant??r.description)}</td><td style="padding:6px 12px">${r.categoryName?esc(r.categoryName):`<span class="muted">—</span>`}</td><td class="r med" style="padding:6px 12px;white-space:nowrap;color:${r.type==="INCOME"?"var(--success-text)":"var(--text-primary)"}">${r.type==="INCOME"?"+":"−"}${esc(fmt(r.amount,r.currency))}</td><td style="padding:6px 12px">${r.duplicate?badge("warning","уже есть"):badge("good","новая")}</td></tr>`).join("")}</tbody></table></div>
    ${preview.rows.length>200?`<p class="xs muted mt2">Показаны первые 200 строк из ${preview.rows.length}; импортированы будут все.</p>`:""}
    ${preview.errors.length>0?`<details class="mt3" style="border:1px solid var(--border);border-radius:8px;padding:12px"><summary>Строки, которые не удалось прочитать (${preview.errors.length})</summary><ul class="stack xs muted mt2" style="gap:4px">${preview.errors.slice(0,20).map(e=>`<li>Строка ${e.rowNumber}: ${esc(e.message)}</li>`).join("")}</ul></details>`:""}
    <form data-form="importCommit" class="form mt4" style="gap:12px">${msg(cst.ok,cst.message)}<div class="actions"><button type="submit" class="btn primary" ${selected.length===0?"disabled":""}>Импортировать ${selected.length} операц.</button></div></form>`}):"";
  const batches=[...DB.batches].sort((a,b)=>b.importedAt<a.importedAt?-1:1).slice(0,20);
  const history=card({title:"История импортов",subtitle:"Любую загрузку можно отменить целиком",body:batches.length===0?`<p class="xs muted" style="padding:24px 0;text-align:center">Выписки ещё не загружались</p>`:`<ul class="list-divided">${batches.map(b=>`<li class="between" style="align-items:center"><div class="min0"><p class="trunc sm">${esc(b.fileName)}</p><p class="xs muted">${b.importedAt.slice(0,10)} · добавлено ${b.importedCount}${b.skippedCount>0?` · пропущено ${b.skippedCount}`:""}${b.source?` · ${esc(b.source)}`:""}</p></div><button type="button" class="btn secondary sm" data-act="importUndo" data-id="${b.id}">Отменить</button></li>`).join("")}</ul>`});
  return header+`<div class="stack">${step1}${step2}${history}</div>`;
};
FORMS.importAnalyze=async(input,form)=>{
  const fail=m=>{ UI.import_state={ok:false,message:m}; UI.importPreview=null; rerender(); };
  const file=form.querySelector('input[type=file]').files[0]; const accountId=input.accountId; UI.importAccount=accountId;
  if(!file||file.size===0) return fail("Выберите файл выписки"); if(file.size>8*1024*1024) return fail("Файл больше 8 МБ");
  const account=DB.accounts.find(a=>a.id===accountId); if(!account) return fail("Счёт не найден");
  const bytes=new Uint8Array(await file.arrayBuffer()); if(bytes[0]===0x50&&bytes[1]===0x4b) return fail("Это файл Excel. В офлайн-версии поддерживается только CSV: откройте выписку в Excel и сохраните как CSV.");
  const table=parseCsv(decodeCsvBytes(bytes)); if(table.headers.length===0) return fail("Файл пуст или не содержит таблицы");
  const mapping=detectMapping(table.headers); const {drafts,errors}=buildDrafts(table,mapping,{accountId,defaultCurrency:account.currency});
  const catNames=new Map(DB.categories.map(c=>[c.id,c.name])); const existing=new Set(DB.transactions.map(t=>t.dedupeHash).filter(Boolean));
  const rows=drafts.map(d=>{ const categoryId=categorize(d,DB.rules); return {...d,categoryId,categoryName:categoryId?(catNames.get(categoryId)??null):null,duplicate:existing.has(d.dedupeHash)}; });
  UI.importPreview={fileName:file.name,accountId,rows,errors,duplicateCount:rows.filter(r=>r.duplicate).length}; UI.import_state={ok:true}; UI.importCommit_state={}; rerender();
};
ACTIONS.importSkipDup=el=>{ UI.importSkipDup=el.checked; rerender(); };
FORMS.importCommit=()=>{
  const p=UI.importPreview; if(!p) return; const skipDup=UI.importSkipDup!==false; const rows=p.rows.filter(r=>!(skipDup&&r.duplicate)); const account=DB.accounts.find(a=>a.id===p.accountId);
  const fail=m=>{ UI.importCommit_state={ok:false,message:m}; rerender(); }; if(!account) return fail("Счёт не найден"); if(rows.length===0) return fail("Нечего импортировать");
  const existing=new Set(DB.transactions.map(t=>t.dedupeHash).filter(Boolean)); const fresh=rows.filter(r=>!existing.has(r.dedupeHash)); const skipped=rows.length-fresh.length; if(fresh.length===0) return fail("Все операции из файла уже добавлены ранее");
  const batch={id:uid(),fileName:p.fileName,source:account.name,rowCount:rows.length,importedCount:fresh.length,skippedCount:skipped,importedAt:new Date().toISOString()}; DB.batches.push(batch);
  for(const r of fresh) DB.transactions.push({id:uid(),type:r.type,date:r.date,amount:r.amount,currency:r.currency,accountId:p.accountId,toAccountId:null,toAmount:null,categoryId:r.categoryId,merchant:r.merchant,note:r.description||null,dedupeHash:r.dedupeHash,importBatchId:batch.id,createdAt:Date.now()});
  UI.importPreview=null; UI.importCommit_state={ok:true,message:skipped>0?`Добавлено операций: ${fresh.length}. Пропущено дублей: ${skipped}`:`Добавлено операций: ${fresh.length}`}; commit();
};
ACTIONS.importUndo=el=>{ const id=el.dataset.id; DB.transactions=DB.transactions.filter(t=>t.importBatchId!==id); DB.batches=DB.batches.filter(b=>b.id!==id); commit(); };

  const categoriesCard=card({title:"Категории",subtitle:"Отметьте обязательные расходы — те, без которых не прожить. По ним считается размер финансовой подушки.",action:`<button type="button" class="btn secondary sm" data-act="toggle" data-key="category">${UI.category?"Закрыть":"Добавить"}</button>`,body:`${UI.category?`<form data-form="categorySave" class="form boxed"><div class="form-grid c4">${field({label:"Название",id:"c-name",error:cst.fieldErrors?.name,cls:"span2"},`<input id="c-name" name="name" required placeholder="Спорт" class="input">`)}${field({label:"Тип",id:"c-kind"},`<select id="c-kind" name="kind" class="select">${options([{value:"EXPENSE",label:"Расход"},{value:"INCOME",label:"Доход"}],"EXPENSE")}</select>`)}${field({label:"Значок",id:"c-icon",hint:"эмодзи"},`<input id="c-icon" name="icon" value="•" maxlength="4" class="input">`)}</div>${cst.ok===false?msg(false,cst.message):""}<div class="actions"><button type="submit" class="btn primary sm">Добавить категорию</button></div></form>`:""}
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:24px"><div><h3 class="xs semi muted mb2" style="margin-bottom:8px">Расходы</h3><ul class="stack" style="gap:4px">${expense.map(c=>`<li class="row xs" style="gap:8px;padding:4px"><label class="row min0 flex1" style="gap:8px;cursor:pointer"><input type="checkbox" ${c.essential?"checked":""} data-change="categoryEssential" data-id="${c.id}" aria-label="«${esc(c.name)}» — обязательный расход"><span aria-hidden>${esc(c.icon)}</span><span class="trunc">${esc(c.name)}</span>${c.essential?`<span class="muted shrink0" style="font-size:10px">обязательный</span>`:""}</label><button type="button" class="link-btn shrink0" data-act="categoryArchive" data-id="${c.id}" aria-label="Убрать категорию «${esc(c.name)}»">✕</button></li>`).join("")}</ul></div><div><h3 class="xs semi muted" style="margin-bottom:8px">Доходы</h3><ul class="row" style="flex-wrap:wrap;gap:6px">${income.map(c=>`<li><span class="row xs" style="gap:6px;border:1px solid var(--border);border-radius:8px;padding:4px 8px"><span aria-hidden>${esc(c.icon)}</span>${esc(c.name)}<button type="button" class="muted" data-act="categoryArchive" data-id="${c.id}" aria-label="Убрать категорию «${esc(c.name)}»">✕</button></span></li>`).join("")}</ul></div></div>`});
  const rulesCard=card({title:"Правила категоризации",subtitle:"Применяются при импорте выписки: операция получает категорию по совпадению текста. Побеждает правило с наименьшим приоритетом.",action:`<button type="button" class="btn secondary sm" data-act="toggle" data-key="rule">${UI.rule?"Закрыть":"Добавить"}</button>`,body:`${UI.rule?`<form data-form="ruleSave" class="form boxed"><div class="form-grid c5">${field({label:"Текст",id:"r-pattern",error:rst.fieldErrors?.pattern},`<input id="r-pattern" name="pattern" required placeholder="magnum" class="input">`)}${field({label:"Где искать",id:"r-field"},`<select id="r-field" name="field" class="select">${options([{value:"ANY",label:"Везде"},{value:"MERCHANT",label:"В контрагенте"},{value:"NOTE",label:"В комментарии"}],"ANY")}</select>`)}${field({label:"Как сравнивать",id:"r-match"},`<select id="r-match" name="match" class="select">${options([{value:"CONTAINS",label:"Содержит"},{value:"EQUALS",label:"Точно равно"},{value:"REGEX",label:"Регулярное выражение"}],"CONTAINS")}</select>`)}${field({label:"Категория",id:"r-cat",error:rst.fieldErrors?.categoryId},`<select id="r-cat" name="categoryId" required class="select">${options(categories.map(c=>({value:c.id,label:`${c.icon} ${c.name}`})),"","Выберите")}</select>`)}${field({label:"Приоритет",id:"r-prio",hint:"меньше — важнее"},`<input id="r-prio" name="priority" type="number" min="1" max="999" value="100" class="input">`)}</div>${rst.ok===false?msg(false,rst.message):""}<div class="actions"><button type="submit" class="btn primary sm">Добавить правило</button></div></form>`:""}
    ${rules.length===0?`<p class="xs muted" style="padding:16px 0;text-align:center">Правил пока нет</p>`:`<ul class="list-divided">${rules.map(r=>{ const c=catById.get(r.categoryId); return `<li class="between" style="align-items:center;padding:8px 0"><span class="row min0 xs" style="gap:8px"><span class="tabular muted shrink0" style="width:32px">${r.priority}</span><code class="trunc">${esc(r.pattern)}</code><span class="muted">→</span>${dot(c?.color??"#94a3b8")}<span class="trunc">${esc(c?.name??"—")}</span></span><button type="button" class="link-btn shrink0" data-act="ruleDelete" data-id="${r.id}" aria-label="Удалить правило «${esc(r.pattern)}»">Удалить</button></li>`; }).join("")}</ul>`}`});
  const dataCard=card({title:"Данные",subtitle:"Всё хранится в этом браузере. Сделайте резервную копию, чтобы не потерять данные при очистке браузера или перенести их на другой компьютер.",body:`<div class="row" style="flex-wrap:wrap;gap:8px"><button type="button" class="btn secondary sm" data-act="dataExport">Скачать резервную копию</button><label class="btn secondary sm" style="cursor:pointer">Загрузить копию<input type="file" accept=".json,application/json" class="sr-only" data-change="dataImport"></label><button type="button" class="btn secondary sm" data-act="dataClean">Начать с чистого листа</button><button type="button" class="btn secondary sm" data-act="dataDemo">Загрузить пример данных</button><button type="button" class="btn secondary sm" data-act="dataClear" style="color:var(--status-critical)">Очистить всё</button></div>${UI.data_state?`<div class="mt3">${msg(UI.data_state.ok,UI.data_state.message)}</div>`:""}<p class="xs muted mt3">Операций: ${DB.transactions.length} · счетов: ${DB.accounts.length} · категорий: ${DB.categories.length}</p>`});
  return pageHeader("Настройки","Счета, категории, правила категоризации и общие параметры")+`<div class="stack">${general}${syncSettingsCard()}${lockSettingsCard()}${tgSettingsCard()}${accountsCard}${categoriesCard}${rulesCard}${dataCard}</div>`;
};
FORMS.settingsSave=input=>{ const cur=String(input.baseCurrency||"").toUpperCase(); if(!CURRENCIES[cur]){ UI.general_state={ok:false,message:"Неизвестная валюта"}; return rerender(); } DB.settings.baseCurrency=cur; DB.settings.locale=input.locale||"ru-RU"; DB.settings.weekStartsOn=Number(input.weekStartsOn)===0?0:1; UI.general_state={ok:true,message:"Настройки сохранены"}; commit(); };
FORMS.accountSave=input=>{ const fail=(message,fieldErrors)=>{ UI.account_state={ok:false,message,fieldErrors}; rerender(); }; const name=(input.name||"").trim(); if(!name) return fail("Проверьте заполнение формы",{name:"Укажите название счёта"}); const currency=String(input.currency||"").toUpperCase(); if(!CURRENCIES[currency]) return fail("Неизвестная валюта",{currency:"Неизвестная валюта"}); const raw=(input.openingBalance||"").trim(); let opening=0; if(raw!==""&&raw!=="0"){ try{ opening=parseMoneyInput(raw,currency); }catch{ return fail("Не удалось прочитать начальный остаток",{openingBalance:"Неверная сумма"}); } } DB.accounts.push({id:uid(),name:name.slice(0,80),type:input.type||"CARD",currency,openingBalance:opening,color:"#6366f1",archived:false,sortOrder:DB.accounts.length+1}); UI.account=false; UI.account_state={}; commit(); };
ACTIONS.accountArchive=el=>{ const a=DB.accounts.find(x=>x.id===el.dataset.id); if(a){ a.archived=!a.archived; commit(); } };
FORMS.categorySave=input=>{ const fail=(message,fieldErrors)=>{ UI.category_state={ok:false,message,fieldErrors}; rerender(); }; const name=(input.name||"").trim(); if(!name) return fail("Проверьте заполнение формы",{name:"Укажите название категории"}); const kind=input.kind==="INCOME"?"INCOME":"EXPENSE"; if(DB.categories.some(c=>c.name===name&&c.kind===kind&&!c.archived)) return fail("Категория с таким названием уже есть"); DB.categories.push({id:uid(),name:name.slice(0,60),kind,parentId:null,color:"#64748b",icon:(input.icon||"•").trim().slice(0,4)||"•",essential:false,archived:false,sortOrder:DB.categories.length}); UI.category=false; UI.category_state={}; commit(); };
ACTIONS.categoryEssential=el=>{ const c=DB.categories.find(x=>x.id===el.dataset.id); if(c){ c.essential=el.checked; commit(); } };
ACTIONS.categoryArchive=el=>{ const c=DB.categories.find(x=>x.id===el.dataset.id); if(c){ c.archived=true; commit(); } };
FORMS.ruleSave=input=>{ const fail=(message,fieldErrors)=>{ UI.rule_state={ok:false,message,fieldErrors}; rerender(); }; const pattern=(input.pattern||"").trim(); if(!pattern) return fail("Проверьте заполнение формы",{pattern:"Укажите текст для поиска"}); if(!input.categoryId) return fail("Проверьте заполнение формы",{categoryId:"Выберите категорию"}); DB.rules.push({id:uid(),pattern:pattern.slice(0,120),field:input.field||"ANY",match:input.match||"CONTAINS",categoryId:input.categoryId,priority:Math.max(1,Math.min(999,Number(input.priority)||100)),enabled:true}); UI.rule=false; UI.rule_state={}; commit(); };
ACTIONS.ruleDelete=el=>{ DB.rules=DB.rules.filter(r=>r.id!==el.dataset.id); commit(); };
ACTIONS.dataExport=()=>{ const blob=new Blob([exportDb()],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`finflow-backup-${formatDateISO(todayUtc())}.json`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); };
ACTIONS.dataImport=async el=>{ const f=el.files[0]; if(!f) return; try{ importDb(await f.text()); UI.data_state={ok:true,message:"Резервная копия загружена"}; }catch(e){ UI.data_state={ok:false,message:e.message||"Не удалось прочитать файл"}; } rerender(); };
ACTIONS.dataDemo=()=>{ if(!confirm("Заменить все данные вымышленным примером? Текущие данные будут удалены.")) return; resetDb("demo"); UI.data_state={ok:true,message:"Загружен пример данных"}; rerender(); };
ACTIONS.dataClean=()=>{ if(!confirm("Удалить все операции, кредиты, цели и планы и оставить только категории и пустые счета?")) return; resetDb("clean"); UI.data_state={ok:true,message:"Начато с чистого листа"}; rerender(); };
ACTIONS.dataClear=()=>{ if(!confirm("Удалить все данные без возможности восстановления?")) return; resetDb("empty"); UI.data_state={ok:true,message:"Данные очищены"}; rerender(); };

// ===================== boot =====================
(function(){ applyTheme(readTheme()); loadDb(); renderChrome(); try{ lockInit(); }catch(e){ console.warn(e); } setTimeout(tgAutoSync,300); setTimeout(syncInit,50); window.addEventListener("hashchange",()=>{ UI.txNewHandled=false; UI.txEditing=null; UI.txConfirm=null; UI.planEdit=null; UI.planMsg=null; render(); }); render(); })();

/** Годовой план: месяцы с планом в разделе «Месяц» берутся оттуда (доход = «Итого доход», расход = все конверты), остальные — из ручных строк. */
function yearPlansMerged(year){ mpEnsure(); const cur=DB.settings.baseCurrency; const byMonth={}; for(const p of DB.monthPlans){ if(p.year!==year) continue; const t=mpTotals(p); byMonth[p.month]={income:t.income,expense:t.spent,plan:p}; } const manual=DB.plans.filter(p=>p.year===year&&!byMonth[p.month]); const gen=[]; for(const m of Object.keys(byMonth)){ const mm=Number(m); gen.push({id:"mp-inc-"+m,year,month:mm,kind:"INCOME",categoryId:null,amount:byMonth[m].income,currency:cur},{id:"mp-exp-"+m,year,month:mm,kind:"EXPENSE",categoryId:null,amount:byMonth[m].expense,currency:cur}); } return {plans:[...manual,...gen],byMonth}; }
function yearGoalsData(year){ mpEnsure(); const plans=DB.monthPlans.filter(p=>p.year===year); let savingsPlan=0; for(const p of plans) for(const g of p.groups) if(MP_SAVINGS_RE.test(g.name)) savingsPlan+=g.items.reduce((a,i)=>a+i.amount,0);
  const rows=DB.goals.filter(g=>!g.archived).map(g=>{ let planned=0; const months=[]; for(const p of plans) for(const gr of p.groups) if(goalMatchesGroup(g,gr)){ const t=gr.items.reduce((a,i)=>a+i.amount,0); planned+=t; if(t) months.push(MONTHS_RU_SHORT[p.month-1]); } const all=goalAllContributions(g); const fact=all.filter(c=>String(c.date).startsWith(String(year))).reduce((a,c)=>a+c.amount,0); const saved=all.reduce((a,c)=>a+c.amount,0); return {g,planned,fact,months,saved,remaining:Math.max(0,g.targetAmount-saved)}; });
  return {savingsPlan,rows}; }
function yearGoalsCard(yg,year,cur){ if(!yg.rows.length) return ""; const tp=yg.rows.reduce((a,r)=>a+r.planned,0), tf=yg.rows.reduce((a,r)=>a+r.fact,0);
  return card({title:`Цели в ${year} году`,subtitle:"Взносы по планам месяцев (конверты «Досрочка», «Фин подушка», «ПВ…») против факта",action:`<a href="#/goals" class="xs muted">Все цели →</a>`,body:`<div class="scroll-x"><table style="min-width:40rem"><thead><tr><th>Цель</th><th class="r">По плану за год</th><th class="r">Внесено по факту</th><th class="r">Выполнение</th><th class="r">До цели осталось</th></tr></thead><tbody class="tabular">${yg.rows.map(r=>`<tr><td class="ink"><span class="row" style="gap:6px">${dot(r.g.color)}${esc(r.g.name)}</span>${r.months.length?`<span class="xs muted" style="display:block;font-weight:400">планы: ${esc(r.months.join(", "))}</span>`:`<span class="xs muted" style="display:block;font-weight:400">в планах месяцев конверта нет</span>`}</td><td class="r">${r.planned?esc(fmt(r.planned,cur)):"—"}</td><td class="r">${r.fact?esc(fmt(r.fact,cur)):"—"}</td><td class="r">${r.planned?badge(r.fact>=r.planned?"good":r.fact>0?"warning":"neutral",`${percentOf(r.fact,r.planned).toFixed(0)}%`):"—"}</td><td class="r">${esc(fmt(r.remaining,cur))}</td></tr>`).join("")}<tr class="total"><td>Итого</td><td class="r">${esc(fmt(tp,cur))}</td><td class="r">${tf?esc(fmt(tf,cur)):"—"}</td><td class="r">${tp?`${percentOf(tf,tp).toFixed(0)}%`:"—"}</td><td></td></tr></tbody></table></div>`});
}
