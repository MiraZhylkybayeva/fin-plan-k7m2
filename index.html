<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Личный финансовый учёт: операции, бюджеты, накопительные цели, капитал, кредиты, годовой план и импорт выписок. Офлайн-версия, данные хранятся в браузере.">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f9f9f7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0d0d">
<title>Финансы</title>
<script>(function(){try{var m=localStorage.getItem("finflow-theme");if(m==="light"||m==="dark"){document.documentElement.setAttribute("data-theme",m);}}catch(e){}})();</script>
<style>
:root{--page:#f9f9f7;--surface:#fcfcfb;--surface-raised:#fff;--text-primary:#0b0b0b;--text-secondary:#52514e;--text-muted:#898781;--border:rgba(11,11,11,.1);--grid:#e1e0d9;--axis:#c3c2b7;
--series-1:#0f7b9c;--series-2:#eb6834;--series-3:#1baf7a;--series-4:#eda100;
--status-good:#0ca30c;--status-warning:#fab219;--status-serious:#ec835a;--status-critical:#d03b3b;--success-text:#006300;--focus:#0f7b9c;
--nav-overview:#0f7b9c;--nav-transactions:#3f5bd6;--nav-budgets:#8a3fc0;--nav-goals:#c0357f;--nav-capital:#0e7a5a;--nav-loans:#c85321;--nav-plan:#8a6a10;--nav-import:#1f6f86;--nav-settings:#5c6472}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--page:#0d0d0d;--surface:#1a1a19;--surface-raised:#232322;--text-primary:#fff;--text-secondary:#c3c2b7;--text-muted:#898781;--border:rgba(255,255,255,.1);--grid:#2c2c2a;--axis:#383835;--series-1:#1f97bd;--series-2:#d95926;--series-3:#199e70;--series-4:#c98500;--success-text:#0ca30c;--focus:#1f97bd;--nav-overview:#3fb2d6;--nav-transactions:#8fa4ff;--nav-budgets:#c08cf2;--nav-goals:#f284b8;--nav-capital:#2fbc94;--nav-loans:#ff8f5e;--nav-plan:#d8ad3c;--nav-import:#6fc7de;--nav-settings:#a3adbd}}
:root[data-theme=dark]{--page:#0d0d0d;--surface:#1a1a19;--surface-raised:#232322;--text-primary:#fff;--text-secondary:#c3c2b7;--text-muted:#898781;--border:rgba(255,255,255,.1);--grid:#2c2c2a;--axis:#383835;--series-1:#1f97bd;--series-2:#d95926;--series-3:#199e70;--series-4:#c98500;--success-text:#0ca30c;--focus:#1f97bd;--nav-overview:#3fb2d6;--nav-transactions:#8fa4ff;--nav-budgets:#c08cf2;--nav-goals:#f284b8;--nav-capital:#2fbc94;--nav-loans:#ff8f5e;--nav-plan:#d8ad3c;--nav-import:#6fc7de;--nav-settings:#a3adbd}
*{box-sizing:border-box;border-color:var(--border)}
html,body{margin:0;min-height:100dvh}
body{background:var(--page);color:var(--text-primary);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
:where(a,button,input,select,textarea,[tabindex]):focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.tabular{font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:disabled{cursor:not-allowed;opacity:.5}
h1,h2,h3,p,ul,ol,dl,dd{margin:0}ul,ol{padding:0;list-style:none}
.app{display:flex;min-height:100dvh}
.sidebar{display:none;position:sticky;top:0;height:100dvh;width:224px;flex-shrink:0;flex-direction:column;gap:4px;overflow-y:auto;border-right:1px solid var(--border);padding:16px}
.brand{display:flex;align-items:center;gap:8px;padding:0 8px;margin-bottom:24px;font-weight:600;font-size:14px}
.brand-mark{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--series-1);color:var(--page);font-weight:700;font-size:14px}
.nav-item{position:relative;display:flex;align-items:center;gap:10px;border-radius:8px;padding:6px 12px;font-size:14px;color:var(--text-secondary);transition:.15s}
.nav-item:hover{color:var(--text-primary)}
.nav-item.active{font-weight:600;color:var(--text-primary);background:color-mix(in srgb,var(--nc) 16%,transparent)}
.nav-item.active::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--nc)}
.nav-icon{display:grid;place-items:center;width:26px;height:26px;border-radius:8px;font-weight:600;line-height:1;font-size:14px;color:var(--nc);background:color-mix(in srgb,var(--nc) 26%,transparent);flex-shrink:0}
.nav-item.active .nav-icon{color:var(--surface);background:var(--nc)}
.main-col{display:flex;min-width:0;flex:1;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--border);padding:10px 16px}
.topbar .brand{margin:0;padding:0}
main{min-width:0;flex:1;padding-bottom:80px}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;border-top:1px solid var(--border);background:color-mix(in srgb,var(--surface) 95%,transparent);backdrop-filter:blur(8px)}
.bottom-nav .nav-item{flex:1;flex-direction:column;gap:4px;padding:8px 0;font-size:10px;border-radius:0;color:var(--text-muted)}
.bottom-nav .nav-item.active::before{left:10px;right:10px;top:0;bottom:auto;width:auto;height:3px;border-radius:0 0 3px 3px}
.bottom-nav .nav-icon{width:28px;height:28px;font-size:16px}
@media(min-width:768px){.sidebar{display:flex}.topbar,.bottom-nav{display:none}main{padding-bottom:0}}
.theme-toggle{display:flex;gap:2px;border:1px solid var(--border);border-radius:8px;padding:2px}
.sidebar .theme-toggle{margin:-12px 0 12px}
.topbar .theme-toggle{width:auto}
.theme-toggle button{flex:1;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:var(--text-muted)}
.theme-toggle button:hover{background:var(--page);color:var(--text-primary)}
.theme-toggle button.active{background:var(--text-primary);color:var(--page)}
.shell{max-width:1152px;margin:0 auto;padding:24px 16px}
@media(min-width:640px){.shell{padding:32px 24px}}
.page-header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:24px}
.page-header h1{font-size:20px;font-weight:600;letter-spacing:-.01em}
.page-header .desc{margin-top:4px;font-size:14px;color:var(--text-muted)}
.card{border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:16px}
@media(min-width:640px){.card{padding:20px}}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.card-head h2{font-size:14px;font-weight:600}
.card-head .sub{margin-top:2px;font-size:12px;color:var(--text-muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr}.g3{grid-template-columns:1fr}.g4{grid-template-columns:1fr}
@media(min-width:640px){.g2,.g4{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1024px){.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1280px){.g4{grid-template-columns:repeat(4,1fr)}}
.items-start{align-items:start}
.tile{border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:16px}
.tile .label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--text-muted)}
.tile .value{margin-top:8px;font-size:24px;font-weight:600;letter-spacing:-.01em}
.tile .foot{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 8px;font-size:12px;color:var(--text-muted)}
.tile .delta{display:inline-flex;gap:4px;font-weight:500}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex-shrink:0}
.dot.sm{width:8px;height:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;font-weight:500;height:40px;padding:0 16px;font-size:14px;transition:.15s;white-space:nowrap}
.btn.sm{height:32px;padding:0 12px;font-size:12px}
.btn.primary{background:var(--text-primary);color:var(--page)}.btn.primary:hover{opacity:.9}
.btn.secondary{border:1px solid var(--border);background:var(--surface)}.btn.secondary:hover{background:var(--page)}
.btn.ghost{color:var(--text-secondary)}.btn.ghost:hover{background:var(--page);color:var(--text-primary)}
.link-btn{border-radius:6px;padding:4px 8px;font-size:12px;color:var(--text-muted)}.link-btn:hover{background:var(--page);color:var(--text-primary)}
.link-btn.danger{color:var(--status-critical);font-weight:500}
.input,.select{height:40px;width:100%;border:1px solid var(--border);border-radius:8px;background:var(--surface-raised);padding:0 12px;font:inherit;color:var(--text-primary)}
.input::placeholder{color:var(--text-muted)}
.select{appearance:none;padding-right:32px;background-image:linear-gradient(45deg,transparent 50%,var(--text-muted) 50%),linear-gradient(135deg,var(--text-muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.input[type=file]{padding-top:8px;font-size:12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.grid>*,.form-grid>*,.stack>*{min-width:0}
body{overflow-x:hidden}
input[type=date]{min-width:0;-webkit-appearance:none}
.field label{font-size:12px;font-weight:500;color:var(--text-secondary)}
.field .hint{font-size:11px;color:var(--text-muted)}
.field .err{font-size:11px;font-weight:500;color:var(--status-critical)}
.form-grid{display:grid;gap:16px}
@media(min-width:640px){.form-grid.c2{grid-template-columns:repeat(2,1fr)}.form-grid.c3{grid-template-columns:repeat(3,1fr)}.form-grid.c4{grid-template-columns:repeat(2,1fr)}.form-grid.c5{grid-template-columns:repeat(2,1fr)}.span2{grid-column:span 2}}
@media(min-width:1024px){.form-grid.c4{grid-template-columns:repeat(4,1fr)}.form-grid.c5{grid-template-columns:repeat(5,1fr)}}
.form{display:flex;flex-direction:column;gap:16px}
.form.boxed{border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:16px}
.actions{display:flex;justify-content:flex-end;gap:8px}
.msg{display:flex;align-items:center;gap:6px;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:500}
.msg.ok{color:var(--success-text);background:color-mix(in srgb,var(--success-text) 10%,transparent)}
.msg.bad{color:var(--status-critical);background:color-mix(in srgb,var(--status-critical) 10%,transparent)}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:2px 6px;font-size:11px;font-weight:500;color:var(--bc);background:color-mix(in srgb,var(--bc) 12%,transparent)}
.bar{height:8px;width:100%;overflow:hidden;border-radius:999px;background:color-mix(in srgb,var(--text-muted) 20%,transparent)}
.bar>div{height:100%;border-radius:999px;transition:width .2s}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:1px dashed var(--border);border-radius:8px;padding:40px 24px;text-align:center}
.empty .t{font-size:14px;font-weight:500}.empty .d{max-width:24rem;font-size:12px;color:var(--text-muted)}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.muted{color:var(--text-muted)}.sec{color:var(--text-secondary)}.ink{color:var(--text-primary)}
.xs{font-size:12px}.xxs{font-size:11px}.sm{font-size:14px}
.med{font-weight:500}.semi{font-weight:600}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.min0{min-width:0}.flex1{flex:1}.shrink0{flex-shrink:0}
.mt1{margin-top:4px}.mt2{margin-top:8px}.mt3{margin-top:12px}.mt4{margin-top:16px}.mb2{margin-top:0;margin-bottom:8px}.mb3{margin-bottom:12px}.mb4{margin-bottom:16px}
.divider{border-top:1px solid var(--border);padding-top:12px;margin-top:12px}
.list-divided>li{border-top:1px solid var(--border);padding:10px 0}.list-divided>li:first-child{border-top:0;padding-top:0}
.tx-list{border:1px solid var(--border);border-radius:12px;background:var(--surface)}
.tx-list>li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--border)}
.tx-list>li:first-child{border-top:0}
@media(min-width:640px){.tx-list>li{padding:10px 16px}}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;border:1px solid var(--border);border-radius:8px;padding:4px}
.seg button{border-radius:6px;padding:6px 12px;font-size:12px;font-weight:500;color:var(--text-secondary)}
.seg button:hover{background:var(--page)}.seg button.active{background:var(--text-primary);color:var(--page)}
.chip{border:1px solid var(--border);border-radius:999px;padding:6px 12px;font-size:12px;background:var(--surface);color:var(--text-secondary)}
.chip:hover{color:var(--text-primary)}.chip.active{background:var(--text-primary);color:var(--page);border-color:var(--text-primary)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:8px 0;text-align:left;font-weight:500;color:var(--text-muted);border-bottom:1px solid var(--border)}
td{padding:6px 0;border-bottom:1px solid var(--border);color:var(--text-secondary)}
tr:last-child td{border-bottom:0}
th.r,td.r{text-align:right}
.scroll-x{overflow-x:auto}
.scroll-y{max-height:24rem;overflow:auto}
.scroll-y thead th{position:sticky;top:0;background:var(--surface)}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px}
.legend li{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-secondary)}
.legend .sw{width:10px;height:10px;border-radius:2px}
.chart-wrap{position:relative}
.chart-wrap svg{width:100%;height:auto;display:block}
.tooltip{pointer-events:none;position:absolute;top:0;transform:translateX(-50%);border:1px solid var(--border);border-radius:8px;background:var(--surface-raised);padding:6px 10px;font-size:12px;box-shadow:0 1px 3px rgba(0,0,0,.1);white-space:nowrap}
.tooltip p{display:flex;align-items:center;gap:6px}
.tooltip .sw{width:8px;height:8px;border-radius:2px}
.tooltip .v{margin-left:auto;font-weight:500;padding-left:8px}
.note-box{border-radius:8px;background:var(--page);padding:8px 12px;font-size:12px;color:var(--text-secondary)}
.good-box{border-radius:8px;background:color-mix(in srgb,var(--status-good) 11%,transparent);padding:10px 12px;font-size:12px;color:var(--text-secondary)}
.plan-cell{width:100%;text-align:right;border-radius:4px;padding:2px 6px}
.plan-cell:hover{background:var(--page)}
.plan-input{height:28px;width:112px;padding:0 8px;text-align:right;font-size:12px}
tr.cur td{background:var(--page)}
tr.total td{background:color-mix(in srgb,var(--page) 60%,transparent);font-weight:500;color:var(--text-primary)}
code{border-radius:4px;background:var(--page);padding:2px 6px;font-size:11px}
input[type=checkbox]{width:14px;height:14px;accent-color:var(--series-1)}
details summary{cursor:pointer;font-size:12px;font-weight:500}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
/* ---- план на месяц (конверты, как в Excel) ---- */
.mp-layout{display:grid;gap:16px;align-items:start}
@media(min-width:1024px){.mp-layout{grid-template-columns:minmax(380px,1.1fr) 1.9fr}}
.mp-block{border-radius:8px;padding:6px 8px;font-size:13px}
.mp-row{display:flex;align-items:center;gap:6px;padding:3px 4px;border-radius:4px;min-height:30px}
.mp-row.mp-head{font-weight:600;justify-content:space-between;border-bottom:1px solid rgba(0,0,0,.15);margin-bottom:2px}
.mp-row.mp-total{font-weight:700;border-top:1px solid rgba(0,0,0,.15);margin-top:2px}
.mp-row.mp-foot{justify-content:flex-start;border-top:1px dashed rgba(0,0,0,.2);margin-top:2px;font-weight:700}
.mp-in{background:rgba(255,255,255,.55);color:inherit;border:1px solid transparent;border-radius:4px;padding:3px 6px;font:inherit;height:26px;min-width:0}
.mp-in:hover{border-color:rgba(0,0,0,.25)}
.mp-in:focus{background:var(--surface-raised);color:var(--text-primary);border-color:var(--focus);outline:none}
.mp-block[style*="color:#ffffff"] .mp-in,.mp-block[style*="color:#fff"] .mp-in{background:rgba(255,255,255,.12)}
.mp-amt{width:7.5rem;text-align:right;font-weight:700}
.mp-name{flex:1;font-weight:500}
.mp-pct{width:3.6rem;flex-shrink:0;font-size:11px;opacity:.85;font-variant-numeric:tabular-nums}
.mp-item .mp-amt:last-of-type{width:6.5rem;font-weight:400}
.mp-x{opacity:.55;padding:2px 5px;border-radius:4px;font-size:12px;line-height:1;flex-shrink:0}
.mp-x:hover{opacity:1;background:rgba(0,0,0,.12)}
.mp-add{font-size:11px;opacity:.75;margin-left:auto;padding:2px 6px;border-radius:4px;border:1px dashed currentColor}
.mp-add:hover{opacity:1}
.mp-color{width:8rem;font-size:11px;height:24px;padding:0 4px}
.mp-summary{display:flex;flex-direction:column;gap:3px}
.mp-sum{padding:5px 8px;border-radius:4px;font-size:13px}
.mp-sum .mp-pct{width:3.6rem}
.mp-sum b{margin-left:auto}
.muted-inherit{opacity:.7}
/* ---- кредиты ---- */
.ln-table td,.ln-table th{padding:4px 6px;vertical-align:middle}
.ln-table .mp-in{background:var(--surface-raised);border-color:var(--border);height:30px;color:var(--text-primary)}
.ln-name{width:11rem;min-width:8rem}.ln-num{width:8rem;text-align:right}.ln-short{width:4.5rem;text-align:right}
.ln-total{font-weight:600;color:var(--text-primary)}
.ln-months{border-collapse:separate;border-spacing:0;font-size:12px;min-width:max-content}
.ln-months th,.ln-months td{padding:5px 8px;white-space:nowrap;border-bottom:1px solid var(--border)}
.ln-months thead th{background:#1e2d63;color:#fff;font-weight:600;text-align:right}
.ln-months thead th.ln-sticky{text-align:left}
.ln-sticky{position:sticky;left:0;background:var(--surface);z-index:1;text-align:left;font-weight:500;color:var(--text-primary);min-width:10rem;border-right:1px solid var(--border)}
.ln-months thead .ln-sticky{background:#1e2d63}
.ln-months tfoot .ln-sticky,.ln-months tfoot td{background:color-mix(in srgb,var(--page) 60%,var(--surface));font-weight:600;color:var(--text-primary)}
.ln-paid{background:#d03b3b;color:#fff;font-weight:700;text-align:center}
.ln-done{background:color-mix(in srgb,var(--text-muted) 8%,transparent)}
.ln-advice{border-radius:8px;padding:12px 14px;background:color-mix(in srgb,var(--status-good) 12%,transparent);border:1px solid color-mix(in srgb,var(--status-good) 40%,transparent)}
tr.ln-hi td{background:color-mix(in srgb,var(--status-good) 14%,transparent);font-weight:600}
@media(max-width:520px){.mp-item{flex-wrap:wrap}.mp-item .mp-name{flex-basis:100%;order:-1}.mp-amt{width:6.5rem}}

.theme-toggle button{gap:5px;font-size:12px;padding:0 8px}
.tt-label{font-weight:500}
@media(max-width:400px){.topbar .tt-label{display:none}}
.sidebar{overflow-x:hidden}
.theme-toggle button{padding:0 4px;font-size:11px;gap:4px;min-width:0}
/* ---- связь плана с кредитами ---- */
.mp-loan{display:inline-flex;align-items:center;justify-content:flex-end;width:6.5rem;height:26px;padding:0 6px;border-radius:4px;font-weight:600;background:rgba(255,255,255,.55);color:inherit;text-decoration:none;white-space:nowrap}
.mp-block[style*="color:#ffffff"] .mp-loan,.mp-block[style*="color:#fff"] .mp-loan{background:rgba(255,255,255,.12)}
.mp-loan:hover{text-decoration:underline}
.mp-paid{display:inline-flex;align-items:center;gap:4px;font-size:11px;white-space:nowrap;cursor:pointer;opacity:.9}
.mp-linksel{width:12rem;font-size:12px}
tr.ln-sel td{background:color-mix(in srgb,var(--nav-loans) 12%,transparent)}

.brand>span:last-child{display:flex;flex-direction:column;line-height:1.2}
.brand-date{font-size:10px;font-weight:400;color:var(--text-muted);white-space:nowrap}
.topbar .brand-date{display:none}
.mp-chk{width:14px;height:14px;flex-shrink:0;margin:0;cursor:pointer;accent-color:currentColor}
.mp-done .mp-amt,.mp-done .mp-name{opacity:.55;text-decoration:line-through}
.mp-progress .bar{background:color-mix(in srgb,var(--text-muted) 20%,transparent)}

/* ---- банки в списке кредитов ---- */
tr.ln-bank td{background:color-mix(in srgb,var(--nav-loans) 10%,transparent);padding:8px 6px;border-top:2px solid var(--border)}
tr.ln-bank-sel td{background:color-mix(in srgb,var(--nav-loans) 22%,transparent)}

<script>
// ===================== money =====================
const CURRENCIES = {
  KZT:{code:"KZT",decimals:2,name:"Казахстанский тенге"}, RUB:{code:"RUB",decimals:2,name:"Российский рубль"},
  USD:{code:"USD",decimals:2,name:"Доллар США"}, EUR:{code:"EUR",decimals:2,name:"Евро"}, GBP:{code:"GBP",decimals:2,name:"Фунт стерлингов"},
  KGS:{code:"KGS",decimals:2,name:"Киргизский сом"}, UZS:{code:"UZS",decimals:2,name:"Узбекский сум"}, TRY:{code:"TRY",decimals:2,name:"Турецкая лира"},
  CNY:{code:"CNY",decimals:2,name:"Китайский юань"}, JPY:{code:"JPY",decimals:0,name:"Японская иена"},
};
const DEFAULT_CURRENCY = "KZT";
function currencyInfo(code){ code=String(code||"").toUpperCase(); return CURRENCIES[code] || {code, decimals:2, name:code}; }
function decimalsFor(code){ return currencyInfo(code).decimals; }
const SPACE_CHARS = /[\s  ]/g;
function parseMoneyInput(input, currency=DEFAULT_CURRENCY){
  const decimals = decimalsFor(currency);
  let s = String(input).replace(SPACE_CHARS,"");
  if (s==="") throw new Error("Пустая сумма");
  let negative=false;
  if (s.startsWith("-")||s.startsWith("−")){negative=true;s=s.slice(1);} else if (s.startsWith("+")) s=s.slice(1);
  if (s.startsWith("(")&&s.endsWith(")")){negative=true;s=s.slice(1,-1);}
  s = s.replace(/[₸₽$€£¥₺]/g,"").replace(/[a-zA-Zа-яА-Я]/g,"");
  if (!/^[0-9.,]+$/.test(s)) throw new Error(`Не удалось разобрать сумму: «${input}»`);
  const lastComma=s.lastIndexOf(","), lastDot=s.lastIndexOf(".");
  let intPart, fracPart;
  if (lastComma>=0&&lastDot>=0){
    const sep = lastComma>lastDot?",":"."; const group = sep===","?".":",";
    const cut=s.lastIndexOf(sep); intPart=s.slice(0,cut).split(group).join(""); fracPart=s.slice(cut+1);
  } else if (lastComma>=0||lastDot>=0){
    const sep = lastComma>=0?",":"."; const parts=s.split(sep); const tail=parts[parts.length-1];
    const isGrouping = parts.length>2 || (tail.length===3 && parts[0].length<=3 && decimals!==3);
    if (isGrouping){intPart=parts.join("");fracPart="";} else {intPart=parts.slice(0,-1).join("");fracPart=tail;}
  } else {intPart=s;fracPart="";}
  if (intPart==="") intPart="0";
  if (!/^\d*$/.test(intPart)||!/^\d*$/.test(fracPart)) throw new Error(`Не удалось разобрать сумму: «${input}»`);
  const kept = fracPart.slice(0,decimals).padEnd(decimals,"0");
  const nextDigit = fracPart.charAt(decimals);
  let minor = Number(intPart)*10**decimals + Number(kept===""?"0":kept);
  if (nextDigit!=="" && Number(nextDigit)>=5) minor+=1;
  return negative?-minor:minor;
}
function formatMoney(minor, currency=DEFAULT_CURRENCY, options={}){
  const {locale="ru-RU", decimals="auto", signDisplay="auto", compact=false} = options;
  const info=currencyInfo(currency); const major = minor/10**info.decimals;
  const hasFraction = minor % 10**info.decimals !== 0;
  const showFraction = decimals==="always" || (decimals==="auto"&&hasFraction);
  const fd = showFraction?info.decimals:0;
  try{
    return new Intl.NumberFormat(locale,{style:"currency",currency:info.code,currencyDisplay:"narrowSymbol",minimumFractionDigits:fd,maximumFractionDigits:fd,signDisplay,notation:compact?"compact":"standard"}).format(major);
  }catch{ return `${major.toFixed(fd)} ${info.code}`; }
}
function fmt(minor,cur){ return formatMoney(minor,cur,{decimals:"never"}); }
function fmtSigned(minor,cur){ return formatMoney(minor,cur,{decimals:"never",signDisplay:"exceptZero"}); }
function formatMoneyCompact(minor,currency=DEFAULT_CURRENCY,locale="ru-RU"){ return formatMoney(minor,currency,{locale,compact:true,decimals:"never"}); }
function percentOf(part,whole){ return whole===0?0:(part/whole)*100; }

// ===================== dates (UTC, ISO strings) =====================
const MS_PER_DAY=86400000;
function toDateOnly(v){ if (typeof v==="string"){const p=parseFlexibleDate(v); if(!p) throw new Error(`Не удалось разобрать дату: «${v}»`); return p;} return new Date(Date.UTC(v.getUTCFullYear(),v.getUTCMonth(),v.getUTCDate())); }
function todayUtc(){ const n=new Date(); return new Date(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())); }
function formatDateISO(d){ return d.toISOString().slice(0,10); }
function isoToDate(iso){ return new Date(iso+"T00:00:00Z"); }
function addDays(d,n){ return new Date(d.getTime()+n*MS_PER_DAY); }
function addMonths(d,n){ const y=d.getUTCFullYear(), m=d.getUTCMonth()+n, day=d.getUTCDate(); const dim=new Date(Date.UTC(y,m+1,0)).getUTCDate(); return new Date(Date.UTC(y,m,Math.min(day,dim))); }
function startOfMonth(d){ return new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),1)); }
function endOfMonth(d){ return new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)); }
function startOfYear(d){ return new Date(Date.UTC(d.getUTCFullYear(),0,1)); }
function endOfYear(d){ return new Date(Date.UTC(d.getUTCFullYear(),11,31)); }
function startOfWeek(d,w=1){ const day=d.getUTCDay(); const diff=(day-w+7)%7; return addDays(toDateOnly(d),-diff); }
function endOfWeek(d,w=1){ return addDays(startOfWeek(d,w),6); }
function periodRange(kind,anchor,w=1){ const d=toDateOnly(anchor); if(kind==="WEEKLY") return {start:startOfWeek(d,w),end:endOfWeek(d,w)}; if(kind==="YEARLY") return {start:startOfYear(d),end:endOfYear(d)}; return {start:startOfMonth(d),end:endOfMonth(d)}; }
function shiftPeriod(kind,anchor,steps,w=1){ const d=toDateOnly(anchor); if(kind==="WEEKLY") return periodRange("WEEKLY",addDays(d,steps*7),w); if(kind==="YEARLY") return periodRange("YEARLY",new Date(Date.UTC(d.getUTCFullYear()+steps,0,1))); return periodRange("MONTHLY",addMonths(startOfMonth(d),steps)); }
function lastMonths(n,anchor=todayUtc()){ const base=startOfMonth(toDateOnly(anchor)); return Array.from({length:n},(_,i)=>{const s=addMonths(base,i-(n-1)); return {start:s,end:endOfMonth(s)};}); }
function isWithin(d,r){ const t=toDateOnly(d).getTime(); return t>=r.start.getTime()&&t<=r.end.getTime(); }
function daysBetween(a,b){ return Math.round((toDateOnly(b).getTime()-toDateOnly(a).getTime())/MS_PER_DAY); }
function daysRemaining(r,today=todayUtc()){ if(today.getTime()>r.end.getTime()) return 0; const from=today.getTime()<r.start.getTime()?r.start:today; return daysBetween(from,r.end)+1; }
const MONTHS_RU=["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
const MONTHS_RU_SHORT=["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
function formatMonthLabel(d,style="long"){ return (style==="short"?MONTHS_RU_SHORT:MONTHS_RU)[d.getUTCMonth()]; }
function formatRangeLabel(r,kind="MONTHLY"){ const y=r.start.getUTCFullYear(); if(kind==="WEEKLY") return `${r.start.getUTCDate()}–${r.end.getUTCDate()} ${formatMonthLabel(r.end,"short")}`; if(kind==="YEARLY") return String(y); return `${formatMonthLabel(r.start)} ${y}`; }
function formatDateHuman(iso){ const [y,m,d]=iso.split("-"); return `${Number(d)}.${m}.${y}`; }
const DATE_PATTERNS=[{re:/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/,order:[0,1,2]},{re:/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})$/,order:[2,1,0]},{re:/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2})$/,order:[2,1,0]}];
function parseFlexibleDate(input){
  const raw=String(input).trim(); if(!raw) return null; const datePart=raw.split(/[ T]/)[0];
  for (const {re,order} of DATE_PATTERNS){ const m=datePart.match(re); if(!m) continue; const parts=[m[1],m[2],m[3]]; let year=Number(parts[order[0]]); const month=Number(parts[order[1]]), day=Number(parts[order[2]]); if(year<100) year+= year<70?2000:1900; if(month<1||month>12||day<1||day>31) return null; const d=new Date(Date.UTC(year,month-1,day)); if(d.getUTCMonth()!==month-1||d.getUTCDate()!==day) return null; return d; }
  return null;
}

// ===================== scale =====================
function niceStep(rough){ if(rough<=0) return 1; const mag=10**Math.floor(Math.log10(rough)); const n=rough/mag; const step=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10; return step*mag; }
function niceScale(rawMin,rawMax,targetTicks=4){

// ===================== analytics (tx.date is ISO string) =====================
function txDate(t){ return isoToDate(t.date); }
function inRange(txs,range){ return txs.filter(t=>isWithin(txDate(t),range)); }
function accountBalance(account,txs){
  let b=account.openingBalance;

  return [...totals.entries()].map(([id,v])=>{ const c=id?byId.get(id):undefined; return {categoryId:id,name:c?.name??"Без категории",color:c?.color??"#94a3b8",icon:c?.icon??"?",amount:v.amount,share:percentOf(v.amount,grand),transactionCount:v.count}; }).sort((a,b)=>b.amount-a.amount);

function monthlySeries(txs,months=6,anchor){ return lastMonths(months,anchor).map(r=>{const f=cashFlow(txs,r); return {label:formatRangeLabel(r),start:r.start,income:f.income,expense:f.expense,net:f.net};}); }
function balanceTrend(accounts,txs,range,base){
  const relevant=accounts.filter(a=>a.currency===base&&!a.archived); const ids=new Set(relevant.map(a=>a.id)); if(ids.size===0) return [];
  const opening=relevant.reduce((a,x)=>a+x.openingBalance,0);
  const delta=t=>{ let d=0; if(ids.has(t.accountId)) d+= t.type==="INCOME"?t.amount:-t.amount; if(t.type==="TRANSFER"&&t.toAccountId&&ids.has(t.toAccountId)) d+= t.toAmount??t.amount; return d; };
  const sorted=[...txs].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  let running=opening, i=0; const startIso=formatDateISO(range.start);
  while(i<sorted.length&&sorted[i].date<startIso){ running+=delta(sorted[i]); i++; }
  const points=[]; const cursor=new Date(range.start.getTime());
  while(cursor.getTime()<=range.end.getTime()){ const iso=formatDateISO(cursor); while(i<sorted.length&&sorted[i].date<=iso){ running+=delta(sorted[i]); i++; } points.push({date:iso,value:running}); cursor.setUTCDate(cursor.getUTCDate()+1); }

}

  return {budget,categoryName:category?.name??"Все расходы",categoryColor:category?.color??"#6366f1",spent,limit:budget.limitAmount,remaining,percent,status,dailyAllowance:remaining>0&&daysLeft>0?Math.floor(remaining/daysLeft):0};
}

  const saved=contributions.reduce((a,c)=>a+c.amount,0); const remaining=Math.max(0,goal.targetAmount-saved); const percent=Math.min(100,percentOf(saved,goal.targetAmount)); const achieved=saved>=goal.targetAmount;

const ASSET_KIND_LABEL={REAL_ESTATE:"Недвижимость",VEHICLE:"Транспорт",EQUIPMENT:"Техника и электроника",FURNITURE:"Мебель и быт",VALUABLES:"Ценности",BUSINESS:"Доля в бизнесе",OTHER:"Прочее"};

function netWorth(balances,assets,debts,base){
  let liquid=0,assetTotal=0,debtTotal=0,excluded=0;
  for(const a of balances){ if(a.archived) continue; if(a.currency!==base){excluded++;continue;} liquid+=a.balance; }
  for(const a of assets){ if(a.archived) continue; if(a.currency!==base){excluded++;continue;} assetTotal+=a.value; }

const RESERVE_ACCOUNT_TYPES=new Set(["SAVINGS","CASH"]);
function reserve(txs,categories,balances,{months,comfortMinimum,baseCurrency,anchor,lookbackMonths=3}){
  const essentialIds=new Set(categories.filter(c=>c.essential).map(c=>c.id));
  const ranges=lastMonths(lookbackMonths+1,anchor).slice(0,lookbackMonths);
  const essentialSpend=r=>{ let t=0; for(const x of txs){ if(x.type!=="EXPENSE"||!x.categoryId||!essentialIds.has(x.categoryId)) continue; if(!isWithin(txDate(x),r)) continue; t+=x.amount; } return t; };
  const essentialMonthly=ranges.length===0?0:Math.round(ranges.reduce((a,r)=>a+essentialSpend(r),0)/ranges.length);
  const basis=Math.max(essentialMonthly,comfortMinimum); const requiredForMonths=basis*months;
  const saved=balances.filter(b=>!b.archived&&b.currency===baseCurrency&&RESERVE_ACCOUNT_TYPES.has(b.type)).reduce((a,b)=>a+b.balance,0);
  return {essentialMonthly,comfortMinimum,basis,requiredForMonths,months,saved,percent:requiredForMonths>0?Math.min(100,percentOf(saved,requiredForMonths)):0,monthsCovered:basis>0?saved/basis:0,enough:requiredForMonths>0&&saved>=requiredForMonths};

function planVsFact(plans,txs,year,throughMonth=12){

  const months=MONTHS_RU.map((label,i)=>{ const month=i+1; const mp=plans.filter(p=>p.year===year&&p.month===month); const pi=sumBy(mp,"INCOME"), pe=sumBy(mp,"EXPENSE"); const f=cashFlow(txs,{start:new Date(Date.UTC(year,i,1)),end:new Date(Date.UTC(year,i+1,0))}); return {month,label,plannedIncome:pi,plannedExpense:pe,actualIncome:f.income,actualExpense:f.expense,plannedNet:pi-pe,actualNet:f.net}; });

  const sum=k=>months.reduce((a,m)=>a+m[k],0);

  const elapsed={monthsCounted:counted,plannedIncome:done.reduce((a,m)=>a+m.plannedIncome,0),plannedExpense:done.reduce((a,m)=>a+m.plannedExpense,0),actualIncome:done.reduce((a,m)=>a+m.actualIncome,0),actualExpense:done.reduce((a,m)=>a+m.actualExpense,0)};

const MAX_MONTHS=600;
function buildSchedule(terms,extra={}){
  const monthlyRate=terms.annualRateBp/10000/12; const payment=terms.monthlyPayment+(extra.monthlyExtra??0);
  let balance=Math.max(0,terms.balance-(extra.lumpSum??0));
  if(balance===0) return {points:[],months:0,totalInterest:0,totalPaid:0,outcome:"no-debt"};
  const firstInterest=Math.round(balance*monthlyRate); if(payment<=firstInterest) return {points:[],months:0,totalInterest:0,totalPaid:0,outcome:"never"};
  const points=[]; let totalInterest=0,totalPaid=0;
  for(let month=1; month<=MAX_MONTHS&&balance>0; month++){ const interest=Math.round(balance*monthlyRate); const due=balance+interest; const actual=Math.min(payment,due); const principal=actual-interest; balance=Math.max(0,balance-principal); totalInterest+=interest; totalPaid+=actual; points.push({month,balance,interest,principal,payment:actual}); }
  return {points,months:points.length,totalInterest,totalPaid,outcome:balance===0?"paid":"never"};
}
function comparePayoff(terms,extra){ const base=buildSchedule(terms), accelerated=buildSchedule(terms,extra); const ok=base.outcome==="paid"&&accelerated.outcome==="paid"; return {base,accelerated,monthsSaved:ok?base.months-accelerated.months:0,interestSaved:ok?base.totalInterest-accelerated.totalInterest:0}; }

function monthsWord(n){ const a=Math.abs(n)%100, b=a%10; if(a>10&&a<20) return "месяцев"; if(b===1) return "месяц"; if(b>=2&&b<=4) return "месяца"; return "месяцев"; }
function termLabel(months){ if(months<=0) return "—"; const years=Math.floor(months/12), rest=months%12; if(years===0) return `${months} ${monthsWord(months)}`; const yw=years===1?"год":years>=2&&years<=4?"года":"лет"; return rest===0?`${years} ${yw}`:`${years} ${yw} ${rest} ${monthsWord(rest)}`; }

function ruleMatches(rule,row){
  const merchant=(row.merchant??"").toLowerCase(), note=(row.description??"").toLowerCase();
  const targets=(rule.field==="MERCHANT"?[merchant]:rule.field==="NOTE"?[note]:[merchant,note]).filter(Boolean); if(targets.length===0) return false;
  const pattern=rule.pattern.toLowerCase().trim(); if(!pattern) return false;
  if(rule.match==="EQUALS") return targets.some(t=>t===pattern);
  if(rule.match==="REGEX"){ try{ const re=new RegExp(rule.pattern,"i"); return targets.some(t=>re.test(t)); }catch{ return false; } }
  return targets.some(t=>t.includes(pattern));
}
function categorize(row,rules){ const active=rules.filter(r=>r.enabled).sort((a,b)=>a.priority-b.priority); for(const r of active) if(ruleMatches(r,row)) return r.categoryId; return null; }

const HEADER_HINTS={date:["дата","date","күн","мерзімі"],amount:["сумма","amount","сома","сомасы","оборот"],debit:["расход","списание","дебет","debit","withdrawal","шығыс"],credit:["приход","поступление","кредит","credit","deposit","кіріс","зачисление"],description:["описание","назначение","детали","description","details","комментарий","примечание","purpose"],merchant:["контрагент","получатель","отправитель","мерчант","merchant","payee","место","терминал","counterparty"],currency:["валюта","currency","валютасы"]};

function findHeaderRow(rows){ const limit=Math.min(rows.length,25); for(let i=0;i<limit;i++){ const cells=rows[i].map(c=>String(c).toLowerCase().trim()); if(cells.filter(c=>c!=="").length<2) continue; const hasDate=cells.some(c=>HEADER_HINTS.date.some(h=>c.includes(h))); const hasAmount=cells.some(c=>[...HEADER_HINTS.amount,...HEADER_HINTS.debit,...HEADER_HINTS.credit].some(h=>c.includes(h))); if(hasDate&&hasAmount) return i; } return 0; }

  try{ const old=localStorage.getItem(LEGACY_KEY); if(old){ const o=JSON.parse(old);

// ===================== UI primitives =====================
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function card({title,subtitle,action,body,cls=""}){ const head=(title||action)?`<header class="card-head"><div class="min0">${title?`<h2>${title}</h2>`:""}${subtitle?`<p class="sub">${subtitle}</p>`:""}</div>${action?`<div class="shrink0">${action}</div>`:""}</header>`:""; return `<section class="card ${cls}">${head}${body}</section>`; }
function tile({label,value,hint,delta,accent}){ return `<div class="tile"><p class="label">${accent?`<span class="dot sm" style="background:${accent}"></span>`:""}${esc(label)}</p><p class="value">${esc(value)}</p><div class="foot">${delta?`<span class="delta" style="color:${delta.good?"var(--success-text)":"var(--status-critical)"}"><span aria-hidden>${delta.direction==="up"?"↑":delta.direction==="down"?"↓":"→"}</span>${esc(delta.value)}</span>`:""}${hint?`<span>${esc(hint)}</span>`:""}</div></div>`; }
function bar(percent,color,label){ const c=Math.max(0,Math.min(100,percent)); return `<div class="bar" role="progressbar" aria-valuenow="${Math.round(c)}" aria-valuemin="0" aria-valuemax="100" aria-label="${esc(label)}"><div style="width:${c}%;background:${color}"></div></div>`; }
const TONES={good:{color:"var(--status-good)",icon:"✓",label:"в норме"},warning:{color:"var(--status-warning)",icon:"!",label:"близко к лимиту"},critical:{color:"var(--status-critical)",icon:"✕",label:"превышен"},neutral:{color:"var(--text-muted)",icon:"•",label:""}};
function badge(tone,text){ const t=TONES[tone]; return `<span class="badge" style="--bc:${t.color}"><span aria-hidden>${t.icon}</span>${esc(text??t.label)}</span>`; }
function dot(color){ return `<span class="dot" style="background:${esc(color)}"></span>`; }
function empty(title,desc,action){ return `<div class="empty"><p class="t">${esc(title)}</p>${desc?`<p class="d">${esc(desc)}</p>`:""}${action?`<div class="mt2">${action}</div>`:""}</div>`; }
function field({label,id,error,hint,cls=""},inner){ return `<div class="field ${cls}"><label for="${id}">${esc(label)}</label>${inner}${hint&&!error?`<p class="hint">${esc(hint)}</p>`:""}${error?`<p class="err" role="alert">${esc(error)}</p>`:""}</div>`; }
function msg(ok,text){ if(!text) return ""; return `<p class="msg ${ok?"ok":"bad"}" role="status"><span aria-hidden>${ok?"✓":"✕"}</span>${esc(text)}</p>`; }
function pageHeader(title,desc,action){ return `<header class="page-header"><div><h1>${esc(title)}</h1>${desc?`<p class="desc">${esc(desc)}</p>`:""}</div>${action??""}</header>`; }
function options(list,selected,placeholder){ return (placeholder!==undefined?`<option value="">${esc(placeholder)}</option>`:"")+list.map(o=>`<option value="${esc(o.value)}"${String(o.value)===String(selected??"")?" selected":""}>${esc(o.label)}</option>`).join(""); }
function statusColor(status){ return status==="exceeded"?"var(--status-critical)":status==="warning"?"var(--status-warning)":"var(--status-good)"; }
function statusTone(status){ return status==="exceeded"?"critical":status==="warning"?"warning":"good"; }

// ===================== router =====================
const ROUTES={};
const UI={}; // ephemeral per-view state
let CURRENT={path:"/",params:{}};
function parseHash(){ const h=location.hash.replace(/^#/,"")||"/"; const [p,q]=h.split("?"); const params={}; if(q) for(const [k,v] of new URLSearchParams(q)) params[k]=v; return {path:p||"/",params}; }
function navigate(path){ location.hash="#"+path; }
function href(path){ return "#"+path; }
/** Разделы, куда возвращаемся «туда, откуда ушли»: с вкладкой, месяцем и прокруткой. */
const REMEMBER_ROUTES=new Set(["/loans","/month"]);
function render(){
  const prev=CURRENT; UI.lastVisit=UI.lastVisit||{}; if(prev&&prev.hash) UI.lastVisit[prev.path]={hash:prev.hash,y:window.scrollY};
  const next=parseHash(); const saved=UI.lastVisit[next.path];
  if(REMEMBER_ROUTES.has(next.path)&&next.path!==prev.path&&Object.keys(next.params).length===0&&saved&&saved.hash!==location.hash){ location.hash=saved.hash; return; }
  const restoreY=next.path!==prev.path&&saved&&saved.hash===location.hash?saved.y:0;
  CURRENT={...next,hash:location.hash}; const route=ROUTES[CURRENT.path]||ROUTES["/"];
  const main=document.getElementById("main"); main.innerHTML=`<div class="shell ${CURRENT.path==="/loans"?"wide":""}">${route(CURRENT.params)}</div>`;
  document.querySelectorAll(".nav-item").forEach(el=>{ const p=el.dataset.path; const active=p==="/"?CURRENT.path==="/":CURRENT.path.startsWith(p); el.classList.toggle("active",active); if(active) el.setAttribute("aria-current","page"); else el.removeAttribute("aria-current"); });
  const focus=main.querySelector("[autofocus]"); if(focus) focus.focus();
  window.scrollTo(0,restoreY||0);
}
function rerender(){ const y=window.scrollY; const route=ROUTES[CURRENT.path]||ROUTES["/"]; document.getElementById("main").innerHTML=`<div class="shell ${CURRENT.path==="/loans"?"wide":""}">${route(CURRENT.params)}</div>`; window.scrollTo(0,y); }
function commit(){ saveDb(); rerender(); }

function readTheme(){ try{ const s=localStorage.getItem(THEME_KEY); if(s==="light"||s==="dark"||s==="system") return s; }catch{} return "system"; }
function applyTheme(mode){ const r=document.documentElement; if(mode==="system") r.removeAttribute("data-theme"); else r.setAttribute("data-theme",mode); }
function themeToggle(){ const mode=readTheme(); return `<div class="theme-toggle" role="radiogroup" aria-label="Оформление">${THEME_MODES.map(m=>`<button type="button" role="radio" aria-checked="${mode===m.value}" title="${m.label} тема" data-act="theme" data-mode="${m.value}" class="${mode===m.value?"active":""}"><span aria-hidden>${m.icon}</span><span class="tt-label">${m.label}</span></button>`).join("")}</div>`; }
function renderChrome(){
  const todayLbl=new Intl.DateTimeFormat("ru-RU",{day:"numeric",month:"long",year:"numeric",timeZone:"UTC"}).format(todayUtc()); const wd=new Intl.DateTimeFormat("ru-RU",{weekday:"long",timeZone:"UTC"}).format(todayUtc());
  const brand=`<a class="brand" href="#/"><span class="brand-mark" aria-hidden>₸</span><span>Финансы<span class="brand-date">${todayLbl}, ${wd}</span><button type="button" class="sync-status" data-act="syncNow"></button></span></a>`;
  document.getElementById("sidebar").innerHTML=brand+themeToggle()+navLinks();
  document.getElementById("topbar").innerHTML=brand+themeToggle();
  document.getElementById("bottomnav").innerHTML=navLinks();
  if(typeof syncPaint==="function") syncPaint();
}

// ===================== actions & forms (event delegation) =====================
const ACTIONS={};
const FORMS={};
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return; const fn=ACTIONS[el.dataset.act]; if(!fn) return; e.preventDefault(); fn(el,e);
});
document.addEventListener("submit",e=>{
  const form=e.target.closest("form[data-form]"); if(!form) return; e.preventDefault(); const fn=FORMS[form.dataset.form]; if(!fn) return;
  const fd=new FormData(form); const data={}; for(const [k,v] of fd.entries()) data[k]=typeof v==="string"?v:v; fn(data,form);
});
document.addEventListener("change",e=>{ const el=e.target.closest("[data-change]"); if(!el) return; const fn=ACTIONS[el.dataset.change]; if(fn) fn(el,e); });
document.addEventListener("input",e=>{ const el=e.target.closest("[data-input]"); if(!el) return; const fn=ACTIONS[el.dataset.input]; if(fn) fn(el,e); });
document.addEventListener("focusout",e=>{ const el=e.target.closest("[data-blur]"); if(!el) return; const fn=ACTIONS[el.dataset.blur]; if(fn) fn(el,e); });
ACTIONS.theme=el=>{ const m=el.dataset.mode; try{localStorage.setItem(THEME_KEY,m);}catch{} applyTheme(m); renderChrome(); };
ACTIONS.toggle=el=>{ const k=el.dataset.key; UI[k]=!UI[k]; delete UI[k+"_state"]; rerender(); };

// ===================== chart hover =====================
const CHARTS={};
document.addEventListener("pointermove",e=>{ const el=e.target.closest("[data-chart]"); if(!el) return; const c=CHARTS[el.dataset.chart]; if(!c) return; const rect=el.getBoundingClientRect(); const ratio=(e.clientX-rect.left)/rect.width; c.hover(ratio,el); });
document.addEventListener("pointerleave",e=>{ const el=e.target.closest?e.target.closest("[data-chart]"):null; if(!el) return; const c=CHARTS[el.dataset.chart]; if(c) c.leave(el); },true);
document.addEventListener("pointerout",e=>{ const el=e.target.closest?e.target.closest("[data-chart]"):null; if(!el) return; if(el.contains(e.relatedTarget)) return; const c=CHARTS[el.dataset.chart]; if(c) c.leave(el); });

function balanceTrendChart({id,points,currency,title,subtitle}){
  UI[id+"_table"]=UI[id+"_table"]||false;
  const toggle=`<button type="button" class="link-btn xxs med" data-act="toggle" data-key="${id}_table" aria-expanded="${UI[id+"_table"]}">${UI[id+"_table"]?"График":"Таблица"}</button>`;
  if(points.length===0) return card({title,subtitle,action:toggle,body:`<p class="xs muted" style="padding:40px 0;text-align:center">Нет данных за период</p>`});
  if(UI[id+"_table"]) return card({title,subtitle,action:toggle,body:`<div class="scroll-x"><table style="min-width:24rem"><thead><tr><th>Дата</th><th class="r">Остаток</th></tr></thead><tbody class="tabular">${points.map(p=>`<tr><td>${formatDayMonth(p.date)}</td><td class="r">${esc(formatMoney(p.value,currency))}</td></tr>`).join("")}</tbody></table></div>`});
  const W=800,H=240,PAD={top:16,right:20,bottom:28,left:82}; const values=points.map(p=>p.value); const {min,max,ticks}=niceScale(Math.min(...values),Math.max(...values));
  const plotW=W-PAD.left-PAD.right, plotH=H-PAD.top-PAD.bottom;
  const x=i=>PAD.left+(points.length===1?plotW/2:(i/(points.length-1))*plotW); const y=v=>PAD.top+plotH-((v-min)/(max-min||1))*plotH;
  const line=points.map((p,i)=>`${i===0?"M":"L"}${x(i).toFixed(2)},${y(p.value).toFixed(2)}`).join(" "); const baseline=y(Math.max(min,Math.min(max,0)));
  const area=`${line} L${x(points.length-1).toFixed(2)},${baseline} L${x(0).toFixed(2)},${baseline} Z`; const last=points[points.length-1];
  const step=Math.max(1,Math.ceil(points.length/7)); let labels=""; for(let i=0;i<points.length;i+=step) labels+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--text-muted)" class="tabular">${Number(points[i].date.slice(8,10))}</text>`;
  CHARTS[id]={hover:(ratio,el)=>{ const i=Math.max(0,Math.min(points.length-1,Math.round(ratio*(points.length-1)))); const p=points[i]; const wrap=el.closest(".chart-wrap"); wrap.querySelector(".hover-g").innerHTML=`<line x1="${x(i)}" x2="${x(i)}" y1="${PAD.top}" y2="${H-PAD.bottom}" stroke="var(--axis)"/><circle cx="${x(i)}" cy="${y(p.value)}" r="5" fill="var(--series-1)" stroke="var(--surface)" stroke-width="2"/>`; const tt=wrap.querySelector(".tooltip"); tt.style.display="block"; tt.style.left=`${(x(i)/W)*100}%`; tt.innerHTML=`<p class="muted">${formatDayMonth(p.date)}</p><p class="tabular semi">${esc(formatMoney(p.value,currency))}</p>`; },leave:el=>{ const wrap=el.closest(".chart-wrap"); wrap.querySelector(".hover-g").innerHTML=""; wrap.querySelector(".tooltip").style.display="none"; }};
  const svg=`<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}. Остаток на конец периода ${esc(formatMoney(last.value,currency))}"><defs><linearGradient id="${id}-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--series-1)" stop-opacity=".22"/><stop offset="100%" stop-color="var(--series-1)" stop-opacity=".02"/></linearGradient></defs>
  ${ticks.map(t=>`<g><line x1="${PAD.left}" x2="${W-PAD.right}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text x="${PAD.left-10}" y="${y(t)}" text-anchor="end" dominant-baseline="middle" font-size="11" fill="var(--text-muted)" class="tabular">${esc(formatMoneyCompact(t,currency))}</text></g>`).join("")}
  <path d="${area}" fill="url(#${id}-fill)"/><path d="${line}" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="${x(points.length-1)}" cy="${y(last.value)}" r="4" fill="var(--series-1)" stroke="var(--surface)" stroke-width="2"/><g class="hover-g"></g>${labels}
  <rect x="${PAD.left}" y="${PAD.top}" width="${plotW}" height="${plotH}" fill="transparent" data-chart="${id}"/></svg><div class="tooltip" style="display:none"></div></div>`;
  return card({title,subtitle,action:toggle,body:svg});
}
function formatDayMonth(iso){ const [,m,d]=iso.split("-"); return `${Number(d)}.${m}`; }

function monthlyFlowChart({id,points,currency,title,subtitle}){
  const legend=`<ul class="legend"><li><span class="sw" style="background:var(--series-1)"></span>Доходы</li><li><span class="sw" style="background:var(--series-2)"></span>Расходы</li></ul>`;
  const toggle=`<button type="button" class="link-btn xxs med" data-act="toggle" data-key="${id}_table">${UI[id+"_table"]?"График":"Таблица"}</button>`;
  const action=`<div class="row">${legend}${toggle}</div>`;
  if(UI[id+"_table"]) return card({title,subtitle,action,body:`<div class="scroll-x"><table style="min-width:24rem"><thead><tr><th>Месяц</th><th class="r">Доходы</th><th class="r">Расходы</th><th class="r">Разница</th></tr></thead><tbody class="tabular">${points.map(p=>`<tr><td>${esc(p.label)}</td><td class="r">${esc(formatMoney(p.income,currency))}</td><td class="r">${esc(formatMoney(p.expense,currency))}</td><td class="r">${esc(formatMoney(p.net,currency,{signDisplay:"exceptZero"}))}</td></tr>`).join("")}</tbody></table></div>`});
  if(points.length===0) return card({title,subtitle,action,body:`<p class="xs muted" style="padding:40px 0;text-align:center">Нет данных за период</p>`});
  const W=800,H=260,PAD={top:16,right:16,bottom:40,left:82},GAP=2; const {max,ticks}=niceScale(0,Math.max(1,...points.flatMap(p=>[p.income,p.expense])));
  const plotW=W-PAD.left-PAD.right, plotH=H-PAD.top-PAD.bottom; const groupW=plotW/points.length; const barW=Math.max(4,groupW/2-GAP*1.5); const y=v=>PAD.top+plotH-(v/max)*plotH;
  CHARTS[id]={hover:(ratio,el)=>{ const px=ratio*W; const i=Math.max(0,Math.min(points.length-1,Math.floor((px-PAD.left)/groupW))); const p=points[i]; const wrap=el.closest(".chart-wrap"); wrap.querySelectorAll("[data-bar]").forEach(g=>g.setAttribute("opacity",g.dataset.bar==String(i)?"1":"0.45")); const tt=wrap.querySelector(".tooltip"); tt.style.display="block"; tt.style.left=`${((PAD.left+i*groupW+groupW/2)/W)*100}%`; tt.innerHTML=`<p class="med mb2" style="margin-bottom:4px">${esc(p.label)}</p><p class="sec"><span class="sw" style="background:var(--series-1)"></span>Доходы<span class="v tabular ink">${esc(formatMoney(p.income,currency))}</span></p><p class="sec"><span class="sw" style="background:var(--series-2)"></span>Расходы<span class="v tabular ink">${esc(formatMoney(p.expense,currency))}</span></p>`; },leave:el=>{ const wrap=el.closest(".chart-wrap"); wrap.querySelectorAll("[data-bar]").forEach(g=>g.setAttribute("opacity","1")); wrap.querySelector(".tooltip").style.display="none"; }};
  const bars=points.map((p,i)=>{ const gx=PAD.left+i*groupW; const ix=gx+groupW/2-barW-GAP/2, ex=gx+groupW/2+GAP/2; const [m,yr]=p.label.split(" "); return `<g data-bar="${i}"><rect x="${ix}" y="${y(p.income)}" width="${barW}" height="${Math.max(0,plotH+PAD.top-y(p.income))}" rx="4" fill="var(--series-1)"/><rect x="${ex}" y="${y(p.expense)}" width="${barW}" height="${Math.max(0,plotH+PAD.top-y(p.expense))}" rx="4" fill="var(--series-2)"/><text x="${gx+groupW/2}" y="${H-22}" text-anchor="middle" font-size="11" fill="var(--text-muted)">${esc(m.slice(0,3))}</text><text x="${gx+groupW/2}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--text-muted)" class="tabular">${esc(yr)}</text></g>`; }).join("");
  const svg=`<div class="chart-wrap scroll-x"><svg viewBox="0 0 ${W} ${H}" style="min-width:38rem" role="img" aria-label="${esc(title)}">${ticks.map(t=>`<g><line x1="${PAD.left}" x2="${W-PAD.right}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text x="${PAD.left-10}" y="${y(t)}" text-anchor="end" dominant-baseline="middle" font-size="11" fill="var(--text-muted)" class="tabular">${esc(formatMoneyCompact(t,currency))}</text></g>`).join("")}${bars}<line x1="${PAD.left}" x2="${W-PAD.right}" y1="${PAD.top+plotH}" y2="${PAD.top+plotH}" stroke="var(--axis)"/><rect x="${PAD.left}" y="${PAD.top}" width="${plotW}" height="${plotH}" fill="transparent" data-chart="${id}"/></svg><div class="tooltip" style="display:none"></div></div>`;
  return card({title,subtitle,action,body:svg});
}

function categoryBreakdownChart({id,rows,currency,title,subtitle,total}){
  const toggle=`<button type="button" class="link-btn xxs med" data-act="toggle" data-key="${id}_table">${UI[id+"_table"]?"График":"Таблица"}</button>`;
  if(UI[id+"_table"]) return card({title,subtitle,action:toggle,body:`<div class="scroll-x"><table style="min-width:24rem"><thead><tr><th>Категория</th><th class="r">Сумма</th><th class="r">Доля</th><th class="r">Операций</th></tr></thead><tbody class="tabular">${rows.map(r=>`<tr><td>${esc(r.name)}</td><td class="r">${esc(formatMoney(r.amount,currency))}</td><td class="r">${r.share.toFixed(1)}%</td><td class="r">${r.transactionCount}</td></tr>`).join("")}</tbody></table></div>`});
  const visible=rows.slice(0,8), tail=rows.slice(8);
  const items=tail.length>1?[...visible,{categoryId:null,name:`Прочее (${tail.length})`,icon:"…",amount:tail.reduce((a,r)=>a+r.amount,0),share:tail.reduce((a,r)=>a+r.share,0),transactionCount:tail.reduce((a,r)=>a+r.transactionCount,0)}]:visible;
  const max=Math.max(1,...items.map(i=>i.amount));
  const list=items.length===0?`<p class="xs muted" style="padding:40px 0;text-align:center">За период трат не было</p>`:`<ol class="stack" style="gap:10px">${items.map(it=>{ const content=`<div class="between xs"><span class="row min0" style="gap:6px"><span aria-hidden style="font-size:14px;line-height:1">${esc(it.icon)}</span><span class="trunc">${esc(it.name)}</span><span class="tabular muted shrink0">${it.share.toFixed(0)}%</span></span><span class="tabular med shrink0">${esc(fmt(it.amount,currency))}</span></div><div class="bar mt1" style="background:color-mix(in srgb,var(--text-muted) 14%,transparent)"><div style="width:${(it.amount/max)*100}%;background:var(--series-1)"></div></div>`; return `<li>${it.categoryId?`<a href="#/transactions?categoryId=${it.categoryId}" style="display:block;border-radius:6px;padding:4px;margin:-4px" class="hoverable">${content}</a>`:`<div>${content}</div>`}</li>`; }).join("")}</ol>`;
  const foot=total>0?`<p class="between xs divider mt4"><span class="muted">Всего за период</span><span class="tabular semi">${esc(fmt(total,currency))}</span></p>`:"";
  return card({title,subtitle,action:toggle,body:list+foot});
}

// ===================== стрелки между ячейками — везде, где есть строки с полями =====================
// Строка — ближайший .mp-row или tr; поля — input/select в ней (без чекбоксов и кнопок).
// Таблица кредитов имеет свой обработчик (tr[data-loan-id]) и здесь пропускается.
document.addEventListener("keydown",e=>{
  if(!["ArrowRight","ArrowLeft","ArrowUp","ArrowDown"].includes(e.key)) return;
  const el=e.target; if(!el||!el.closest) return; if(el.closest("tr[data-loan-id]")) return;
  const tag=el.tagName; if(tag!=="INPUT"&&tag!=="SELECT") return; if(el.type==="checkbox"||el.type==="radio"||el.type==="file") return;
  const row=el.closest(".mp-row, tr"); if(!row) return;
  const fields=r=>[...r.querySelectorAll("input,select")].filter(x=>x.type!=="checkbox"&&x.type!=="radio"&&x.type!=="hidden"&&!x.disabled);
  const cells=fields(row); const idx=cells.indexOf(el); if(idx<0) return;
  const go=t=>{ if(!t) return; e.preventDefault(); t.focus(); if(t.tagName==="INPUT"&&typeof t.select==="function"&&t.type!=="date") t.select(); };
  const caretAtEnd=()=>{ try{ return el.selectionStart===el.selectionEnd&&el.selectionEnd>=el.value.length; }catch{ return true; } };
  const caretAtStart=()=>{ try{ return el.selectionStart===el.selectionEnd&&el.selectionStart===0; }catch{ return true; } };
  if(e.key==="ArrowRight"){ if(tag==="INPUT"&&el.type!=="date"&&!caretAtEnd()) return; go(cells[idx+1]); return; }
  if(e.key==="ArrowLeft"){ if(tag==="INPUT"&&el.type!=="date"&&!caretAtStart()) return; go(cells[idx-1]); return; }
  if(tag==="SELECT") return; // у списка ↑/↓ меняют значение
  const rowSel=row.matches("tr")?"tr":".mp-row"; const container=row.matches("tr")?row.closest("tbody,table"):row.closest(".mp-block");
  const rows=[...(container||document).querySelectorAll(rowSel)].filter(r=>fields(r).length); const ri=rows.indexOf(row); if(ri<0) return;
  const next=rows[ri+(e.key==="ArrowDown"?1:-1)]; if(!next) return;
  const field=el.dataset.field; const nf=fields(next); go((field&&nf.find(x=>x.dataset.field===field))||nf[Math.min(idx,nf.length-1)]);
});

  const {settings,accounts,categories,transactions,budgets,goals,current,anchor}=dashboardData(); const base=settings.baseCurrency;
  const balances=accountBalances(accounts,transactions); const nw=totalNetWorth(balances,base); const flow=cashFlow(transactions,current);

  const today=todayUtc(); const trendRange={start:current.start,end:today<current.end?today:current.end};
  const trend=balanceTrend(accounts,transactions,trendRange,base); const months=monthlySeries(transactions,12,anchor); const breakdown=breakdownByCategory(transactions,categories,{range:current}); const merchants=topMerchants(transactions,current,5); const daysLeft=daysRemaining(current);

  </div>`;

  return header+tgFlash+`<div class="stack">${tiles}${charts}<div class="grid g3">${budgetsCard}${goalsCard}${accountsCard}</div></div>`;

  const editing=UI.txEditing;

  return header+filters+`<div class="stack">${form}${list}</div>`+pager;
};
function txForm(d,accounts,categories,st){

  <div class="form-grid c2">
    ${field({label:"Сумма",id:"tx-amount",error:fe.amount,hint:account?`в ${account.currency}`:undefined},`<input id="tx-amount" name="amount" value="${esc(d.amount)}" required inputmode="decimal" placeholder="12 500" class="input" autofocus>`)}

function readTxForm(){ const f=document.querySelector('form[data-form="txSave"]'); if(!f) return UI.txEditing; const fd=new FormData(f); const o={...UI.txEditing}; for(const [k,v] of fd.entries()) o[k]=v; return o; }
ACTIONS.txNew=()=>{ const accounts=activeAccounts(); if(!accounts.length) return; UI.txEditing={type:"EXPENSE",date:formatDateISO(todayUtc()),amount:"",accountId:accounts[0].id}; UI.txState={}; rerender(); };
ACTIONS.txEdit=el=>{ const t=DB.transactions.find(x=>x.id===el.dataset.id); if(!t) return; UI.txEditing={id:t.id,type:t.type,date:t.date,amount:String(t.amount/100).replace(".",","),accountId:t.accountId,toAccountId:t.toAccountId,toAmount:t.toAmount===null?null:String(t.toAmount/100).replace(".",","),categoryId:t.categoryId,merchant:t.merchant,note:t.note,owner:t.owner||""}; UI.txState={}; rerender(); };
ACTIONS.txCancel=()=>{ UI.txEditing=null; UI.txState={}; rerender(); };
ACTIONS.txType=el=>{ UI.txEditing={...readTxForm(),type:el.dataset.type}; rerender(); };
ACTIONS.txAccount=el=>{ if(el.value==="__new"){ const name=(prompt("Название карты или счёта (например: Kaspi Gold, Алатау, Наличные)")||"").trim(); const draft=readTxForm(); if(!name){ UI.txEditing={...draft,accountId:draft.accountId}; return rerender(); } const acc={id:uid(),name:name.slice(0,80),type:/налич/i.test(name)?"CASH":"CARD",currency:DB.settings.baseCurrency,openingBalance:0,color:bankColor(name),archived:false,sortOrder:DB.accounts.length+1}; DB.accounts.push(acc); saveDb(); UI.txEditing={...draft,accountId:acc.id}; return rerender(); } UI.txEditing={...readTxForm(),accountId:el.value}; rerender(); };
ACTIONS.txOwner=el=>{ UI.txEditing={...readTxForm(),owner:el.dataset.owner}; rerender(); };
ACTIONS.txToAccount=el=>{ UI.txEditing={...readTxForm(),toAccountId:el.value}; rerender(); };
ACTIONS.txConfirm=el=>{ UI.txConfirm=el.dataset.id; rerender(); };
ACTIONS.txCancelDelete=()=>{ UI.txConfirm=null; rerender(); };
ACTIONS.txDelete=el=>{ DB.transactions=DB.transactions.filter(t=>t.id!==el.dataset.id); UI.txConfirm=null; commit(); };
FORMS.txFilter=data=>{ const qp=new URLSearchParams(); for(const [k,v] of Object.entries(data)) if(v) qp.set(k,v); navigate(`/transactions?${qp}`); };
FORMS.txSave=input=>{
  const fail=(message,fieldErrors)=>{ UI.txEditing={...readTxForm()}; UI.txState={ok:false,message,fieldErrors}; rerender(); };
  if(!/^\d{4}-\d{2}-\d{2}$/.test(input.date||"")) return fail("Проверьте заполнение формы",{date:"Дата должна быть в формате ГГГГ-ММ-ДД"});
  const account=DB.accounts.find(a=>a.id===input.accountId); if(!account) return fail("Счёт не найден",{accountId:"Счёт не найден"});
  const amount=parseAmountField(input.amount||"",account.currency); if(!amount.ok) return fail(amount.error,{amount:amount.error}); if(amount.value<0) return fail("Сумма должна быть положительной",{amount:"Введите положительную сумму"});
  let toAmount=null, toAccountId=null;
  if(input.type==="TRANSFER"){ if(!input.toAccountId) return fail("Проверьте заполнение формы",{toAccountId:"Выберите счёт-получатель"}); if(input.toAccountId===input.accountId) return fail("Проверьте заполнение формы",{toAccountId:"Счёт-получатель должен отличаться от счёта-источника"}); const toAcc=DB.accounts.find(a=>a.id===input.toAccountId); if(!toAcc) return fail("Счёт-получатель не найден",{toAccountId:"Счёт не найден"}); toAccountId=toAcc.id;
    if(toAcc.currency!==account.currency){ const raw=nullable(input.toAmount); if(!raw) return fail("Укажите сумму зачисления",{toAmount:`Счета в разных валютах (${account.currency} → ${toAcc.currency}), укажите сумму зачисления`}); const c=parseAmountField(raw,toAcc.currency); if(!c.ok) return fail(c.error,{toAmount:c.error}); toAmount=Math.abs(c.value); } }
  const data={type:input.type,date:input.date,amount:amount.value,currency:account.currency,accountId:input.accountId,owner:(input.owner==="М"||input.owner==="Л")?input.owner:null,toAccountId,toAmount,categoryId:input.type==="TRANSFER"?null:nullable(input.categoryId),merchant:nullable((input.merchant||"").slice(0,120)),note:nullable((input.note||"").slice(0,500))};
  if(input.id){ const i=DB.transactions.findIndex(t=>t.id===input.id); if(i>=0) DB.transactions[i]={...DB.transactions[i],...data}; } else DB.transactions.push({id:uid(),importBatchId:null,dedupeHash:null,createdAt:Date.now(),...data});
  UI.txEditing=null; UI.txState={}; commit();
};

ROUTES["/goals"]=function(){

  const rows=DB.goals.filter(g=>!g.archived).map(g=>{ const cs=goalAllContributions(g); const p=goalProgress(g,cs); return {...p,contributions:cs,planInfo:goalPlanInfo(g)}; }).sort((a,b)=>b.percent-a.percent);
  const totalSaved=rows.reduce((a,r)=>a+r.saved,0), totalTarget=rows.reduce((a,r)=>a+r.goal.targetAmount,0); const st=UI.goal_state||{};

  </div>${st.ok===false?msg(false,st.message):""}<div class="actions"><button type="submit" class="btn primary">Создать</button></div></form>`}):"";
  const cards=rows.length===0?empty("Целей пока нет","Цель показывает, сколько уже накоплено и сколько нужно откладывать каждый месяц, чтобы успеть к сроку."):`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))">${rows.map(r=>{ const g=r.goal; const adding=UI["goalAdd_"+g.id]; const cst=UI["goalAdd_"+g.id+"_state"]||{};

    <p class="xs mt2">${r.achieved?`<span class="med" style="color:var(--success-text)">✓ Цель достигнута</span>`:`<span class="sec"><span class="tabular med ink">${r.percent.toFixed(0)}%</span> · осталось <span class="tabular">${esc(fmt(r.remaining,g.currency))}</span></span>`}</p>
    ${r.monthlyRequired!==null&&!r.achieved?`<p class="note-box mt2">Чтобы успеть к сроку, откладывайте <span class="tabular semi ink">${esc(fmt(r.monthlyRequired,g.currency))}</span> в месяц${r.monthsLeft>0?` — осталось ${r.monthsLeft} мес.`:r.monthsLeft===0?" — срок уже наступил":""}</p>`:""}
    ${r.planInfo?`<p class="xs mt2" style="color:var(--text-secondary)">📎 Из плана «${esc(r.planInfo.envelope)}»: ${r.planInfo.paid?`внесено ${esc(fmt(r.planInfo.paid,r.currency))}`:"пока ничего не отмечено"}${r.planInfo.plannedMonthly?` · по плану ${esc(fmt(r.planInfo.plannedMonthly,r.currency))} в ${esc(r.planInfo.month)}`:""}</p>`:""}<div class="divider">${adding?`<form data-form="goalContribute" class="form" style="gap:12px"><input type="hidden" name="goalId" value="${g.id}"><div class="form-grid c2">${field({label:"Сумма",id:"gc-amount-"+g.id,error:cst.fieldErrors?.amount},`<input id="gc-amount-${g.id}" name="amount" required inputmode="decimal" placeholder="50 000" class="input" autofocus>`)}${field({label:"Дата",id:"gc-date-"+g.id},`<input id="gc-date-${g.id}" name="date" type="date" value="${today}" required class="input">`)}</div>${cst.ok===false?msg(false,cst.message):""}<div class="actions"><button type="button" class="btn secondary sm" data-act="toggle" data-key="goalAdd_${g.id}">Отмена</button><button type="submit" class="btn primary sm">Добавить</button></div></form>`

FORMS.goalSave=input=>{

FORMS.goalContribute=input=>{

  DB.contributions.push({id:uid(),goalId:goal.id,date:input.date,amount:a.value,note:null}); UI[key]=false; UI[key+"_state"]={}; commit();
};

function loanBalanceChart(baseSeries,fastSeries,start,cur){
  const W=800,H=230,PAD={top:14,right:18,bottom:26,left:82}; const sb=[start,...baseSeries], sf=fastSeries?[start,...fastSeries]:null; const count=Math.max(sb.length,sf?.length??0);
  const niceMax=v=>{ const rough=v/3; const mag=Math.pow(10,Math.floor(Math.log10(rough||1))); const n=rough/mag; const step=(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*mag; return Math.ceil(v/step)*step; };
  const max=niceMax(Math.max(...sb,...(sf??[0]))); const plotW=W-PAD.left-PAD.right, plotH=H-PAD.top-PAD.bottom; const x=i=>PAD.left+(count<=1?plotW/2:(i/(count-1))*plotW); const y=v=>PAD.top+plotH-(v/(max||1))*plotH; const ticks=[0,max/3,(max/3)*2,max];
  const path=s=>s.map((v,i)=>`${i===0?"M":"L"}${x(i).toFixed(2)},${y(v).toFixed(2)}`).join(" "); const step=Math.max(1,Math.ceil(count/7));
  const legend=`<ul class="legend"><li><span class="sw" style="background:var(--series-2)"></span>Как сейчас</li>${sf?`<li><span class="sw" style="background:var(--series-1)"></span>С досрочным</li>`:""}</ul>`;
  const svg=`<div class="scroll-x"><svg viewBox="0 0 ${W} ${H}" style="min-width:32rem;width:100%;height:auto" role="img" aria-label="Остаток долга по месяцам">${ticks.map(t=>`<g><line x1="${PAD.left}" x2="${W-PAD.right}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text x="${PAD.left-10}" y="${y(t)}" text-anchor="end" dominant-baseline="middle" font-size="11" fill="var(--text-muted)" class="tabular">${esc(formatMoney(t,cur,{compact:true,decimals:"never"}))}</text></g>`).join("")}<path d="${path(sb)}" fill="none" stroke="var(--series-2)" stroke-width="2" stroke-linejoin="round"/>${sf?`<path d="${path(sf)}" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round"/>`:""}${Array.from({length:count},(_,i)=>i).filter(i=>i%step===0).map(i=>`<text x="${x(i)}" y="${H-7}" text-anchor="middle" font-size="11" fill="var(--text-muted)" class="tabular">${i+1}</text>`).join("")}</svg></div>`;
  return card({title:"Остаток долга по месяцам",subtitle:sf?"Сравнение с досрочным погашением":"При текущем платеже",action:legend,body:svg});
}

/** Месяц для лимитов из плана: из параметров; иначе текущий, если план есть; иначе ближайший заведённый план. */
function budgetPlanMonth(params){ mpEnsure(); const today=todayUtc(); let py=Number(params&&params.year), pm=Number(params&&params.month); let fallback=false;
  if(!(py>=2000&&pm>=1&&pm<=12)){ py=today.getUTCFullYear(); pm=today.getUTCMonth()+1; if(!mpFind(py,pm)){ const cand=[...DB.monthPlans].sort((a,b)=>(a.year*12+a.month)-(b.year*12+b.month)); const next=cand.find(p=>(p.year*12+p.month)>=(py*12+pm))||cand[cand.length-1]; if(next){ py=next.year; pm=next.month; fallback=true; } } }
  const range=periodRange("MONTHLY",new Date(Date.UTC(py,pm-1,1))); return {py,pm,range,daysLeft:daysRemaining(range),fallback}; }
/** Строки «план/факт» по категориям для месяца плана — для страницы бюджетов и для бота. */
function mpBudgetRows(py,pm){ const cur=DB.settings.baseCurrency; const categories=activeCategories(); const range=periodRange("MONTHLY",new Date(Date.UTC(py,pm-1,1))); const daysLeft=daysRemaining(range); const items=mpBudgetItems(py,pm);
  const byCat=new Map(); for(const it of items){ const k=it.category.id; if(!byCat.has(k)) byCat.set(k,{category:it.category,amount:0,items:[]}); const e=byCat.get(k); e.amount+=it.amount; e.items.push(it.item.name); }
  return [...byCat.values()].map(e=>{ const pr=budgetProgress({id:"plan:"+e.category.id,categoryId:e.category.id,limitAmount:e.amount,currency:cur,period:"MONTHLY"},DB.transactions,range,categories,daysLeft); return {...pr,items:e.items,deviation:pr.spent-e.amount,deviationPct:e.amount>0?percentOf(pr.spent-e.amount,e.amount):0}; }).sort((a,b)=>b.percent-a.percent); }

const ACC_SOURCES=[["","—"],["salary","зарплата"],["advance","аванс"],["savings","накопления"],["credit","кредитные деньги"],["gift","подаренные"],["freelance","подработка"],["business","бизнес"],["sale","продажа"],["refund","возврат"],["other","прочее"]];

/** Лимиты из плана: каждый конверт — лимит; факт = операции по категориям строк (+ строки, отмеченные «оплачено»). */
function mpLimitRows(py,pm){ const p=mpFind(py,pm); if(!p) return []; const cur=DB.settings.baseCurrency; const range=periodRange("MONTHLY",new Date(Date.UTC(py,pm-1,1))); const daysLeft=daysRemaining(range); const txs=inRange(DB.transactions,range).filter(t=>t.type==="EXPENSE");
  const spentByCat=new Map(); for(const t of txs){ const k=t.categoryId||null; spentByCat.set(k,(spentByCat.get(k)||0)+t.amount); }
  const usedCats=new Set(); const out=[];
  for(const g of p.groups){ const rows=[]; let plan=0, fact=0; for(const i of g.items){ const c=mpItemCategory(i); const paid=mpItemPaid(i); let f=0; if(c&&!usedCats.has(c.id)){ usedCats.add(c.id); f=spentByCat.get(c.id)||0; if(paid&&f<i.amount) f=i.amount; } else f=paid?i.amount:0; plan+=i.amount; fact+=f; rows.push({name:i.name,plan:i.amount,fact:f,paid,category:c?c.name:null}); }

      ${g.items.length===0?`<div class="mp-row"><span class="mp-amt" style="text-align:right">-</span><span class="muted-inherit">нет статей</span></div>`:g.items.map(i=>`<div class="mp-row mp-item ${mpItemPaid(i)?"mp-done":""}"><input type="checkbox" class="mp-chk" ${mpItemPaid(i)?"checked":""} data-change="mpPaid" data-id="${i.id}" title="${mpItemPaid(i)?"Потрачено / оплачено":"Отметить как потраченное"}" aria-label="Потрачено">${mpAmountInput(i.id,"amount",i.amount,mpItemLinked(i)&&mpItemLoans(i).length&&!i.early?'aria-label="Сумма" readonly title="Платёж = сумма платежей связанных кредитов, берётся из раздела «Кредиты»" style="opacity:.9;border-style:dashed"':'aria-label="Сумма" placeholder="сумма"')}<span class="mp-pct" data-mp-pct="i-${i.id}">${mpPct(i.amount,t.income)}</span>${mpGroupIsEarly(g)?mpEarlySelect(i):`<input class="mp-in mp-name" value="${esc(i.name)}" data-change="mpEdit" data-id="${i.id}" data-field="name" placeholder="статья" aria-label="Название">`}${mpGroupIsLoans(g)?mpRemainingCell(i,plan):""}${(()=>{ const c=mpItemCategory(i); return c?`<span class="mp-catmark" title="Лимит в «Лимитах»: ${esc(c.name)}${i.categoryId?"":" (по названию)"}">${esc(c.icon)}</span>`:""; })()}<button type="button" class="mp-x" data-act="mpLink" data-id="${i.id}" title="${mpItemLinked(i)?"Связано: "+esc(mpItemLinkLabel(i))+" — изменить":i.categoryId?"Лимит в «Лимитах» — изменить связь":"Связать с кредитами, банком или категорией"}" aria-label="Связать" style="${mpItemLinked(i)||i.categoryId?"opacity:1":""}${mpGroupIsLoans(g)&&!mpGroupIsEarly(g)?"":";display:none"}">🔗</button><button type="button" class="mp-x" data-act="mpItemDel" data-id="${i.id}" aria-label="Удалить строку">✕</button></div>${UI.mpLinking===i.id?mpLinkPanel(i):""}${mpGroupIsEarly(g)?mpEarlyNote(i):""}`).join("")}
      <div class="mp-row mp-foot"><b class="tabular" data-mp="gt-${g.id}">${esc(fmt(total,cur))}</b><span class="mp-pct" data-mp-pct="gt-${g.id}">${mpPct(total,t.income)}</span>${g.items.length?`<span class="xxs muted-inherit" style="font-weight:400">✓ ${g.items.filter(mpItemPaid).length} из ${g.items.length}${mpGroupSpent(g)?` · потрачено ${esc(fmt(mpGroupSpent(g),cur))}`:""}</span>`:""}${!mpGroupIsEarly(g)&&(/кредит/i.test(g.name)||g.items.some(mpItemLinked))&&DB.debts.some(d=>!d.archived)?`<button type="button" class="mp-add" data-act="mpSyncLoans" data-id="${g.id}" title="Пересчитать платежи связанных строк по разделу «Кредиты» (платёж = сумма платежей выбранных кредитов)">⟳ Пересчитать из кредитов</button>`:""}<button type="button" class="mp-add" data-act="mpItemAdd" data-id="${g.id}" style="margin-left:6px">+ строка</button></div></section>`; }).join("");
  const addGroup=`<form data-form="mpGroupAdd" class="row" style="flex-wrap:wrap;gap:8px"><input name="name" placeholder="Новая группа (конверт)" class="input" style="flex:1;min-width:10rem;height:36px"><select name="color" class="select" style="width:12rem;height:36px">${MP_PALETTE.map(([c,l])=>`<option value="${c}" style="background:${c};color:${mpTextColor(c)}">● ${l}</option>`).join("")}</select><button type="submit" class="btn secondary sm" style="height:36px">Добавить группу</button></form>`;
  const tools=`<div class="row xs muted" style="flex-wrap:wrap;gap:8px 16px;margin-top:4px"><span>Суммы в ${cur}. Третья колонка в строке — остаток долга (для кредитов), на итоги не влияет.</span><button type="button" class="link-btn" data-act="mpDeletePlan" data-id="${plan.id}" style="color:var(--status-critical)">Удалить план за этот месяц</button></div>`;
  const prog=mpProgress(plan,t);
  const progressCard=`<div class="mp-block mp-progress" style="background:var(--surface);color:var(--text-primary);border:1px solid var(--border)"><div class="between xs" style="margin-bottom:6px"><span class="semi">Сегодня ${prog.todayLabel}</span><span class="muted">${prog.monthNote}</span></div>
    <div class="bar" style="height:10px;position:relative;overflow:visible"><div style="width:${prog.spentPct}%;background:${prog.spentPct>prog.elapsedPct+10?"var(--status-critical)":prog.spentPct>prog.elapsedPct?"var(--status-warning)":"var(--status-good)"}"></div><span title="Прошло ${prog.elapsedPct.toFixed(0)}% месяца" style="position:absolute;top:-3px;left:${prog.elapsedPct}%;width:2px;height:16px;background:var(--text-primary);transform:translateX(-1px)"></span></div>
    <div class="between xs mt2" style="flex-wrap:wrap;gap:4px 12px"><span><b class="tabular">${esc(fmt(t.paid,cur))}</b> потрачено — <b>${prog.spentPct.toFixed(0)}%</b> плана · ${mpPct(t.paid,t.income)} дохода</span><span class="muted">прошло ${prog.elapsedPct.toFixed(0)}% месяца</span></div>
    <p class="xxs muted mt1">${prog.hint}</p></div>`;
  return header+(UI.mpFlash?`<div class="mb3">${msg(true,UI.mpFlash)}</div>`:"")+(UI.mpHistory?mpHistoryCard(plan):"")+`<div class="mp-layout"><div class="stack" style="gap:12px">${progressCard}${incomes}${summary}</div><div class="stack" style="gap:12px">${groups}${addGroup}${mpSubscriptionsCard(plan)}${tools}</div></div>`;
};
// ---- пересчёт без полной перерисовки (чтобы не терять фокус при вводе)
function mpRecalc(plan){ const cur=DB.settings.baseCurrency; const t=mpTotals(plan); const set=(sel,v)=>{ const el=document.querySelector(sel); if(el) el.textContent=v; };
  set('[data-mp="income"]',fmt(t.income,cur)); set('[data-mp="spent"]',fmt(t.spent,cur)); set('[data-mp="left"]',fmtSigned(t.left,cur)); set('[data-mp="spent2"]',fmt(t.spent,cur)); set('[data-mp="left2"]',fmtSigned(t.left,cur)); set('[data-mp-pct="spent2"]',mpPct(t.spent,t.income)); set('[data-mp-pct="left2"]',mpPct(t.left,t.income)); { const l2=document.querySelector('[data-mp="left2"]'); if(l2){ l2.style.color=t.left<0?"#b91c1c":"#065f46"; l2.parentElement.style.background=t.left<0?"#fde2e2":"#bfe8cc"; } } set('[data-mp-pct="spent"]',mpPct(t.spent,t.income)); set('[data-mp-pct="left"]',mpPct(t.left,t.income));
  const left=document.querySelector('[data-mp="left"]'); if(left) left.style.color=t.left<0?"#ff8080":"inherit";
  for(const i of plan.incomes) set(`[data-mp-pct="inc-${i.id}"]`,mpPct(i.amount,t.income));
  for(const {g,total} of t.groups){ set(`[data-mp="g-${g.id}"]`,fmt(total,cur)); set(`[data-mp-pct="g-${g.id}"]`,mpPct(total,t.income)); { const el=document.querySelector(`[data-mp-dev="g-${g.id}"]`); if(el){ const fact=t.income>0?total/t.income*100:0; const has=g.planPct!==undefined&&g.planPct!==null&&g.planPct!==""; const dev=has?fact-Number(g.planPct):null; el.innerHTML=mpDevText(dev,has?total-Math.round(Number(g.planPct)/100*t.income):undefined); el.style.cssText=mpDevStyle(dev,mpRecommend(g.name)); } } set(`[data-mp="gt-${g.id}"]`,fmt(total,cur)); set(`[data-mp-pct="gt-${g.id}"]`,mpPct(total,t.income)); for(const i of g.items) set(`[data-mp-pct="i-${i.id}"]`,mpPct(i.amount,t.income)); }
}
function mpCurrent(){ return mpFind(UI.mpYear,UI.mpMonth); }
function mpParse(raw){ const v=(raw||"").trim(); if(v===""||v==="-"||v==="—") return 0; try{ return Math.abs(parseMoneyInput(v,DB.settings.baseCurrency)); }catch{ return null; } }
ACTIONS.mpEdit=el=>{ const p=mpCurrent(); if(!p) return; const id=el.dataset.id, f=el.dataset.field;
  if(f==="income"){ const i=p.incomes.find(x=>x.id===id); const v=mpParse(el.value); if(v===null){ el.style.outline="2px solid var(--status-critical)"; return; } el.style.outline=""; i.amount=v; el.value=v?String(Math.round(v/100)).replace(/\B(?=(\d{3})+(?!\d))/g," "):""; }
  else { let item; for(const g of p.groups){ item=g.items.find(x=>x.id===id); if(item) break; } if(!item) return; if(f==="name") item.name=el.value.trim(); else { const v=mpParse(el.value); if(v===null){ el.style.outline="2px solid var(--status-critical)"; return; } el.style.outline=""; item[f]=v; el.value=v?String(Math.round(v/100)).replace(/\B(?=(\d{3})+(?!\d))/g," "):""; } }
  saveDb(); mpRecalc(p); };
ACTIONS.mpPayday=el=>{ const p=mpCurrent(); if(p){ p.payday=el.value; saveDb(); } };

ACTIONS.mpGroupColor=el=>{ const p=mpCurrent(); const g=p&&p.groups.find(x=>x.id===el.dataset.id); if(g){ g.color=el.value; commit(); } };
ACTIONS.mpGroupDel=el=>{ const p=mpCurrent(); if(!p) return; const g=p.groups.find(x=>x.id===el.dataset.id); if(g&&g.items.length>0&&!confirm(`Удалить группу «${g.name}» вместе с ${g.items.length} строками?`)) return; p.groups=p.groups.filter(x=>x.id!==el.dataset.id); commit(); };
ACTIONS.mpItemAdd=el=>{ const p=mpCurrent(); const g=p&&p.groups.find(x=>x.id===el.dataset.id); if(!g) return; const item={id:uid(),name:"",amount:0,remaining:0}; g.items.push(item); commit(); const inp=document.querySelector(`input[data-id="${item.id}"][data-field="amount"]`); if(inp) inp.focus(); };
ACTIONS.mpItemDel=el=>{ const p=mpCurrent(); if(!p) return; for(const g of p.groups) g.items=g.items.filter(x=>x.id!==el.dataset.id); commit(); };
FORMS.mpGroupAdd=d=>{ const p=mpCurrent(); if(!p) return; const name=(d.name||"").trim(); if(!name) return; p.groups.push({id:uid(),name,color:d.color||"#64748b",items:[]}); commit(); };
ACTIONS.mpCreate=el=>{ mpEnsure(); DB.monthPlans.push({id:uid(),year:Number(el.dataset.y),month:Number(el.dataset.m),payday:mpLastDay(Number(el.dataset.y),Number(el.dataset.m)),incomes:[{id:uid(),name:"Л",amount:0},{id:uid(),name:"М",amount:0}],groups:[]}); commit(); };
ACTIONS.mpCopy=el=>{ const src=DB.monthPlans.find(p=>p.id===el.dataset.src); if(!src) return; const copy=JSON.parse(JSON.stringify(src)); copy.id=uid(); copy.year=Number(el.dataset.y); copy.month=Number(el.dataset.m); copy.payday=""; copy.incomes.forEach(i=>i.id=uid()); copy.groups.forEach(g=>{ g.id=uid(); g.items.forEach(i=>i.id=uid()); }); DB.monthPlans.push(copy); commit(); };
